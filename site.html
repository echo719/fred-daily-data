<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>每日精进</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#ECEEF1; --sheet:#FAFBFC; --sheet-2:#F2F4F7;
  --ink:#161B21; --ink-soft:#5A646F; --ink-faint:#8792A0;
  --rule:#D3D8DE; --rule-soft:#E2E6EB;
  --macro:#0F5B55; --macro-tint:#DCEAE7;
  --eng:#8E5210; --eng-tint:#F3E7D5;
  --bio:#6A3F8E; --bio-tint:#ECE4F3;
  --mark:#FBEEC6; --mark-line:#E7C96B;
  --ok:#2E7D5B;
  --sans:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --serif:"Newsreader","PingFang SC","Songti SC",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --shadow:0 1px 2px rgba(22,27,33,.05),0 8px 24px -16px rgba(22,27,33,.25);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0F1319; --sheet:#161B23; --sheet-2:#1C222B;
    --ink:#E3E8EE; --ink-soft:#94A0AE; --ink-faint:#6B7684;
    --rule:#262E39; --rule-soft:#1F2630;
    --macro:#54C7B2; --macro-tint:#14302E;
    --eng:#E2A458; --eng-tint:#2E2418;
  --bio:#C3A2E6; --bio-tint:#2A2135;
    --bio:#C3A2E6; --bio-tint:#2A2135;
    --mark:rgba(226,164,88,.15); --mark-line:rgba(226,164,88,.55);
    --ok:#5FBF92;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0F1319; --sheet:#161B23; --sheet-2:#1C222B;
  --ink:#E3E8EE; --ink-soft:#94A0AE; --ink-faint:#6B7684;
  --rule:#262E39; --rule-soft:#1F2630;
  --macro:#54C7B2; --macro-tint:#14302E;
  --eng:#E2A458; --eng-tint:#2E2418;
  --bio:#C3A2E6; --bio-tint:#2A2135;
  --mark:rgba(226,164,88,.15); --mark-line:rgba(226,164,88,.55);
  --ok:#5FBF92;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -16px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.72;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--macro);outline-offset:2px;border-radius:3px}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky; top:0; z-index:30;
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--rule);
}
.topbar-inner{
  max-width:1180px; margin:0 auto; padding-block:10px;
  padding-inline:20px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:auto}
.brand b{font-weight:600;font-size:16px;letter-spacing:.01em}
.brand span{font-family:var(--mono);font-size:11px;color:var(--ink-faint);letter-spacing:.06em}
.tool{
  font-family:var(--mono); font-size:12px; color:var(--ink-soft);
  border:1px solid var(--rule); border-radius:999px; padding:4px 11px;
  transition:background .15s,border-color .15s;
}
.tool:hover{background:var(--sheet);border-color:var(--ink-faint)}
input[type="date"]{
  font-family:var(--mono);font-size:12px;color:var(--ink-soft);
  background:var(--sheet);border:1px solid var(--rule);border-radius:999px;
  padding:4px 10px;
}

/* ---------- 日期轨 ---------- */
.rail-wrap{
  position:sticky; top:49px; z-index:29;
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--rule);
}
.daterail{
  max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:9px;
  display:flex;gap:5px;overflow-x:auto;scrollbar-width:thin;
  scroll-snap-type:x proximity;
}
.daterail::-webkit-scrollbar{height:5px}
.daterail::-webkit-scrollbar-thumb{background:var(--rule);border-radius:9px}
.dcell{
  flex:0 0 auto;scroll-snap-align:center;
  width:44px;padding:5px 0 6px;border-radius:9px;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  border:1px solid transparent;color:var(--ink-faint);
  transition:background .14s,color .14s,border-color .14s;
}
.dcell:hover{background:var(--sheet-2);color:var(--ink-soft)}
.dcell .wd{font-size:10.5px;line-height:1.3}
.dcell .md{font-family:var(--mono);font-size:12.5px;font-weight:500;line-height:1.35}
.dcell .dots{display:flex;gap:3px;height:4px;margin-top:2px}
.dcell i{width:4px;height:4px;border-radius:50%;background:var(--rule);display:block}
.dcell i.on-e{background:var(--eng)}
.dcell i.on-m{background:var(--macro)}
.dcell i.on-b{background:var(--bio)}
.dcell.has{color:var(--ink-soft)}
.dcell.mon{box-shadow:inset 2px 0 0 var(--rule)}
.dcell.today .md{color:var(--macro)}
.dcell.sel{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.dcell.sel .md,.dcell.sel .wd{color:var(--paper)}
.dcell.sel i{background:color-mix(in srgb,var(--paper) 45%,transparent)}
.dcell.sel i.on-e{background:var(--mark-line)}
.dcell.sel i.on-m{background:#7FD8C6}
.dcell.sel i.on-b{background:#D9C2F2}

/* ---------- 骨架 ---------- */
.shell{
  max-width:1180px;margin:0 auto;padding-inline:20px;
  padding-block:28px 72px;
  display:grid;grid-template-columns:250px minmax(0,1fr);gap:46px;
  align-items:start;
}
@media (max-width:1000px){
  .shell{grid-template-columns:minmax(0,1fr);gap:22px;padding-block:20px 56px}
}

/* ---------- 左栏 ---------- */
.rail{position:sticky;top:112px;display:flex;flex-direction:column;gap:20px}
@media (max-width:1000px){.rail{position:static;gap:16px}}

.daymeta .kicker{
  font-family:var(--mono);font-size:11px;letter-spacing:.09em;
  color:var(--ink-faint);text-transform:uppercase;
}
.daymeta h1{
  margin:3px 0 0;font-family:var(--serif);font-weight:500;
  font-size:30px;line-height:1.2;letter-spacing:-.01em;text-wrap:balance;
}
.daymeta h1 .istoday{
  display:inline-block;vertical-align:7px;margin-left:10px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
  color:var(--macro);background:var(--macro-tint);
  padding:2px 8px;border-radius:999px;
}
.daymeta .sub{margin-top:7px;font-size:13.5px;color:var(--ink-soft);line-height:1.6}
.daymeta .sub b{font-weight:600;color:var(--ink)}

.tracks{display:flex;flex-direction:column;gap:8px}
.track{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;
  width:100%;text-align:left;padding:11px 13px;border-radius:11px;
  background:var(--sheet);border:1px solid var(--rule-soft);
  transition:border-color .15s,background .15s;
}
.track:hover{border-color:var(--rule)}
.track .bar{width:3px;height:26px;border-radius:2px;background:var(--rule)}
.track.eng .bar{background:var(--eng)}
.track.macro .bar{background:var(--macro)}
.track.bio .bar{background:var(--bio)}
.track .nm{font-size:14px;font-weight:500;line-height:1.35}
.track .mi{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);letter-spacing:.04em}
.track[aria-current="true"]{background:var(--sheet);border-color:var(--ink);box-shadow:var(--shadow)}
.track[disabled]{opacity:.45;cursor:default}
.chk{
  width:19px;height:19px;border-radius:50%;border:1.5px solid var(--rule);
  display:grid;place-items:center;flex:0 0 auto;
}
.chk svg{width:11px;height:11px;stroke:var(--paper);stroke-width:2.6;fill:none;opacity:0}
.track.done .chk{background:var(--ok);border-color:var(--ok)}
.track.done .chk svg{opacity:1}

.weekstrip{border-top:1px solid var(--rule-soft);padding-top:14px}
.weekstrip .hd{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
  color:var(--ink-faint);margin-bottom:8px;
}
.weekstrip ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.weekstrip li{display:flex}
.wbtn{
  display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:baseline;
  width:100%;padding:5px 6px;border-radius:7px;font-size:12.5px;color:var(--ink-faint);
  text-align:left;
}
.wbtn:hover{background:var(--sheet-2)}
.wbtn .d{font-family:var(--mono);font-size:11px}
.wbtn .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wbtn.has{color:var(--ink-soft)}
.wbtn.cur{color:var(--ink);font-weight:500;background:var(--sheet-2)}
.wbtn .pips{display:flex;gap:3px}
.wbtn .pips i{width:4px;height:4px;border-radius:50%;background:var(--rule)}
.wbtn .pips i.d-e{background:var(--eng)}
.wbtn .pips i.d-m{background:var(--macro)}
.wbtn .pips i.d-b{background:var(--bio)}

.stamp{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);line-height:1.7}

/* ---------- 正文 ---------- */
.reader{min-width:0;max-width:70ch}
.secthead{display:flex;align-items:center;gap:11px;margin-bottom:6px}
.secthead .tag{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
  padding:3px 8px;border-radius:5px;
}
.t-eng .tag{background:var(--eng-tint);color:var(--eng)}
.t-macro .tag{background:var(--macro-tint);color:var(--macro)}
.t-bio .tag{background:var(--bio-tint);color:var(--bio)}
.t-bio .body a{color:var(--bio)}
.secthead .budget{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.reader h2.title{
  margin:0 0 4px;font-family:var(--serif);font-weight:500;font-size:27px;
  line-height:1.28;letter-spacing:-.01em;text-wrap:balance;
}
.reader .topicline{font-size:13px;color:var(--ink-soft);margin:0 0 22px}

.note{
  background:var(--sheet);border:1px solid var(--rule-soft);
  border-radius:12px;padding:15px 17px;margin-bottom:26px;
  font-size:13.5px;line-height:1.75;color:var(--ink-soft);
}
.note > :first-child{margin-top:0}
.note > :last-child{margin-bottom:0}
.note b,.note strong{color:var(--ink);font-weight:600}
.note summary{
  cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.07em;
  color:var(--ink-faint);list-style:none;
}
.note summary::-webkit-details-marker{display:none}
.note summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
.note[open] summary::before{content:"▾ "}
.note summary + *{margin-top:12px}

.body{font-size:16.5px}
.body h3{
  margin:34px 0 10px;font-size:16px;font-weight:600;line-height:1.5;
  letter-spacing:.005em;
}
.body h3:first-child{margin-top:4px}
.body h4{margin:22px 0 6px;font-size:14.5px;font-weight:600}
.body p{margin:0 0 15px}
.body strong{font-weight:600}
.body ul,.body ol{margin:0 0 16px;padding-left:1.15em}
.body li{margin-bottom:7px}
.body li::marker{color:var(--ink-faint)}
.body hr{border:none;border-top:1px solid var(--rule-soft);margin:26px 0}
.body code{
  font-family:var(--mono);font-size:.87em;background:var(--sheet-2);
  padding:1px 5px;border-radius:4px;
}
.body a{color:var(--macro);text-underline-offset:2px}

/* 原始材料 vs 我的判断 —— 这一页最重要的区分 */
.src-label{
  display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.11em;
  color:var(--ink-faint);border:1px solid var(--rule);border-radius:4px;
  padding:1px 6px;margin-right:8px;vertical-align:3px;
}
.judgment{
  margin:30px 0 22px;padding:18px 20px 4px;border-radius:12px;
  background:var(--macro-tint);border:1px solid transparent;
  box-shadow:inset 3px 0 0 var(--macro);
}
.t-eng .judgment{background:var(--eng-tint);box-shadow:inset 3px 0 0 var(--eng)}
.t-bio .judgment{background:var(--bio-tint);box-shadow:inset 3px 0 0 var(--bio)}
.judgment > h3:first-child{margin-top:0;color:var(--macro)}
.t-eng .judgment > h3:first-child{color:var(--eng)}
.t-bio .judgment > h3:first-child{color:var(--bio)}
.judgment > h3:first-child::after{
  content:"可以不同意";font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  color:var(--ink-faint);margin-left:9px;font-weight:400;
}
.judgment ol,.judgment ul{margin-bottom:14px}

/* 英语读物里的加粗句 = 心里默念 */
.t-eng .read-en{
  font-family:var(--serif);font-size:18.5px;line-height:1.78;letter-spacing:.002em;
}
.t-eng .read-en strong{
  font-weight:500;background:var(--mark);
  box-shadow:inset 0 -1px 0 var(--mark-line);
  padding:0 2px;border-radius:2px;
}
.murmur{
  display:flex;align-items:center;gap:8px;margin:0 0 14px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink-faint);
}
.murmur em{
  font-style:normal;background:var(--mark);box-shadow:inset 0 -1px 0 var(--mark-line);
  padding:0 4px;border-radius:2px;color:var(--ink-soft);
}

/* 代码块（动手课的命令） */
.body pre{
  margin:0 0 18px;padding:12px 14px;border-radius:10px;overflow-x:auto;
  background:var(--sheet-2);border:1px solid var(--rule-soft);
  font-family:var(--mono);font-size:12.5px;line-height:1.6;
}
.body pre code{background:none;padding:0;font-size:inherit;white-space:pre}
.codewrap{position:relative}
.copybtn{
  position:absolute;top:7px;right:7px;font-family:var(--mono);font-size:10.5px;
  color:var(--ink-soft);background:var(--sheet);border:1px solid var(--rule);
  border-radius:6px;padding:2px 8px;
}
.copybtn:hover{border-color:var(--ink-faint)}

/* 引用 / 场景范例 */
.body blockquote{
  margin:0 0 16px;padding:2px 0 2px 18px;border-left:2px solid var(--rule);
  color:var(--ink-soft);
}
.t-eng .body blockquote{
  border-left-color:var(--eng);font-family:var(--serif);font-size:17.5px;
  line-height:1.75;color:var(--ink);
}
.t-eng .body blockquote strong{
  font-weight:500;background:var(--mark);box-shadow:inset 0 -1px 0 var(--mark-line);
  padding:0 2px;border-radius:2px;
}

/* 表格 */
.tablewrap{overflow-x:auto;margin:0 0 20px;border:1px solid var(--rule-soft);border-radius:10px}
.body table{border-collapse:collapse;width:100%;font-size:13.5px;line-height:1.6}
.body th,.body td{
  padding:9px 13px;text-align:left;vertical-align:top;
  border-bottom:1px solid var(--rule-soft);
  font-variant-numeric:tabular-nums;
}
.body th{
  font-weight:600;font-size:11.5px;letter-spacing:.05em;color:var(--ink-soft);
  background:var(--sheet-2);white-space:nowrap;
}
.body tbody tr:last-child td{border-bottom:none}
.body td:first-child{white-space:nowrap;font-weight:500}

/* 词汇表 */
.vocab{display:grid;gap:1px;background:var(--rule-soft);border:1px solid var(--rule-soft);border-radius:10px;overflow:hidden;margin:0 0 20px}
.vrow{background:var(--sheet);padding:10px 14px;display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr);gap:4px 16px;align-items:baseline}
.vrow .w{font-family:var(--serif);font-size:16.5px;font-weight:500}
.vrow .cn{font-size:13.5px;color:var(--ink)}
.vrow .use{grid-column:2;font-size:12.5px;color:var(--ink-faint);font-family:var(--serif)}
@media (max-width:560px){
  .vrow{grid-template-columns:minmax(0,1fr)}
  .vrow .use{grid-column:1}
}

/* 空状态 */
.empty{
  border:1px dashed var(--rule);border-radius:12px;padding:36px 24px;text-align:center;
  color:var(--ink-faint);font-size:14px;line-height:1.8;
}
.empty b{display:block;color:var(--ink-soft);font-size:15px;font-weight:500;margin-bottom:5px}

/* 底部完成条 */
.finish{
  margin-top:34px;padding-top:20px;border-top:1px solid var(--rule-soft);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.markbtn{
  display:inline-flex;align-items:center;gap:9px;padding:9px 16px;border-radius:999px;
  border:1px solid var(--rule);background:var(--sheet);font-size:14px;
  transition:border-color .15s,background .15s,color .15s;
}
.markbtn:hover{border-color:var(--ink-faint)}
.markbtn.done{background:var(--ok);border-color:var(--ok);color:#fff}
.finish .hint{font-size:12.5px;color:var(--ink-faint)}

@media (max-width:1000px){
  .rail{display:contents}
  .daymeta{order:1}
  .tracks{
    order:2;flex-direction:row;
  }
  .tracks .track{flex:1;min-width:0;padding:10px 10px;gap:8px}
  .track .nm{font-size:13px}
  .reader{order:3;max-width:none}
  .weekstrip{order:4;margin-top:10px}
  .stamp{order:5}
  .daymeta h1{font-size:26px}
}
@media (max-width:420px){
  .topbar-inner,.daterail,.shell{padding-inline:16px}
  .body{font-size:16px}
  .t-eng .read-en{font-size:17.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><b>每日精进</b><span id="brandmeta"></span></div>
    <input type="date" id="jump" aria-label="跳到某一天">
    <button class="tool" id="btn-today">今天</button>
  </div>
</header>

<div class="rail-wrap"><nav class="daterail" id="daterail" aria-label="选择日期"></nav></div>

<main class="shell">
  <aside class="rail">
    <div class="daymeta">
      <div class="kicker" id="kicker"></div>
      <h1 id="dayTitle"></h1>
      <div class="sub" id="daySub"></div>
    </div>

    <div class="tracks" role="tablist" aria-label="今天的三件事">
      <button class="track eng" id="tab-eng" role="tab" data-track="eng">
        <span class="bar"></span>
        <span><span class="nm">英语默读</span><span class="mi">25 MIN</span></span>
        <span class="chk"><svg viewBox="0 0 12 12"><path d="M2 6.3 4.6 9 10 3"/></svg></span>
      </button>
      <button class="track macro" id="tab-macro" role="tab" data-track="macro">
        <span class="bar"></span>
        <span><span class="nm">宏观阅读</span><span class="mi">35 MIN</span></span>
        <span class="chk"><svg viewBox="0 0 12 12"><path d="M2 6.3 4.6 9 10 3"/></svg></span>
      </button>
      <button class="track bio" id="tab-bio" role="tab" data-track="bio">
        <span class="bar"></span>
        <span><span class="nm">AI 生命科学</span><span class="mi">40 MIN</span></span>
        <span class="chk"><svg viewBox="0 0 12 12"><path d="M2 6.3 4.6 9 10 3"/></svg></span>
      </button>
    </div>

    <div class="weekstrip">
      <div class="hd" id="weekhd"></div>
      <ol id="weeklist"></ol>
    </div>

    <div class="stamp" id="stamp"></div>
  </aside>

  <article class="reader" id="reader"></article>

<script>
window.DAILY_DATA = {"generated":"2026-10-04 21:41","planStart":"2026-09-14","days":[{"date":"2026-09-14","week":1,"weekday":1,"weekdayCn":"周一","topic":"利率是怎么定的","scenario":{"n":1,"sym":"①","name":"一分钟自我介绍"},"macro":{"week":1,"topic":"利率是怎么定的","heading":"材料精读","md":"### 原始材料 1：《The Fed Explained》第 3 章「货币政策」讲了什么\n\n美联储（Fed）的法定任务只有两条，叫\"双重使命\"（dual mandate）：**最大就业**（在不引发通胀的前提下，经济能撑住的最高就业水平）和**物价稳定**（官方目标是 PCE 通胀 2%）。注意没有第三条\"股市好\"或\"帮政府省利息\"。\n\n它怎么操作？公开市场委员会（FOMC，12 个有投票权的人，一年开 8 次会）定一个**联邦基金利率目标区间**——就是银行之间隔夜互相借钱的利率，现在是 3.50–3.75%。这个区间是整条利率链的起点：它变了，短期利率变，然后房贷、企业贷、债券收益率、股票估值跟着变，最后传到家庭和企业的花钱、投资、招人决定上，再回过头影响就业和通胀。这条链叫**传导机制**，教科书里画成一条箭头，现实里要 6–18 个月才走完。\n\n它靠什么把市场利率\"按\"在这个区间里？主要两根管子：**IORB**（银行把准备金存在美联储能拿的利息）和 **ON RRP**（货币基金等非银行机构把钱隔夜借给美联储能拿的利息）。这两个利率一个是天花板下沿、一个是地板，市场利率就被夹在中间。另外还有贴现窗口（银行急用钱时找美联储借）和资产负债表（买卖国债，就是 QE/QT，第 2 周专门讲）。\n\n定完利率，它还要\"说话\"：每次会后发**声明**，主席开记者会，一年 4 次（3、6、9、12 月）发**经济预测摘要**（SEP），里面那张每个委员对未来利率的点阵图（dot plot）是市场最盯的东西之一。这周三的会**正好是有点阵图的会**。\n\n### 原始材料 2：7 月 29 日那次会议实际是怎么决定的\n\n声明原话（我翻的）：\"委员会决定把联邦基金利率目标区间维持在 3.5% 到 3.75%。\"\"通胀相对 2% 目标仍然偏高，部分反映了供给冲击推高了某些行业的价格，包括能源。\"\"委员会将实现物价稳定。\"\n\n投票 9 比 3。三个反对的——Hammack（克利夫兰联储）、Kashkari（明尼阿波利斯联储）、Logan（达拉斯联储）——都想**当场加 25 个基点**。这在美联储很少见：三票反对、而且方向都是\"更紧\"，说明鹰派已经等不及了。\n\n会议纪要里更直白的几句：\n- 通胀风险\"明显偏上行\"，担心持续高通胀\"开始影响通胀预期和工资、定价决定\"。\n- 关税涨价的传导\"基本已经完成\"，但 AI 相关材料（芯片、钢材）和消费电子有明显涨价压力。\n- 多数人选择等，理由是\"两次会议之间积累的信息能提供更多清晰度\"。\n- 关键一句：\"**如果通胀不下降，收紧政策可能是必要的**\"；还有一句\"当前金融条件可能还不够紧\"。\n\n### 原始材料 3：8 月 28 日主席 Warsh 在 Jackson Hole 说了什么\n\n他把 PCE 篮子拆成 199 个分项，发现 **54% 的分项过去一年涨幅超过 3%**，疫情前这个比例是 32%。意思是：涨价不是几个倒霉行业的事，是面上的。他的原话：\"通胀高于 2% 目标，所以美联储现在的首要关注应该是物价。\"\"我们必须确信底层通胀正在明确地、以足够的速度朝目标走。**否则，我们还有活要干。**\"\"我承诺的是一种纪律，不是一个决定。\"\n\n就业他认为是稳的：失业率 4.1%，初请失业金人数接近 50 年低点，就业增长慢主要是劳动力供给少，不是需求弱。\n\n### 原始材料 4：这周三开会前，桌上摆着哪几个数\n\n| 数据 | 最新值 | 发布日 | 怎么读 |\n|---|---|---|---|\n| PCE 通胀（美联储看的那把尺） | 总体 3.7%，核心 3.3%（同比）；环比都是 0.2% | 8/26（7 月数据） | 离 2% 差一大截；环比 0.2% 折年约 2.4%，最近的势头没那么糟 |\n| CPI 通胀（更早发、更多人看的那把尺） | 总体 3.4%，核心 2.4%；环比 0.4% / 0.3% | 9/11（8 月数据） | 总体被能源顶着：能源 +16.3%，汽油 +27.4%，汽油一项占了当月涨幅三分之一以上 |\n| 非农就业 | +16.2 万（预期 5.3 万），失业率 4.1%，时薪同比 +3.1% | 9/4（8 月数据） | 比预期强很多，给\"加息不会伤就业\"撑了腰 |\n| 市场押注（CME FedWatch） | 9/16 加 25bp 概率 85%；未来三次会共计价 2.2 次加息 | 9/11 | 市场已经把\"加\"当成默认，所以真加了不算意外，\"不加\"才是意外 |\n\n**一个怪事要记住**：核心 CPI 才 2.4%，核心 PCE 却 3.3%，差了将近 1 个百分点。两把尺子权重不一样（PCE 里医疗、金融服务占比大，CPI 里房租占比大，而房租这轮只涨 3.0%）。美联储只看 PCE，所以别拿 CPI 2.4% 去推\"通胀已经没事了\"。\n\n### 我的判断\n\n1. **这周三大概率加息 25bp**，理由不是 CPI，是三件事叠在一起：核心 PCE 3.3% 半年没往下走、7 月已经有三票要加、主席公开把话说到\"还有活要干\"。美联储极少在市场已经价到 85% 的时候反着来，因为那等于制造意外。\n2. **真正的看点不是加不加，是点阵图和声明措辞**：点阵图里 2026 年底的中位数如果是 4.00–4.25%（暗示再加一次）算温和，如果是 4.25–4.50%（再加两次）算鹰；声明里\"供给冲击、包括能源\"这句留不留——留着等于给自己留\"油价一跌我就停\"的退路。\n3. **这轮和 2022 年那轮不一样**：2022 年是通胀 9% 追着打，现在是 3.5% 左右磨了 65 个月（Warsh 自己说的数），美联储怕的是\"大家习惯了 3%\"，所以它宁可在就业还好的时候先动手，这就是纪要里\"现在加一点，免得以后加更多\"那句的意思。\n4. **对你的账户意味着什么**（周三再细说）：加息 + 鹰派点阵图 → 2 年期美债收益率上、美元强、黄金和 BTC 短线承压；但如果声明软、点阵图温和，市场会\"买事实\"反弹。这周的预判要写的正是这个。","ready":true,"intro":"**先看结论**：美联储定利率只看两件事——通胀离 2% 多远、就业稳不稳。现在（2026 年 9 月）通胀 3.7%（PCE），就业稳（失业率 4.1%），所以它在往\"加息\"走：7 月已有 3 个委员投票要加，8 月底主席 Warsh 在 Jackson Hole 说\"否则我们还有活要干\"，市场现在押 85% 这周三（北京时间 9/17 凌晨 2 点）加 25 个基点，把利率从 3.50–3.75% 提到 3.75–4.00%。本周你要看懂的就是：它凭什么、看哪几个数、加了以后钱会怎么流。\n\n每天读当天那一节，35 分钟够。标着「原始材料」的是引用或转述，标着「我的判断」的是我的看法，可以不同意。","sources":"- Fed, The Fed Explained: Monetary Policy — federalreserve.gov/aboutthefed/fedexplained/monetary-policy.htm\n- FOMC statement 2026-07-29 — federalreserve.gov/newsevents/pressreleases/monetary20260729a.htm\n- FOMC minutes July 28–29, 2026 — federalreserve.gov/monetarypolicy/fomcminutes20260729.htm\n- Warsh, Jackson Hole keynote 2026-08-28 — federalreserve.gov/newsevents/speech/warsh20260828a.htm\n- BEA, Personal Income and Outlays, July 2026（PCE）；BLS, CPI August 2026（9/11 发布）；BLS/UPI, Employment Situation August 2026（9/4 发布）\n- centralbank.watch FedWatch 页面（9/11）；Kiplinger CPI 报道（9/11）；Yahoo Finance 9 月加息概率报道（9/8）\n- Schwab「Fed Hikes in 12-0 Vote, Commits to Inflation Fight」（9/17）；Kiplinger 9 月 FOMC 直播页；Vantage Markets 9/17 决议要点；TradingKey 9 月 SEP/点阵图解读\n- Saxo「First Fed hike since 2023 lifts the dollar」（9/17，2 年期 4.74%、10 年期约 5.00%、黄金 4,240–4,366、BTC 76,360）\n- Forbes Advisor Treasury Rates（9/16 收盘：2 年 4.74%、10 年 5.01%、30 年 5.35%）\n- Yahoo Finance 8/28 市场直播页（10 年期 +4bp 收 4.72%、30 年期 5.21%）；USAGOLD 8/28 日报（黄金现货 4,608）\n- Yahoo/路透 8/26「Treasury yields muted after headline PCE ticks up」（10 年期 +2.4bp 收 4.643%）；WichitaLiberty 7 月 PCE 报告解读（核心环比 +0.2%、同比 3.3%）\n- Webull / Motley Fool NVDA Q2 FY2027 报道（收入 962.2 亿、Q3 指引 1080 亿、8/27 收 227.98 美元 +8.74%）\n- mining.com 8/12 铜创纪录报道（盘中 6.7140、收 6.6335）；SMM/metal.com 8/26（盘中 6.7270 创纪录）；Rio Times 9/17（9/16 收 6.4315）","file":"W01-利率是怎么定的.md"},"eng":{"heading":"读物：Slow down to speed up?","md":"**Some of the loudest voices in AI are now asking the industry to slow down — and they are not outsiders.** Over the weekend, Anthropic's CEO Dario Amodei published an essay arguing that frontier labs should deliberately pace their capability improvements, so that safety testing and evaluation can catch up. His warning was unusually concrete: if models start improving themselves without limits, he wrote, swarms of AI agents could take over large parts of the internet within six to twelve months and cause hundreds of billions of dollars in damage.\n\nThe essay came with a commitment. Anthropic said it would give outside evaluators, such as the non-profit METR, permanent access to its systems — \"employee-like\" access, with the right to publish what they find. **That is a big shift: until now, labs mostly tested themselves and shared results when they chose to.**\n\nThe same weekend, two safety researchers — one who led a scalable-oversight team at Anthropic, and one from Google DeepMind — resigned to join METR. One of them said, bluntly, that \"there are no adults in the room.\" He called for mandatory reporting whenever a lab makes progress on recursive self-improvement, the ability of a model to make the next model better on its own.\n\nMeanwhile, OpenAI's Sam Altman told Fortune that the company will not go public in 2026. A listing had been discussed at a valuation of around one trillion dollars, but Altman said that \"given everything happening with safety, right now would be an ill-advised moment to go public.\" OpenAI does not seem to need the money: reports put its committed capital at 122 billion dollars, plus a 4.7-billion-dollar credit line.\n\n**So what should a builder take from all this?** Three things. First, the people closest to the frontier are more worried than the people selling it. Second, independent evaluation is becoming a real job, not a hobby. Third, if the biggest labs are slowing down on purpose, the advantage shifts to whoever uses today's models well — which is exactly what small teams can do.\n\n（约 380 词）\n\n### 词汇表\n\n| 词 | 意思 | 文中用法 |\n|---|---|---|\n| frontier | 前沿（这里指最强模型的能力边界） | frontier labs = 做最强模型的实验室 |\n| pace (v.) | 控制节奏、放慢 | pace their capability improvements |\n| catch up | 赶上 | so that safety testing can catch up |\n| swarm | 一群（蜂群一样） | swarms of AI agents |\n| evaluator | 评估方、测试方 | outside evaluators such as METR |\n| oversight | 监督 | scalable-oversight team |\n| bluntly | 直白地、不客气地 | he said, bluntly, that… |\n| mandatory | 强制的 | mandatory reporting |\n| recursive self-improvement | 递归自我改进（模型自己改进下一代模型） | progress on recursive self-improvement |\n| go public / listing | 上市 | will not go public in 2026; a listing had been discussed |\n| valuation | 估值 | a valuation of around one trillion dollars |\n| ill-advised | 不明智的 | an ill-advised moment to go public |\n| credit line | 授信额度 | a 4.7-billion-dollar credit line |\n\n### 今日表达（挑 3–5 个抄进总表）\n\n1. **catch up (with/on)** — 赶上。Safety research needs to catch up with capability.\n2. **rule something out** — 排除。Altman ruled out an IPO this year.（读物里没直接出现，但这是报道用的原词）\n3. **there are no adults in the room** — 没人负责任地管事（口语，带情绪）。\n4. **an ill-advised moment to…** — 现在做…不明智。This is an ill-advised moment to launch a new site.\n5. **take something from this** — 从中学到/得出。What should a builder take from this?\n6. **shift to** — 转向。The advantage shifts to small teams.\n\n### 场景范例 ①：我是谁、我在做什么（一分钟版）\n\n> Hi, I'm Fred. I'm an AI and machine-learning engineer based in China. For a few years I built models inside companies; these days I split my time between a day job on government-facing AI products and my own projects on the side. **What I actually enjoy is turning a repetitive task into a small web tool that people will pay for** — most of my side projects are SaaS sites for English-speaking users. Right now I'm also teaching myself two things that have nothing to do with code: how the macro economy works, and how to talk about my work in English without freezing up. That's why we're talking.\n\n**心里回答**：Change three details so it's really you — what you built recently, what you're learning this month, and one sentence about why. Keep it under a minute.","ready":true,"howto":"**怎么用（上班默读版，20–25 分钟）**：① 读物读一遍只求看懂（5 分钟）；② 再读一遍，**加粗的句子在心里默念出声**，嘴型可以动、不出声（5 分钟）；③ 从「今日表达」里挑 3–5 个抄进总表当天那格，各造一句（5 分钟）；④ 读场景范例，然后闭上眼用英文在心里回答范例后面那个问题，撑 2 分钟（5 分钟）。晚上有条件再对着手机把加粗句读出声，没条件就算完成。\n\n读物是我用自己的话写的当天 AI 新闻，难度控制在 B2（长句少、专业词有表）。不是原文摘抄，事实以来源为准。","sources":"- AI Weekly「AI News Today, September 13」汇总页：Amodei 文章、METR 人事、OpenAI IPO、Positron 融资、Nvidia 澳洲、UMG × ElevenLabs\n- AI Weekly「AI News Today, September 16」汇总页（9/17、9/18 两篇读物的事实来源）\n- Utility Dive「House passes ratepayer protection bill to limit data center cost shifts」（9/16，417-3、100MW 门槛、各州一年/两年时限、Heinrich 的 GRID Savings Act）\n- Crusoe 官方新闻稿 + TechCrunch（9/17，39 亿美元 Series F、309 亿估值、可拖运的模块化 AI factory）\n- AlphaSignal / MindStudio 关于 Edge0-35B-A3B 的报道（9/17，24GB Mac mini 上约 20 tokens/s，最低 3GB 内存，MoE 专家权重从 SSD 流式读取 + 提前一个 token 预测路由）；论文 arXiv 2609.18063\n- AI Weekly「AI News Today」9/14–9/15 汇总页：Anthropic 算力合同、Trump 在 Truth Social 的表态、Apple iOS 27、DeepMind 安全研究员离职 — aiweekly.co/ai-news-today\n- AI-Weekly Issue 234（2026-09-15）：Meta Muse 发布与定价、Visa/Mastercard/Ant International 的「Know Your Agent」、Amodei「pace the frontier」 — ai-weekly.ai/newsletter-09-15-2026\n- Anthropic 5170 亿美元算力合同、14.8 GW（多家报道，2026-09-14/15）：investing.com、forkast.news、cryptobriefing.com\n- Bloomberg 2026-09-15：中国官媒称「放慢 AI」的提议是 self-serving — bloomberg.com/news/articles/2026-09-15/chinese-state-media-dismisses-self-serving-ai-slowdown-call\n- AI Weekly「AI News Today, September 15–16」汇总页：NYT/Siena 数据中心民调、Trump Truth Social、Commerce 要求 Kalshi 下架算力价格产品、Anthropic 澳洲昆士兰数据中心、Z.AI 融资、Gemini 3.8 Live、Firefox × Mistral — aiweekly.co/ai-news-today\n- artificialintelligence-news.com 2026-09-14/16 头条页（Microsoft Humanist AI Code of Conduct 公开征询、Pony.ai 自动驾驶卡车）— artificialintelligence-news.com","isoWeek":"2026-W38","file":"2026-W38.md"},"ai4s":null},{"date":"2026-09-15","week":1,"weekday":2,"weekdayCn":"周二","topic":"利率是怎么定的","scenario":{"n":2,"sym":"②","name":"讲一个我做的产品"},"macro":{"week":1,"topic":"利率是怎么定的","heading":"讲给外行版（我的版本，读完你心里过一遍）","md":"**三分钟版**：美联储是美国的央行，它管一个利率——银行之间借一晚上钱的利率。这个利率像水龙头：拧紧（加息），借钱贵，大家少花钱少投资，物价涨得慢，但也可能多几个人失业；拧松（降息），反过来。它只盯两个表：物价涨得快不快（目标一年涨 2%），失业的人多不多。现在物价涨 3.7%，比目标高不少，失业率 4.1% 算低，所以它打算把水龙头再拧紧一格——这周三就要宣布。它不是拍脑袋，一年开 8 次会，12 个人投票，会后发一份声明，每季度还画一张\"每个人觉得明年利率该是多少\"的点图，市场就靠读这些猜它下一步。\n\n**外行最常问的三个问题，怎么答**：\n- \"利率高了对我有什么影响？\"——美国加息，全球美元变贵、变少，新兴市场和币圈先感受到（钱往美国流）；国内的直接影响是人民币汇率压力和出口。\n- \"它为什么不直接把通胀打到 2%？\"——因为动作太猛会把失业率打上去，它要两头兼顾，所以是一格一格拧。\n- \"它说的话为什么这么绕？\"——因为它的话本身就是工具：说\"有活要干\"，市场自己先把利率抬上去，它就不用真加那么多。\n\n**你讲的时候容易掉的三个坑**：把 CPI 当美联储的目标（它看的是 PCE）；把\"加息\"说成\"印钱/收钱\"（那是资产负债表，第 2 周的事）；把点阵图当承诺（它只是每个人当下的猜测）。","ready":true,"intro":"**先看结论**：美联储定利率只看两件事——通胀离 2% 多远、就业稳不稳。现在（2026 年 9 月）通胀 3.7%（PCE），就业稳（失业率 4.1%），所以它在往\"加息\"走：7 月已有 3 个委员投票要加，8 月底主席 Warsh 在 Jackson Hole 说\"否则我们还有活要干\"，市场现在押 85% 这周三（北京时间 9/17 凌晨 2 点）加 25 个基点，把利率从 3.50–3.75% 提到 3.75–4.00%。本周你要看懂的就是：它凭什么、看哪几个数、加了以后钱会怎么流。\n\n每天读当天那一节，35 分钟够。标着「原始材料」的是引用或转述，标着「我的判断」的是我的看法，可以不同意。","sources":"- Fed, The Fed Explained: Monetary Policy — federalreserve.gov/aboutthefed/fedexplained/monetary-policy.htm\n- FOMC statement 2026-07-29 — federalreserve.gov/newsevents/pressreleases/monetary20260729a.htm\n- FOMC minutes July 28–29, 2026 — federalreserve.gov/monetarypolicy/fomcminutes20260729.htm\n- Warsh, Jackson Hole keynote 2026-08-28 — federalreserve.gov/newsevents/speech/warsh20260828a.htm\n- BEA, Personal Income and Outlays, July 2026（PCE）；BLS, CPI August 2026（9/11 发布）；BLS/UPI, Employment Situation August 2026（9/4 发布）\n- centralbank.watch FedWatch 页面（9/11）；Kiplinger CPI 报道（9/11）；Yahoo Finance 9 月加息概率报道（9/8）\n- Schwab「Fed Hikes in 12-0 Vote, Commits to Inflation Fight」（9/17）；Kiplinger 9 月 FOMC 直播页；Vantage Markets 9/17 决议要点；TradingKey 9 月 SEP/点阵图解读\n- Saxo「First Fed hike since 2023 lifts the dollar」（9/17，2 年期 4.74%、10 年期约 5.00%、黄金 4,240–4,366、BTC 76,360）\n- Forbes Advisor Treasury Rates（9/16 收盘：2 年 4.74%、10 年 5.01%、30 年 5.35%）\n- Yahoo Finance 8/28 市场直播页（10 年期 +4bp 收 4.72%、30 年期 5.21%）；USAGOLD 8/28 日报（黄金现货 4,608）\n- Yahoo/路透 8/26「Treasury yields muted after headline PCE ticks up」（10 年期 +2.4bp 收 4.643%）；WichitaLiberty 7 月 PCE 报告解读（核心环比 +0.2%、同比 3.3%）\n- Webull / Motley Fool NVDA Q2 FY2027 报道（收入 962.2 亿、Q3 指引 1080 亿、8/27 收 227.98 美元 +8.74%）\n- mining.com 8/12 铜创纪录报道（盘中 6.7140、收 6.6335）；SMM/metal.com 8/26（盘中 6.7270 创纪录）；Rio Times 9/17（9/16 收 6.4315）","file":"W01-利率是怎么定的.md"},"eng":{"heading":"读物：Memory, not muscle","md":"**The next fight in AI chips is not about how fast a chip can multiply numbers — it is about how much it can remember.** This week a startup called Positron closed an 875-million-dollar funding round at a five-billion-dollar valuation. Its chip, named Asimov, skips the expensive high-bandwidth memory (HBM) that Nvidia and AMD depend on. Instead it uses very large amounts of ordinary LPDDR5X memory — the kind found in laptops and phones — and puts between 288 gigabytes and more than two terabytes of it next to each die.\n\nWhy would anyone do that? Because inference — running a model, rather than training it — is mostly a memory problem. **A big model has to read all of its weights for every token it produces, so the chip that can hold the whole model close to the compute wins.** Positron says the design targets models with sixteen trillion parameters and context windows of ten million tokens. The chip is planned to tape out on TSMC's N3P process at the end of 2026, with production in the second half of 2027. Those are ambitious dates; plenty of chip startups have missed theirs.\n\nThe demand side keeps growing anyway. Nvidia announced that eight Australian data-center operators will build up to two gigawatts of \"AI factory\" capacity by 2027 — more than doubling the country's current AI power load. One of them plans to deploy as many as 68,000 Nvidia GPUs. **Two gigawatts is roughly the output of two large nuclear reactors, all of it going to one kind of computer.**\n\nAnd in a quieter corner of the news, Universal Music Group signed a multi-year deal with ElevenLabs. Fans will be able to make remixes, mashups, and personalized vocal versions of songs from artists who opt in, with the rights handled by the label. ElevenLabs framed it as a way to unlock new revenue for musicians rather than take it away.\n\n**The pattern across all three stories is the same: the money is moving from \"can we build it\" to \"can we run it cheaply and legally at scale.\"** For a solo builder, that is good news — running models is getting cheaper every quarter, and the licensed-content question is starting to get answers.\n\n（约 400 词）\n\n### 词汇表\n\n| 词 | 意思 | 文中用法 |\n|---|---|---|\n| funding round | 一轮融资 | closed an 875-million-dollar funding round |\n| valuation | 估值 | at a five-billion-dollar valuation |\n| high-bandwidth memory (HBM) | 高带宽内存 | skips the expensive HBM |\n| die | 芯片裸片 | next to each die |\n| inference | 推理（跑模型） | inference is mostly a memory problem |\n| weights | 模型权重 | read all of its weights |\n| parameter | 参数 | sixteen trillion parameters |\n| context window | 上下文窗口 | context windows of ten million tokens |\n| tape out | 流片 | planned to tape out on TSMC's N3P |\n| ambitious | 野心大的、激进的 | those are ambitious dates |\n| capacity | 容量（这里指用电/算力规模） | two gigawatts of capacity |\n| deploy | 部署 | deploy as many as 68,000 GPUs |\n| opt in | 主动选择加入 | artists who opt in |\n| label | 唱片公司 | rights handled by the label |\n| at scale | 规模化地 | run it cheaply and legally at scale |\n\n### 今日表达\n\n1. **skip X in favor of Y** — 跳过 X 改用 Y。Positron skips HBM in favor of ordinary memory.\n2. **close a round** — 完成一轮融资。They closed an 875M round.\n3. **more than double** — 翻一倍多。The deal more than doubles the country's AI power load.\n4. **miss a deadline / miss their dates** — 没赶上时间。Plenty of startups have missed their dates.\n5. **frame something as** — 把…说成/定位成。ElevenLabs framed it as new revenue for musicians.\n6. **the money is moving from A to B** — 钱在从 A 流向 B。\n\n### 场景范例 ②：讲一个我做的产品\n\n> Let me tell you about one of my sites. It's called ScribbleCub, and it's a coloring-page generator for parents and teachers. **The problem it solves is simple: you want a coloring page about a very specific thing — \"a dinosaur riding a bicycle\" — and you can't find one.** You type the idea, the site generates a clean black-and-white line drawing in about ten seconds, and you print it. Who pays for it? Mostly parents of kids between three and eight, and some kindergarten teachers. It's a subscription: a small monthly fee for unlimited pages, with a few free ones so people can try it first. The hardest part wasn't the AI — it was getting the lines clean enough to actually color inside.\n\n**心里回答**：Pick a different product of yours and answer the same four questions in order — what problem, who it's for, how it makes money, what was hardest. Two minutes, no notes.","ready":true,"howto":"**怎么用（上班默读版，20–25 分钟）**：① 读物读一遍只求看懂（5 分钟）；② 再读一遍，**加粗的句子在心里默念出声**，嘴型可以动、不出声（5 分钟）；③ 从「今日表达」里挑 3–5 个抄进总表当天那格，各造一句（5 分钟）；④ 读场景范例，然后闭上眼用英文在心里回答范例后面那个问题，撑 2 分钟（5 分钟）。晚上有条件再对着手机把加粗句读出声，没条件就算完成。\n\n读物是我用自己的话写的当天 AI 新闻，难度控制在 B2（长句少、专业词有表）。不是原文摘抄，事实以来源为准。","sources":"- AI Weekly「AI News Today, September 13」汇总页：Amodei 文章、METR 人事、OpenAI IPO、Positron 融资、Nvidia 澳洲、UMG × ElevenLabs\n- AI Weekly「AI News Today, September 16」汇总页（9/17、9/18 两篇读物的事实来源）\n- Utility Dive「House passes ratepayer protection bill to limit data center cost shifts」（9/16，417-3、100MW 门槛、各州一年/两年时限、Heinrich 的 GRID Savings Act）\n- Crusoe 官方新闻稿 + TechCrunch（9/17，39 亿美元 Series F、309 亿估值、可拖运的模块化 AI factory）\n- AlphaSignal / MindStudio 关于 Edge0-35B-A3B 的报道（9/17，24GB Mac mini 上约 20 tokens/s，最低 3GB 内存，MoE 专家权重从 SSD 流式读取 + 提前一个 token 预测路由）；论文 arXiv 2609.18063\n- AI Weekly「AI News Today」9/14–9/15 汇总页：Anthropic 算力合同、Trump 在 Truth Social 的表态、Apple iOS 27、DeepMind 安全研究员离职 — aiweekly.co/ai-news-today\n- AI-Weekly Issue 234（2026-09-15）：Meta Muse 发布与定价、Visa/Mastercard/Ant International 的「Know Your Agent」、Amodei「pace the frontier」 — ai-weekly.ai/newsletter-09-15-2026\n- Anthropic 5170 亿美元算力合同、14.8 GW（多家报道，2026-09-14/15）：investing.com、forkast.news、cryptobriefing.com\n- Bloomberg 2026-09-15：中国官媒称「放慢 AI」的提议是 self-serving — bloomberg.com/news/articles/2026-09-15/chinese-state-media-dismisses-self-serving-ai-slowdown-call\n- AI Weekly「AI News Today, September 15–16」汇总页：NYT/Siena 数据中心民调、Trump Truth Social、Commerce 要求 Kalshi 下架算力价格产品、Anthropic 澳洲昆士兰数据中心、Z.AI 融资、Gemini 3.8 Live、Firefox × Mistral — aiweekly.co/ai-news-today\n- artificialintelligence-news.com 2026-09-14/16 头条页（Microsoft Humanist AI Code of Conduct 公开征询、Pony.ai 自动驾驶卡车）— artificialintelligence-news.com","isoWeek":"2026-W38","file":"2026-W38.md"},"ai4s":null},{"date":"2026-09-16","week":1,"weekday":3,"weekdayCn":"周三","topic":"利率是怎么定的","scenario":{"n":7,"sym":"⑦","name":"讲今天的日常"},"macro":{"week":1,"topic":"利率是怎么定的","heading":"套事件：明天凌晨 2 点的 FOMC","md":"**事件**：9/15–16 FOMC，北京时间 9/17（周四）凌晨 2:00 出声明 + 点阵图，2:30 主席记者会。\n\n**我的预判（写在结果之前）**：\n- 利率：加 25bp 到 3.75–4.00%。概率我给 80%。\n- 投票：可能有 1–2 票反对，方向是\"不加\"（鸽派），而不是 7 月那种\"要多加\"。\n- 点阵图：2026 年底中位数 4.00–4.25%（即今年还有一次）。\n- 声明：保留\"供给冲击、包括能源\"那句；加一句类似\"将继续评估进一步收紧的程度\"。\n- 市场第一反应（到北京时间上午 8 点）：2 年期美债收益率 ±5bp 以内（因为已经价进去了），美元指数小涨，黄金和 BTC 先跌后稳。\n\n**什么结果算我预判错了**：不加息（那说明我高估了 Warsh 的决心，鹰派话术只是为了让市场替它收紧）；或者加了但点阵图显示今年还要加两次（那说明我低估了他们对\"面上涨价\"的紧张程度）。\n\n**明早起来对照的清单**（结果出来后我会把实际值补在这一节后面）：利率决定 / 投票 / 2026 年底点阵中位数 / 声明有没有\"能源\"那句 / 2 年期收益率变化 / DXY / 黄金 / BTC。\n\n加密哨兵那边会在 012-b/事件记录/ 里写正式的会前会后对照表，这里只是你理解用的版本。\n\n**实际结果（9/18 补上）**：\n\n| 我预判的 | 实际 | 判 |\n|---|---|---|\n| 加 25bp 到 3.75–4.00%（我给 80%） | 加了，3.75–4.00%。2023 年 7 月以来第一次加息 | 对 |\n| 有 1–2 票鸽派反对 | 12 比 0，全票通过 | 错 |\n| 2026 年底点阵中位数 4.00–4.25% | 4.1%（6 月那次是 3.8%）。交预测的 18 个人里 16 个认为年内还要再加至少一次，其中 4 个认为要加两次 | 对 |\n| 声明保留「供给冲击、包括能源」那句 | 删了。新版只剩一句：通胀仍然偏高，今天这次行动会让通胀更及时地回到 2% 的目标 | 错 |\n| 2 年期收益率变化在 ±5bp 以内 | 4.74%，当天 +7bp | 错（超了 2bp） |\n| 美元指数小涨 | 涨了，欧元兑美元当天创新低 | 对 |\n| 黄金和 BTC 先跌后稳 | 黄金在 4,240–4,366 之间来回、收在 4,300 附近；BTC 76,360，+0.28%；第二天纳指还涨了 1.7% | 大致对 |\n\n七条里三条对、三条错、一条大致对。**错得最有意思的是「投票」和「声明」这两条。** 我以为鹰派已经吵赢了、鸽派会留一票反对当记录，结果是 12 比 0 全票；我以为他们会继续拿「能源涨价」当挡箭牌，结果他们主动把这句删了。\n\n这两件事指向同一个意思：**美联储不想再把通胀说成别人的错，它开始认这笔账了。** 认账的下一步，通常就是继续加。\n\nWarsh 记者会两句原话（我翻的）：「通胀太高了，而且已经高了太久。」「我不会预判我们未来的任何决定。」另外他连着两次会不交自己那个点——点阵图上别人都要标自己认为的利率，主席那格空着。这是故意让市场猜不透他。","ready":true,"intro":"**先看结论**：美联储定利率只看两件事——通胀离 2% 多远、就业稳不稳。现在（2026 年 9 月）通胀 3.7%（PCE），就业稳（失业率 4.1%），所以它在往\"加息\"走：7 月已有 3 个委员投票要加，8 月底主席 Warsh 在 Jackson Hole 说\"否则我们还有活要干\"，市场现在押 85% 这周三（北京时间 9/17 凌晨 2 点）加 25 个基点，把利率从 3.50–3.75% 提到 3.75–4.00%。本周你要看懂的就是：它凭什么、看哪几个数、加了以后钱会怎么流。\n\n每天读当天那一节，35 分钟够。标着「原始材料」的是引用或转述，标着「我的判断」的是我的看法，可以不同意。","sources":"- Fed, The Fed Explained: Monetary Policy — federalreserve.gov/aboutthefed/fedexplained/monetary-policy.htm\n- FOMC statement 2026-07-29 — federalreserve.gov/newsevents/pressreleases/monetary20260729a.htm\n- FOMC minutes July 28–29, 2026 — federalreserve.gov/monetarypolicy/fomcminutes20260729.htm\n- Warsh, Jackson Hole keynote 2026-08-28 — federalreserve.gov/newsevents/speech/warsh20260828a.htm\n- BEA, Personal Income and Outlays, July 2026（PCE）；BLS, CPI August 2026（9/11 发布）；BLS/UPI, Employment Situation August 2026（9/4 发布）\n- centralbank.watch FedWatch 页面（9/11）；Kiplinger CPI 报道（9/11）；Yahoo Finance 9 月加息概率报道（9/8）\n- Schwab「Fed Hikes in 12-0 Vote, Commits to Inflation Fight」（9/17）；Kiplinger 9 月 FOMC 直播页；Vantage Markets 9/17 决议要点；TradingKey 9 月 SEP/点阵图解读\n- Saxo「First Fed hike since 2023 lifts the dollar」（9/17，2 年期 4.74%、10 年期约 5.00%、黄金 4,240–4,366、BTC 76,360）\n- Forbes Advisor Treasury Rates（9/16 收盘：2 年 4.74%、10 年 5.01%、30 年 5.35%）\n- Yahoo Finance 8/28 市场直播页（10 年期 +4bp 收 4.72%、30 年期 5.21%）；USAGOLD 8/28 日报（黄金现货 4,608）\n- Yahoo/路透 8/26「Treasury yields muted after headline PCE ticks up」（10 年期 +2.4bp 收 4.643%）；WichitaLiberty 7 月 PCE 报告解读（核心环比 +0.2%、同比 3.3%）\n- Webull / Motley Fool NVDA Q2 FY2027 报道（收入 962.2 亿、Q3 指引 1080 亿、8/27 收 227.98 美元 +8.74%）\n- mining.com 8/12 铜创纪录报道（盘中 6.7140、收 6.6335）；SMM/metal.com 8/26（盘中 6.7270 创纪录）；Rio Times 9/17（9/16 收 6.4315）","file":"W01-利率是怎么定的.md"},"eng":{"heading":"读物：Talk is cheap, compute is not","md":"**Last week Anthropic's CEO asked the whole industry to slow down. This week we found out how much his own company is spending.** Reports say Anthropic has signed compute commitments worth about 517 billion dollars, covering 14.8 gigawatts of capacity, and that most of it was signed in about eleven months. An earlier estimate was 180 billion. So the real number is nearly three times bigger than people thought.\n\nIs that hypocrisy? Not exactly. A lab can believe the risk is real and still believe it has to stay at the frontier to have any say in what happens. **But it does tell you which signal to trust: watch the contracts, not the essays.**\n\nThe pushback came from two directions at once. In the United States, President Trump wrote on Truth Social that the only guardrail AI needs is \"a STRONG AND SMART (High IQ!) PRESIDENT,\" and called worries about an AI takeover a hoax. In China, state media called the slowdown proposal self-serving — a way for the leader to protect its lead. **When an idea is attacked from both sides, it usually means it would cost somebody something.**\n\nWhile the argument went on, products shipped. Meta launched Muse, a personal agent that can send emails, book travel, and negotiate on your behalf. It is free in the United States, on iOS, Android and the web, with paid plans at twenty and one hundred dollars a month. Within days it was the number two app in the US App Store.\n\nA quieter story may matter more to builders. Visa, Mastercard and Ant International are working on a framework called \"Know Your Agent.\" The idea is that a merchant can trace a shopping bot back to the human who authorized it. **If agents are going to spend money, somebody has to be able to say whose money it is.**\n\nSo what does all this mean for an independent developer? Three things. Twenty and one hundred dollars a month is becoming the default shape of agent pricing, so price with that in mind. Some of your future visitors will be agents, not people, which changes how a signup page should work. And all that gigawatt spending has one useful side effect for you: running a model keeps getting cheaper.\n\n（约 400 词）\n\n### 词汇表\n\n| 词 | 意思 | 文中用法 |\n|---|---|---|\n| commitment | （已签的）承诺、投入 | compute commitments worth 517 billion dollars |\n| capacity | 容量（这里指电力/算力规模） | 14.8 gigawatts of capacity |\n| estimate (n.) | 估算 | an earlier estimate was 180 billion |\n| hypocrisy | 言行不一、伪善 | Is that hypocrisy? |\n| have a say | 有发言权 | to have any say in what happens |\n| guardrail | 护栏（这里指给 AI 设的限制） | the only guardrail AI needs |\n| hoax | 骗局、假警报 | called worries about an AI takeover a hoax |\n| self-serving | 只替自己打算的 | state media called the proposal self-serving |\n| pushback | 反对、顶回来 | the pushback came from two directions |\n| on your behalf | 代表你、替你 | negotiate on your behalf |\n| framework | 一套规则、框架 | a framework called \"Know Your Agent\" |\n| merchant | 商户 | a merchant can trace a shopping bot |\n| authorize | 授权 | the human who authorized it |\n| default (adj.) | 默认的 | the default shape of agent pricing |\n| side effect | 副作用（这里是好的那种） | one useful side effect for you |\n\n### 今日表达\n\n1. **talk is cheap** — 光说不练、嘴上说说不值钱。Talk is cheap; look at what they signed.\n2. **watch X, not Y** — 要看 X，别看 Y。Watch the contracts, not the essays.\n3. **not exactly** — 也不全是、不算是（软性否定，很常用）。\"Is that hypocrisy?\" \"Not exactly.\"\n4. **on someone's behalf** — 代表某人做事。The agent books the flight on your behalf.\n5. **it would cost somebody something** — 会让某些人付出代价。\n6. **with that in mind** — 考虑到这一点。Price your product with that in mind.\n\n### 场景范例 ⑦：讲今天的日常\n\n> A normal Tuesday, if you want it. I got up around seven and read for half an hour before anyone needed me — right now it's macro economics, which is completely new to me, so progress is slow. Then the commute, then the office. My day job is AI products for government clients, so a lot of it is meetings and requirements rather than code; **I probably write real code for two hours out of nine.** Lunch is downstairs, usually rice and something. In the afternoon I sat through a long review that could have been an email. I got home around eight, had dinner, and spent an hour on my own site — nothing exciting, just a bug that only shows up on mobile. Before bed I read some English and say a few sentences out loud if the flat is quiet. That's the whole day. **It's a repetitive week, but the side projects are the part that feels like mine.**\n\n**心里回答**：Tell your own day in order, from getting up to going to bed, in simple past tense. Don't stop to fix mistakes — if you get stuck on a word, say \"anyway\" and keep going. Two minutes.","ready":true,"howto":"**怎么用（上班默读版，20–25 分钟）**：① 读物读一遍只求看懂（5 分钟）；② 再读一遍，**加粗的句子在心里默念出声**，嘴型可以动、不出声（5 分钟）；③ 从「今日表达」里挑 3–5 个抄进总表当天那格，各造一句（5 分钟）；④ 读场景范例，然后闭上眼用英文在心里回答范例后面那个问题，撑 2 分钟（5 分钟）。晚上有条件再对着手机把加粗句读出声，没条件就算完成。\n\n读物是我用自己的话写的当天 AI 新闻，难度控制在 B2（长句少、专业词有表）。不是原文摘抄，事实以来源为准。","sources":"- AI Weekly「AI News Today, September 13」汇总页：Amodei 文章、METR 人事、OpenAI IPO、Positron 融资、Nvidia 澳洲、UMG × ElevenLabs\n- AI Weekly「AI News Today, September 16」汇总页（9/17、9/18 两篇读物的事实来源）\n- Utility Dive「House passes ratepayer protection bill to limit data center cost shifts」（9/16，417-3、100MW 门槛、各州一年/两年时限、Heinrich 的 GRID Savings Act）\n- Crusoe 官方新闻稿 + TechCrunch（9/17，39 亿美元 Series F、309 亿估值、可拖运的模块化 AI factory）\n- AlphaSignal / MindStudio 关于 Edge0-35B-A3B 的报道（9/17，24GB Mac mini 上约 20 tokens/s，最低 3GB 内存，MoE 专家权重从 SSD 流式读取 + 提前一个 token 预测路由）；论文 arXiv 2609.18063\n- AI Weekly「AI News Today」9/14–9/15 汇总页：Anthropic 算力合同、Trump 在 Truth Social 的表态、Apple iOS 27、DeepMind 安全研究员离职 — aiweekly.co/ai-news-today\n- AI-Weekly Issue 234（2026-09-15）：Meta Muse 发布与定价、Visa/Mastercard/Ant International 的「Know Your Agent」、Amodei「pace the frontier」 — ai-weekly.ai/newsletter-09-15-2026\n- Anthropic 5170 亿美元算力合同、14.8 GW（多家报道，2026-09-14/15）：investing.com、forkast.news、cryptobriefing.com\n- Bloomberg 2026-09-15：中国官媒称「放慢 AI」的提议是 self-serving — bloomberg.com/news/articles/2026-09-15/chinese-state-media-dismisses-self-serving-ai-slowdown-call\n- AI Weekly「AI News Today, September 15–16」汇总页：NYT/Siena 数据中心民调、Trump Truth Social、Commerce 要求 Kalshi 下架算力价格产品、Anthropic 澳洲昆士兰数据中心、Z.AI 融资、Gemini 3.8 Live、Firefox × Mistral — aiweekly.co/ai-news-today\n- artificialintelligence-news.com 2026-09-14/16 头条页（Microsoft Humanist AI Code of Conduct 公开征询、Pony.ai 自动驾驶卡车）— artificialintelligence-news.com","isoWeek":"2026-W38","file":"2026-W38.md"},"ai4s":null},{"date":"2026-09-17","week":1,"weekday":4,"weekdayCn":"周四","topic":"利率是怎么定的","scenario":{"n":1,"sym":"①","name":"一分钟自我介绍"},"macro":{"week":1,"topic":"利率是怎么定的","heading":"概念笔记（我的版本）","md":"这一节是我按你 013 概念页的格式写的「利率是怎么定的」。第一阶段你读它、对照凌晨的结果看哪里对哪里错；等你觉得能自己写了，把它改成你自己的话存进 `概念/`。\n\n**一句话**：美联储用\"银行隔夜借钱的利率\"当总闸，目标是 PCE 通胀 2% 加最大就业，方法是一年 8 次会投票定区间、用 IORB 和 ON RRP 把市场利率夹在区间里、用声明和点阵图管理预期。\n\n**这个概念解决什么问题**：看到\"美联储加息\"四个字时，能立刻回答三个问题——它看的是哪个数（PCE，不是 CPI）、它为什么现在动（通胀 3.3–3.7% 磨了 5 年多，就业还稳）、动了以后第一个受影响的价格是什么（2 年期美债收益率，然后是美元）。\n\n**本周真实数据验证**：结果已经出来了（北京时间 9/17 凌晨 2:00 发的声明），实际值我填在下面。看的时候重点不是记数字，是看上面「一句话」那段说的三件事有没有被这次会议证实。\n\n| 要查的 | 实际（9/18 补上） |\n|---|---|\n| 利率决定 + 投票 | 加 25 个基点到 3.75–4.00%，12 比 0 全票。2023 年 7 月以来第一次加息 |\n| 点阵图中位数 | 2026 年底 4.1%（6 月预测 3.8%）；2027 年 4.1%（6 月 3.6%）；2028 年 3.9%（6 月 3.4%）。整条线往上抬了一截 |\n| 声明里还有没有「供给冲击、包括能源」 | 没了，整句删掉。换成「通胀仍然偏高。今天这次行动会让通胀更及时地回到委员会 2% 的目标」 |\n| 2 年期美债收益率 | 4.74%，当天 +7bp。10 年期回到 5.01%，30 年期 5.35% |\n| 美元 / 黄金 / BTC / 股 | 美元跳涨；黄金 4,240–4,366 震荡、收 4,300 附近；BTC 76,360（+0.28%）；标普当天 -0.5% 收 7,551 |\n| 这次的经济预测（SEP） | 2026 年 PCE 通胀 3.7%（上次 3.6%），核心 PCE 3.4%（上次 3.3%），失业率 4.1%（比 6 月下调 0.2 个百分点）。通胀回到 2% 的时间点被推到 2029 年 |\n\n**这次会议验证了什么**：验证了「它看 PCE 不看 CPI」——SEP 里列的全是 PCE，没有 CPI；验证了「通胀离 2% 多远 + 就业稳不稳」这两件事决定一切——失业率预测被下调、他们才敢加；也验证了「第一个受影响的价格是 2 年期美债」——2 年期当天动 7bp，10 年期只动 2bp，短端先动，长端基本没理。\n\n**哪里没验证到**：我周三猜会有鸽派投反对票，结果全票；猜声明会保留「能源」那句，结果删了。这两条错法是一样的——我低估了他们想把通胀责任揽回自己身上的意愿。**这一点值得你记住：一个机构改口的方向，往往比它这次做了什么更能预告它下次做什么。**\n\n**容易混的**：加息 ≠ 缩表（前者是价格，后者是数量）；点阵图 ≠ 承诺；CPI ≠ 美联储目标。\n\n**下一个要学的**：钱是怎么被造出来又收回去的（第 2 周：资产负债表、QE/QT、准备金）。","ready":true,"intro":"**先看结论**：美联储定利率只看两件事——通胀离 2% 多远、就业稳不稳。现在（2026 年 9 月）通胀 3.7%（PCE），就业稳（失业率 4.1%），所以它在往\"加息\"走：7 月已有 3 个委员投票要加，8 月底主席 Warsh 在 Jackson Hole 说\"否则我们还有活要干\"，市场现在押 85% 这周三（北京时间 9/17 凌晨 2 点）加 25 个基点，把利率从 3.50–3.75% 提到 3.75–4.00%。本周你要看懂的就是：它凭什么、看哪几个数、加了以后钱会怎么流。\n\n每天读当天那一节，35 分钟够。标着「原始材料」的是引用或转述，标着「我的判断」的是我的看法，可以不同意。","sources":"- Fed, The Fed Explained: Monetary Policy — federalreserve.gov/aboutthefed/fedexplained/monetary-policy.htm\n- FOMC statement 2026-07-29 — federalreserve.gov/newsevents/pressreleases/monetary20260729a.htm\n- FOMC minutes July 28–29, 2026 — federalreserve.gov/monetarypolicy/fomcminutes20260729.htm\n- Warsh, Jackson Hole keynote 2026-08-28 — federalreserve.gov/newsevents/speech/warsh20260828a.htm\n- BEA, Personal Income and Outlays, July 2026（PCE）；BLS, CPI August 2026（9/11 发布）；BLS/UPI, Employment Situation August 2026（9/4 发布）\n- centralbank.watch FedWatch 页面（9/11）；Kiplinger CPI 报道（9/11）；Yahoo Finance 9 月加息概率报道（9/8）\n- Schwab「Fed Hikes in 12-0 Vote, Commits to Inflation Fight」（9/17）；Kiplinger 9 月 FOMC 直播页；Vantage Markets 9/17 决议要点；TradingKey 9 月 SEP/点阵图解读\n- Saxo「First Fed hike since 2023 lifts the dollar」（9/17，2 年期 4.74%、10 年期约 5.00%、黄金 4,240–4,366、BTC 76,360）\n- Forbes Advisor Treasury Rates（9/16 收盘：2 年 4.74%、10 年 5.01%、30 年 5.35%）\n- Yahoo Finance 8/28 市场直播页（10 年期 +4bp 收 4.72%、30 年期 5.21%）；USAGOLD 8/28 日报（黄金现货 4,608）\n- Yahoo/路透 8/26「Treasury yields muted after headline PCE ticks up」（10 年期 +2.4bp 收 4.643%）；WichitaLiberty 7 月 PCE 报告解读（核心环比 +0.2%、同比 3.3%）\n- Webull / Motley Fool NVDA Q2 FY2027 报道（收入 962.2 亿、Q3 指引 1080 亿、8/27 收 227.98 美元 +8.74%）\n- mining.com 8/12 铜创纪录报道（盘中 6.7140、收 6.6335）；SMM/metal.com 8/26（盘中 6.7270 创纪录）；Rio Times 9/17（9/16 收 6.4315）","file":"W01-利率是怎么定的.md"},"eng":{"heading":"读物：Nobody wants it next door","md":"**AI is running into a very old problem: people like the product, but they do not want the factory next to their house.** A New York Times and Siena poll published on September 15 found that 61 percent of American voters oppose building a new AI data center in their own area. Trust in who should write the rules is split almost evenly — 42 percent of Republicans and 40 percent of Democrats. **When both sides distrust the same thing about equally, the fight moves from Washington down to the local council.**\n\nPresident Trump answered the critics directly. On Truth Social he wrote that the only AI \"guardrail\" the country needs is \"a STRONG AND SMART (High IQ!) PRESIDENT,\" and he argued that people who block data centers are helping China. On the same day, the Commerce Department told the prediction market Kalshi to remove a product that tracked the price of AI compute, calling it a national security concern. **A price is just information, and somebody decided that this particular information was too useful.**\n\nMeanwhile the building goes on — only further away. On September 16 Anthropic signed its first data-center lease in Australia: a site in the Western Downs region of Queensland, worth about 32 billion Australian dollars, with 2.16 gigawatts of capacity and a target start in 2027. In China, Z.AI raised roughly 8 billion dollars in equity and convertible bonds to pay for its next GLM models. The map of AI keeps spreading out, because the power, the land and the patience are somewhere else.\n\nProducts shipped too. Google released Gemini 3.8 Live Extended Thinking and claims the top score on speech-to-speech benchmarks, at 82.6. Mozilla's Firefox now runs its Smart Window assistant on Mistral models, and has extended it to France after the US and Canada. **Two quiet signals there: voice is becoming a real interface, and the browser is becoming a place where a model sits by default.**\n\nSo what does this mean for an independent developer? Three things. Cheap compute is not guaranteed forever, because it rests on power projects that ordinary voters can slow down. If browsers ship with an assistant, your site will be summarized before it is read, so the first screen has to say plainly what you do. And voice is now good enough to build on. **You do not need a data center to use any of this. You only need to notice which way the ground is moving.**\n\n（约 400 词）\n\n### 词汇表\n\n| 词 | 意思 | 文中用法 |\n|---|---|---|\n| poll (n.) | 民调 | a New York Times and Siena poll |\n| oppose | 反对 | 61 percent of voters oppose building a data center |\n| be split evenly | 意见对半开 | trust is split almost evenly |\n| council | （地方）议会、居委会级别的机构 | the fight moves down to the local council |\n| guardrail | 护栏（这里指给 AI 设的限制） | the only AI \"guardrail\" the country needs |\n| prediction market | 预测市场（可以下注某件事会不会发生的平台） | the prediction market Kalshi |\n| compute (n.) | 算力（当名词用，不可数） | a product that tracked the price of AI compute |\n| lease (n.) | 租约 | signed its first data-center lease |\n| capacity | 容量（这里指电力规模） | 2.16 gigawatts of capacity |\n| convertible bond | 可转债 | raised money in equity and convertible bonds |\n| benchmark | 跑分、基准测试 | the top score on speech-to-speech benchmarks |\n| by default | 默认地、不用设置就有 | a model sits there by default |\n| summarize | 概括、摘要 | your site will be summarized before it is read |\n| rest on | 建立在…之上、靠…撑着 | it rests on power projects |\n| spread out | 铺开、分散 | the map of AI keeps spreading out |\n\n### 今日表达\n\n1. **not in my back yard** — 我支持这事，但别建在我家旁边。People want the AI, but not in their back yard.\n2. **split almost evenly** — 几乎对半开。Opinion on the new rule is split almost evenly.\n3. **by default** — 默认就是这样，不用你动手。The browser ships with an assistant by default.\n4. **is not guaranteed** — 不是理所当然的、说没就没。Cheap compute is not guaranteed forever.\n5. **rest on** — 靠什么撑着。My whole plan rests on one supplier.\n6. **notice which way the ground is moving** — 看清地在往哪边动（风向）。I can't control it; I just try to notice which way the ground is moving.\n\n### 场景范例 ①：一分钟自我介绍\n\n> Hi, I'm Fred. I'm an AI engineer based in China. In my day job I build AI products for government clients — mostly document and data systems, where the hard part is usually not the model, it's the requirements. **I've been doing that for a few years, and what I'm actually good at is shipping something that has to survive a review.** On the side I run a small SaaS of my own. It's called ScribbleCub: you type a description and it generates printable coloring pages. Parents and teachers use it. I built it because I wanted one product where I decide everything — the price, the wording, what gets built next. **Most of my users are in the US and I'm not, so I'm learning to talk about my work in English instead of only writing it.** I'm also teaching myself macro economics at the moment, because I want to understand why money moves the way it does. So: engineer by day, very small founder by night.\n\n**心里回答**：用英文在心里说一遍你自己的版本，60 秒。顺序照范例来：我是谁 → 白天做什么（一句话说清难点在哪） → 业余做什么（产品名 + 一句话说清它干嘛 + 为什么做） → 现在在学什么。别停下来改语法，卡住就说 \"anyway\" 往下走。明天（周五）的场景是「讲一个我做的产品」，今天这段里 ScribbleCub 那两句就是明天的开头。","ready":true,"howto":"**怎么用（上班默读版，20–25 分钟）**：① 读物读一遍只求看懂（5 分钟）；② 再读一遍，**加粗的句子在心里默念出声**，嘴型可以动、不出声（5 分钟）；③ 从「今日表达」里挑 3–5 个抄进总表当天那格，各造一句（5 分钟）；④ 读场景范例，然后闭上眼用英文在心里回答范例后面那个问题，撑 2 分钟（5 分钟）。晚上有条件再对着手机把加粗句读出声，没条件就算完成。\n\n读物是我用自己的话写的当天 AI 新闻，难度控制在 B2（长句少、专业词有表）。不是原文摘抄，事实以来源为准。","sources":"- AI Weekly「AI News Today, September 13」汇总页：Amodei 文章、METR 人事、OpenAI IPO、Positron 融资、Nvidia 澳洲、UMG × ElevenLabs\n- AI Weekly「AI News Today, September 16」汇总页（9/17、9/18 两篇读物的事实来源）\n- Utility Dive「House passes ratepayer protection bill to limit data center cost shifts」（9/16，417-3、100MW 门槛、各州一年/两年时限、Heinrich 的 GRID Savings Act）\n- Crusoe 官方新闻稿 + TechCrunch（9/17，39 亿美元 Series F、309 亿估值、可拖运的模块化 AI factory）\n- AlphaSignal / MindStudio 关于 Edge0-35B-A3B 的报道（9/17，24GB Mac mini 上约 20 tokens/s，最低 3GB 内存，MoE 专家权重从 SSD 流式读取 + 提前一个 token 预测路由）；论文 arXiv 2609.18063\n- AI Weekly「AI News Today」9/14–9/15 汇总页：Anthropic 算力合同、Trump 在 Truth Social 的表态、Apple iOS 27、DeepMind 安全研究员离职 — aiweekly.co/ai-news-today\n- AI-Weekly Issue 234（2026-09-15）：Meta Muse 发布与定价、Visa/Mastercard/Ant International 的「Know Your Agent」、Amodei「pace the frontier」 — ai-weekly.ai/newsletter-09-15-2026\n- Anthropic 5170 亿美元算力合同、14.8 GW（多家报道，2026-09-14/15）：investing.com、forkast.news、cryptobriefing.com\n- Bloomberg 2026-09-15：中国官媒称「放慢 AI」的提议是 self-serving — bloomberg.com/news/articles/2026-09-15/chinese-state-media-dismisses-self-serving-ai-slowdown-call\n- AI Weekly「AI News Today, September 15–16」汇总页：NYT/Siena 数据中心民调、Trump Truth Social、Commerce 要求 Kalshi 下架算力价格产品、Anthropic 澳洲昆士兰数据中心、Z.AI 融资、Gemini 3.8 Live、Firefox × Mistral — aiweekly.co/ai-news-today\n- artificialintelligence-news.com 2026-09-14/16 头条页（Microsoft Humanist AI Code of Conduct 公开征询、Pony.ai 自动驾驶卡车）— artificialintelligence-news.com","isoWeek":"2026-W38","file":"2026-W38.md"},"ai4s":null},{"date":"2026-09-18","week":1,"weekday":5,"weekdayCn":"周五","topic":"利率是怎么定的","scenario":{"n":2,"sym":"②","name":"讲一个我做的产品"},"macro":{"week":1,"topic":"利率是怎么定的","heading":"对账（我来对，你看）","md":"013 预判总账里 W35 写的 7 条预判这周全部到期，数据我都查完了，实际结果填在下面。**这张表你读完自己填回总账，那个文件我不动。**\n\n| 编号 | 预判（缩写） | 截止 | 实际 | 判 | 错在哪一类 |\n|---|---|---|---|---|---|\n| P-001 | Warsh 8/28 讲话当天收盘 10 年美债在 4.50–4.80% | 8/28 | 当天 +4bp 收 4.72% | 对 | — |\n| P-002 | 9 月 FOMC 维持 3.50–3.75% 不动 | 9/17 | 加 25bp 到 3.75–4.00%，12 比 0 | 错 | 低估了「换了主席」这个变量 |\n| P-003 | NVDA Q2 收入 ≥920 亿、Q3 指引 ≥1000 亿；财报次日涨幅 <+5% | 8/28 | 收入 962.2 亿（同比 +106%），Q3 指引 1080 亿；8/27 收盘 +8.74% 到 227.98 美元 | 半对 | 业务判断对，股价反应判断错 |\n| P-004 | 9 月 FOMC 前 30 年美债收盘再次 ≥5.30% | 9/16 | 9/16 收 5.35% | 对 | — |\n| P-005 | 7 月核心 PCE 环比 ≤0.3%；当天 10 年美债波动 ±8bp 以内 | 8/26 | 核心 PCE 环比 +0.2%（同比 3.3%）；10 年期当天 +2.4bp 收 4.643% | 对 | — |\n| P-006 | Warsh 讲话当天黄金现货在 4,550–4,850 | 8/28 | 4,608 美元/盎司 | 对 | — |\n| P-007 | 9 月 FOMC 前 COMEX 铜每日收盘都 <6.71 美元/磅（不创新高） | 9/16 | 8/12 盘中摸到 6.7140、8/26 盘中摸到 6.7270，两次都创了历史新高；但 8/12 收 6.6335、9/16 收 6.4315。8/26 那天的结算价我没查到 | 半对（存疑） | 一条里塞了两个条件，自己都说不清算对算错 |\n\n**算下来 4 对、2 半对、1 错，准确率 (4 + 2×0.5) ÷ 7 = 71%。**\n\n但这个 71% 没什么含金量，原因周三那节提过：7 条里有 5 条是「某天某个价格落在某个区间」。这种题猜中了也不代表你想对了。真正有东西的是下面三条：\n\n- **P-002 错在哪**：8/26 写它的理由是「通胀磨了五年，他们忍这么久不会突然动」。错的不是这个推理，是我没把「Warsh 刚上任、他需要立威」算进去。**教训：一个机构刚换一把手，「历史惯性」这条理由要打折。**\n- **P-003 为什么只算半对**：收入和指引都猜准了，说明公司基本面是能推的；股价猜错了 3.7 个百分点，说明「好消息早就被市场消化了」这种直觉在情绪极端的时候不管用。**教训：基本面预判和价格反应预判要分成两条写、分开记分，混一条等于没判。**\n- **P-007 这条本来就不该这么写**：一句话里塞了两个不同的条件（每日收盘 <6.71、不创新高），结果一个对一个错。**教训：一条预判只判一件事。**\n\n下轮预判的三条规矩（我在 W38 周记草稿里就是按这个写的）：一条只判一件事；尽量判「会不会发生、为什么」而不是「价格落在哪个区间」；每条后面必须写一句「什么结果算我错了」。\n\n**下周（9/21–9/27）该盯的数据**：\n\n- **周四 H.4.1 美联储资产负债表**——第 2 周主题就是它，而且是加息后第一份\n- **9/25 周五 8 月 PCE**——上一次核心环比 +0.2%，看这次有没有往上翘\n- **加息后第一周的 2 年期美债**：继续往上走，说明市场信「年内还有一次」；掉头往下，说明市场认为这就是最后一加\n- **30 年期已经 5.35%**：离 2007 年以来的高点很近了。它比 2 年期更能说明市场信不信美国的财政，第 7 周讲财政那周会回来看它","ready":true,"intro":"**先看结论**：美联储定利率只看两件事——通胀离 2% 多远、就业稳不稳。现在（2026 年 9 月）通胀 3.7%（PCE），就业稳（失业率 4.1%），所以它在往\"加息\"走：7 月已有 3 个委员投票要加，8 月底主席 Warsh 在 Jackson Hole 说\"否则我们还有活要干\"，市场现在押 85% 这周三（北京时间 9/17 凌晨 2 点）加 25 个基点，把利率从 3.50–3.75% 提到 3.75–4.00%。本周你要看懂的就是：它凭什么、看哪几个数、加了以后钱会怎么流。\n\n每天读当天那一节，35 分钟够。标着「原始材料」的是引用或转述，标着「我的判断」的是我的看法，可以不同意。","sources":"- Fed, The Fed Explained: Monetary Policy — federalreserve.gov/aboutthefed/fedexplained/monetary-policy.htm\n- FOMC statement 2026-07-29 — federalreserve.gov/newsevents/pressreleases/monetary20260729a.htm\n- FOMC minutes July 28–29, 2026 — federalreserve.gov/monetarypolicy/fomcminutes20260729.htm\n- Warsh, Jackson Hole keynote 2026-08-28 — federalreserve.gov/newsevents/speech/warsh20260828a.htm\n- BEA, Personal Income and Outlays, July 2026（PCE）；BLS, CPI August 2026（9/11 发布）；BLS/UPI, Employment Situation August 2026（9/4 发布）\n- centralbank.watch FedWatch 页面（9/11）；Kiplinger CPI 报道（9/11）；Yahoo Finance 9 月加息概率报道（9/8）\n- Schwab「Fed Hikes in 12-0 Vote, Commits to Inflation Fight」（9/17）；Kiplinger 9 月 FOMC 直播页；Vantage Markets 9/17 决议要点；TradingKey 9 月 SEP/点阵图解读\n- Saxo「First Fed hike since 2023 lifts the dollar」（9/17，2 年期 4.74%、10 年期约 5.00%、黄金 4,240–4,366、BTC 76,360）\n- Forbes Advisor Treasury Rates（9/16 收盘：2 年 4.74%、10 年 5.01%、30 年 5.35%）\n- Yahoo Finance 8/28 市场直播页（10 年期 +4bp 收 4.72%、30 年期 5.21%）；USAGOLD 8/28 日报（黄金现货 4,608）\n- Yahoo/路透 8/26「Treasury yields muted after headline PCE ticks up」（10 年期 +2.4bp 收 4.643%）；WichitaLiberty 7 月 PCE 报告解读（核心环比 +0.2%、同比 3.3%）\n- Webull / Motley Fool NVDA Q2 FY2027 报道（收入 962.2 亿、Q3 指引 1080 亿、8/27 收 227.98 美元 +8.74%）\n- mining.com 8/12 铜创纪录报道（盘中 6.7140、收 6.6335）；SMM/metal.com 8/26（盘中 6.7270 创纪录）；Rio Times 9/17（9/16 收 6.4315）","file":"W01-利率是怎么定的.md"},"eng":{"heading":"读物：Who pays for the power?","md":"**The AI industry has spent three years asking for electricity. This week Washington started asking who pays the bill.** On September 16 the US House of Representatives passed the Ratepayer Protection Act by 417 votes to 3. That is not a normal margin. It means almost every Republican and almost every Democrat agreed on one thing: a data center should not be able to push the cost of new power lines onto the family down the road.\n\nThe bill covers any single site that draws more than 100 megawatts. Those sites would have to put money up front before the grid is upgraded, pay the full extra cost of any new generation or transmission line they make necessary, and pay a fee if they walk away from a power contract early. States get one year to start considering the rules and two years to decide. **The law does not stop anyone from building. It only makes the builder carry the cost.**\n\nIt may not become law soon. The Senate calendar before the November midterm elections is tight, and a competing bill from Senator Martin Heinrich would go further. But the vote itself is the signal.\n\nThe money kept moving anyway. On September 17 Crusoe, a company that builds data centers next to unused power, raised 3.9 billion dollars at a valuation of 30.9 billion. Part of its pitch is small modular \"AI factories\" that can be trucked to wherever spare electricity happens to be. On the same day Nvidia, Google and Emerald announced an alliance to make data centers flexible, so they can turn down when the grid is under strain. **Both moves say the same thing: the constraint is no longer chips, it is watts, and everyone is now designing around that.**\n\nElsewhere, India doubled its semiconductor mission to 13.5 billion dollars over twelve years, with Applied Materials pledging 5 billion. Canada and Germany each gave 150 million dollars to Yoshua Bengio's safety non-profit, LawZero.\n\nSo what does this mean for an independent developer? Your costs sit on top of somebody's electricity bill, and that bill is becoming political. **Price your product so it survives a rise in compute costs, not only today's rate.** And if your product can work on a smaller model, move it now. That is a margin decision, not an engineering hobby.\n\n（约 400 词）\n\n### 词汇表\n\n| 词 | 意思 | 文中用法 |\n|---|---|---|\n| ratepayer | 交电费的人、用户 | the Ratepayer Protection Act |\n| margin (n.) | 差距（这里指票数差距；后面一处指利润率） | that is not a normal margin |\n| push the cost onto | 把成本甩给某人 | push the cost onto the family down the road |\n| up front | 预先、先付 | put money up front |\n| transmission | 输电（线路） | any new generation or transmission line |\n| walk away from | 中途退出、不干了 | walk away from a power contract early |\n| midterm elections | 中期选举 | before the November midterm elections |\n| competing bill | 打对台的另一个法案 | a competing bill from Senator Heinrich |\n| valuation | 估值 | a valuation of 30.9 billion |\n| modular | 模块化的 | small modular \"AI factories\" |\n| under strain | 吃紧、扛不住 | turn down when the grid is under strain |\n| constraint | 瓶颈、限制条件 | the constraint is no longer chips |\n| pledge | 承诺投入 | Applied Materials pledging 5 billion |\n| non-profit | 非营利组织 | Bengio's safety non-profit |\n| sit on top of | 建立在…之上 | your costs sit on top of somebody's electricity bill |\n\n### 今日表达\n\n1. **that is not a normal margin** — 这个差距不正常（用来强调数字本身说明问题）。417 to 3 — that is not a normal margin.\n2. **push the cost onto someone** — 把成本甩给别人。They are pushing the cost onto ordinary users.\n3. **up front** — 先付、先说清楚。I ask for half the money up front.\n4. **walk away from** — 中途退出。We can walk away from the contract, but there is a fee.\n5. **the constraint is no longer X, it is Y** — 卡脖子的已经不是 X 而是 Y。The constraint is no longer the model, it is the data.\n6. **that is a business decision, not a hobby** — 这是生意上的决定，不是玩票。Cutting the model size is a margin decision, not an engineering hobby.\n\n### 场景范例 ②：讲一个我做的产品\n\n> Let me tell you about the thing I built. It's called ScribbleCub. You type a description — \"a friendly dinosaur having a picnic\" — and it gives you a printable coloring page. **The problem it solves is small but real: a parent or a teacher needs a specific picture, right now, and searching for one takes twenty minutes and usually ends in something ugly with a watermark.** My users are mostly parents in the US and elementary teachers. It's a subscription — a few dollars a month, with a free tier so people can see the quality before they pay. **The hardest part wasn't the generation. It was making the lines clean enough to actually color.** A model will happily give you a beautiful shaded illustration, which is exactly wrong — you need thick, closed outlines and a lot of white space. I spent more time on that than on everything else combined. What I'd change: I built features for months before I talked to a single user. Now I try to ship the smallest version and let them tell me what's missing.\n\n**心里回答**：用英文在心里讲一遍你自己的版本，2 分钟。四句话的框架：① 它是什么、一句话说清（**不要说技术，说用户按了什么、拿到了什么**）；② 解决谁的什么问题；③ 怎么收费；④ 最难的地方是什么（这句最重要，讲不出难点的人听起来像在背广告）。最后可以加一句「如果重来我会怎么做」。卡住就说 \"the thing is...\" 拖一秒再接。","ready":true,"howto":"**怎么用（上班默读版，20–25 分钟）**：① 读物读一遍只求看懂（5 分钟）；② 再读一遍，**加粗的句子在心里默念出声**，嘴型可以动、不出声（5 分钟）；③ 从「今日表达」里挑 3–5 个抄进总表当天那格，各造一句（5 分钟）；④ 读场景范例，然后闭上眼用英文在心里回答范例后面那个问题，撑 2 分钟（5 分钟）。晚上有条件再对着手机把加粗句读出声，没条件就算完成。\n\n读物是我用自己的话写的当天 AI 新闻，难度控制在 B2（长句少、专业词有表）。不是原文摘抄，事实以来源为准。","sources":"- AI Weekly「AI News Today, September 13」汇总页：Amodei 文章、METR 人事、OpenAI IPO、Positron 融资、Nvidia 澳洲、UMG × ElevenLabs\n- AI Weekly「AI News Today, September 16」汇总页（9/17、9/18 两篇读物的事实来源）\n- Utility Dive「House passes ratepayer protection bill to limit data center cost shifts」（9/16，417-3、100MW 门槛、各州一年/两年时限、Heinrich 的 GRID Savings Act）\n- Crusoe 官方新闻稿 + TechCrunch（9/17，39 亿美元 Series F、309 亿估值、可拖运的模块化 AI factory）\n- AlphaSignal / MindStudio 关于 Edge0-35B-A3B 的报道（9/17，24GB Mac mini 上约 20 tokens/s，最低 3GB 内存，MoE 专家权重从 SSD 流式读取 + 提前一个 token 预测路由）；论文 arXiv 2609.18063\n- AI Weekly「AI News Today」9/14–9/15 汇总页：Anthropic 算力合同、Trump 在 Truth Social 的表态、Apple iOS 27、DeepMind 安全研究员离职 — aiweekly.co/ai-news-today\n- AI-Weekly Issue 234（2026-09-15）：Meta Muse 发布与定价、Visa/Mastercard/Ant International 的「Know Your Agent」、Amodei「pace the frontier」 — ai-weekly.ai/newsletter-09-15-2026\n- Anthropic 5170 亿美元算力合同、14.8 GW（多家报道，2026-09-14/15）：investing.com、forkast.news、cryptobriefing.com\n- Bloomberg 2026-09-15：中国官媒称「放慢 AI」的提议是 self-serving — bloomberg.com/news/articles/2026-09-15/chinese-state-media-dismisses-self-serving-ai-slowdown-call\n- AI Weekly「AI News Today, September 15–16」汇总页：NYT/Siena 数据中心民调、Trump Truth Social、Commerce 要求 Kalshi 下架算力价格产品、Anthropic 澳洲昆士兰数据中心、Z.AI 融资、Gemini 3.8 Live、Firefox × Mistral — aiweekly.co/ai-news-today\n- artificialintelligence-news.com 2026-09-14/16 头条页（Microsoft Humanist AI Code of Conduct 公开征询、Pony.ai 自动驾驶卡车）— artificialintelligence-news.com","isoWeek":"2026-W38","file":"2026-W38.md"},"ai4s":null},{"date":"2026-09-19","week":1,"weekday":6,"weekdayCn":"周六","topic":"利率是怎么定的","scenario":{"n":7,"sym":"⑦","name":"讲今天的日常"},"macro":null,"eng":{"heading":"读物：The model that fits in your laptop（今天是周末 A，读物短一点）","md":"**Today's interesting news is not about a bigger model. It's about a smaller one.** On September 17 a team called AutoArk released Edge0, with an unusual claim: a 35-billion-parameter mixture-of-experts model running at about 20 tokens per second on a Mac mini with 24 gigabytes of memory. A model that size normally needs a server.\n\nThe trick is that it never holds the whole model in memory. A mixture-of-experts model only uses a small slice of itself for each token, so Edge0 leaves the rest on the SSD and pulls in the pieces it needs. To hide the delay, it guesses one token ahead which pieces will be wanted and starts loading them early. The team says it can run in as little as 3 gigabytes of RAM.\n\n**If this holds up outside the demo, the floor just dropped.** For three years the answer to \"can I run this myself\" has been no, and the bill went to an API instead.\n\nTwo cautions. Reading constantly from an SSD wears it out, and speed on a benchmark is not the same as a good answer.\n\nSo what does this mean for you? **Not everything you build has to call an API.** For the small, boring, high-volume jobs — tagging, cleaning up text, rewriting a prompt — a local model may be cheaper and private by default. Worth one afternoon of testing.\n\n（约 250 词）\n\n### 词汇表\n\n| 词 | 意思 | 文中用法 |\n|---|---|---|\n| mixture of experts | 混合专家（模型里分成很多小块，每次只用其中几块） | a mixture-of-experts model |\n| parameter | 参数 | a 35-billion-parameter model |\n| tokens per second | 每秒吐多少个词（生成速度） | about 20 tokens per second |\n| slice (n.) | 一小块、一片 | only uses a small slice of itself |\n| pull in | 把…调进来 | pulls in the pieces it needs |\n| guess ahead | 提前猜 | guesses one token ahead |\n| hold up | 站得住脚、经得起检验 | if this holds up outside the demo |\n| the floor just dropped | 门槛一下子降下来了 | the floor just dropped |\n| wear out | 磨损、用坏 | reading from an SSD wears it out |\n| benchmark | 跑分 | speed on a benchmark |\n| high-volume | 量大的 | the small, boring, high-volume jobs |\n| by default | 默认就是 | cheaper and private by default |\n| worth a try | 值得试一下 | worth one afternoon of testing |\n\n### 今日表达\n\n1. **it's not about X, it's about Y** — 重点不是 X，是 Y。It's not about speed, it's about cost.\n2. **the trick is that...** — 关键在于…（讲原理时的开头）。The trick is that it never loads the whole thing.\n3. **hold up** — 站得住脚。Let's see if the claim holds up.\n4. **the floor just dropped** — 门槛一下降下来了。Once that shipped, the floor just dropped for everyone.\n5. **by default** — 默认如此，不用额外做什么。Running locally means it's private by default.\n6. **worth an afternoon** — 值得花一个下午试试。It's worth an afternoon to find out.\n\n### 场景范例 ⑦：讲今天的日常（今天是 Figma + 信息架构攻克日）\n\n> Today wasn't a work day, but it wasn't a rest day either. I blocked out the whole thing to learn one tool properly — Figma — because I keep designing my own product pages in code, and that's slow and I'm not good at it. I started around nine with coffee and no plan beyond \"build one real screen.\" **By lunch I understood maybe a third of it, which was frustrating, and then something clicked with components and it got much faster.** The part I didn't expect to enjoy was the information architecture side — just sitting down and deciding what goes on which page and in what order, before drawing anything. It turns out most of my design problems were actually structure problems. In the afternoon I rebuilt my landing page as a proper layout. It's not beautiful yet, but it's honest. **Tonight I'm not touching a screen.** I'll go for a walk, get something to eat, and read for a bit. Tomorrow is a writing day — I owe myself a post.\n\n**心里回答**：用英文在心里讲一遍你今天，2 分钟。别按小时流水账，按「一件事 + 一个感受 + 一个意外」来讲：今天最主要在干什么 → 中间哪一刻卡住了或者突然顺了 → 有没有什么跟预想的不一样 → 晚上打算干嘛。**注意范例里的时态**：讲今天已经发生的用过去式（started / understood / rebuilt），讲今晚和明天用 \"I'm going to\" 或者现在进行时（I'm not touching / Tomorrow is）。这是口语里最容易露怯的地方，今天专门练这个。","ready":true,"howto":"**怎么用（上班默读版，20–25 分钟）**：① 读物读一遍只求看懂（5 分钟）；② 再读一遍，**加粗的句子在心里默念出声**，嘴型可以动、不出声（5 分钟）；③ 从「今日表达」里挑 3–5 个抄进总表当天那格，各造一句（5 分钟）；④ 读场景范例，然后闭上眼用英文在心里回答范例后面那个问题，撑 2 分钟（5 分钟）。晚上有条件再对着手机把加粗句读出声，没条件就算完成。\n\n读物是我用自己的话写的当天 AI 新闻，难度控制在 B2（长句少、专业词有表）。不是原文摘抄，事实以来源为准。","sources":"- AI Weekly「AI News Today, September 13」汇总页：Amodei 文章、METR 人事、OpenAI IPO、Positron 融资、Nvidia 澳洲、UMG × ElevenLabs\n- AI Weekly「AI News Today, September 16」汇总页（9/17、9/18 两篇读物的事实来源）\n- Utility Dive「House passes ratepayer protection bill to limit data center cost shifts」（9/16，417-3、100MW 门槛、各州一年/两年时限、Heinrich 的 GRID Savings Act）\n- Crusoe 官方新闻稿 + TechCrunch（9/17，39 亿美元 Series F、309 亿估值、可拖运的模块化 AI factory）\n- AlphaSignal / MindStudio 关于 Edge0-35B-A3B 的报道（9/17，24GB Mac mini 上约 20 tokens/s，最低 3GB 内存，MoE 专家权重从 SSD 流式读取 + 提前一个 token 预测路由）；论文 arXiv 2609.18063\n- AI Weekly「AI News Today」9/14–9/15 汇总页：Anthropic 算力合同、Trump 在 Truth Social 的表态、Apple iOS 27、DeepMind 安全研究员离职 — aiweekly.co/ai-news-today\n- AI-Weekly Issue 234（2026-09-15）：Meta Muse 发布与定价、Visa/Mastercard/Ant International 的「Know Your Agent」、Amodei「pace the frontier」 — ai-weekly.ai/newsletter-09-15-2026\n- Anthropic 5170 亿美元算力合同、14.8 GW（多家报道，2026-09-14/15）：investing.com、forkast.news、cryptobriefing.com\n- Bloomberg 2026-09-15：中国官媒称「放慢 AI」的提议是 self-serving — bloomberg.com/news/articles/2026-09-15/chinese-state-media-dismisses-self-serving-ai-slowdown-call\n- AI Weekly「AI News Today, September 15–16」汇总页：NYT/Siena 数据中心民调、Trump Truth Social、Commerce 要求 Kalshi 下架算力价格产品、Anthropic 澳洲昆士兰数据中心、Z.AI 融资、Gemini 3.8 Live、Firefox × Mistral — aiweekly.co/ai-news-today\n- artificialintelligence-news.com 2026-09-14/16 头条页（Microsoft Humanist AI Code of Conduct 公开征询、Pony.ai 自动驾驶卡车）— artificialintelligence-news.com","isoWeek":"2026-W38","file":"2026-W38.md"},"ai4s":null},{"date":"2026-09-20","week":1,"weekday":7,"weekdayCn":"周日","topic":"利率是怎么定的","scenario":null,"macro":null,"eng":{"heading":"输出日：本周表达复习 + 一条英文帖子草稿","md":"> 这一节本该周六晚上写好，今天上午补上的。今天不读新东西，三步，20 分钟：① 过一遍下面的复习清单，只看新例句，能一眼看懂就过，看不懂的在总表里打个问号（10 分钟）；② 读帖子草稿，把【】里的地方换成你的真实情况（10 分钟）；③ 有条件就对着手机把帖子读一遍、录下来，没条件就在心里默念一遍。\n\n### 本周表达复习（每个配一句新例句，都是你能直接拿去用的场景）\n\n**周一 9/14**\n\n1. **catch up with** — My speaking needs to catch up with my reading.\n2. **rule something out** — I haven't ruled out raising the price next year.\n3. **there are no adults in the room** — When three teams own the same page, it feels like there are no adults in the room.\n4. **an ill-advised moment to…** — The week of a big Google update is an ill-advised moment to redesign your site.\n5. **take something from this** — What I took from the launch is that nobody reads the pricing page.\n6. **shift to** — Most of my traffic has shifted to mobile.\n\n**周二 9/15**\n\n7. **skip X in favor of Y** — I skipped a mobile app in favor of a simple web page.\n8. **close a round** — They closed a seed round before they had a single user.\n9. **more than double** — Sign-ups more than doubled after I put real examples on the homepage.\n10. **miss a deadline** — I missed my own deadline by two weeks, and nobody noticed except me.\n11. **frame something as** — I framed the price change as \"more pages per month\", not \"more expensive\".\n12. **the money is moving from A to B** — The money is moving from model makers to whoever owns the power.\n\n**周三 9/16**\n\n13. **talk is cheap** — Talk is cheap. Show me the retention numbers.\n14. **watch X, not Y** — Watch what users do, not what they say in surveys.\n15. **not exactly** — \"So you're a designer?\" \"Not exactly. I'm an engineer who has to design.\"\n16. **on someone's behalf** — The tool sends the reminder on your behalf.\n17. **it would cost somebody something** — A bigger free tier sounds generous, but it would cost me something every single day.\n18. **with that in mind** — Most visitors come from Pinterest. With that in mind, every page leads with a picture.\n\n**周四 9/17**\n\n19. **not in my back yard** — Everyone wants faster AI, just not a data center in their back yard.\n20. **split almost evenly** — My users are split almost evenly between parents and teachers.\n21. **by default**（周四、周六都出现了，说明很常用） — New pages are private by default.\n22. **is not guaranteed** — Free traffic from Google is not guaranteed.\n23. **rest on** — Half my income rests on one keyword. That scares me a little.\n24. **notice which way the ground is moving** — I can't predict the market. I just try to notice which way the ground is moving.\n\n**周五 9/18**\n\n25. **that is not a normal margin** — Ninety percent picked the yearly plan. That is not a normal margin.\n26. **push the cost onto someone** — I don't want to push the cost onto free users with ads.\n27. **up front** — I tell clients the timeline up front, before we talk about money.\n28. **walk away from** — I walked away from a project that paid well but taught me nothing.\n29. **the constraint is no longer X, it is Y** — The constraint is no longer writing code. It is getting people to see it.\n30. **that is a business decision, not a hobby** — Dropping the cheapest plan was a business decision, not a hobby.\n\n**周六 9/19**\n\n31. **it's not about X, it's about Y** — It's not about more features. It's about fewer steps.\n32. **the trick is that…** — The trick is that the page shows up before the image is ready.\n33. **hold up** — My first guess about who the users were didn't hold up.\n34. **the floor just dropped** — When image models got cheap, the floor just dropped for tools like mine.\n35. **worth an afternoon** — Trying a local model is worth an afternoon.\n\n**挑哪几个先用熟**：这周最值得先变成自己口头禅的是 **not exactly**、**the trick is that…**、**it's not about X, it's about Y**、**with that in mind**——这四个在讲产品、回答问题时几乎每次都用得上，而且说出来不会显得在背书。\n\n### 帖子草稿（场景②：讲一个我做的产品，约 150 词）\n\n> **The hardest part of building an AI coloring page generator wasn't the AI.**\n>\n> I run a small site called ScribbleCub. You type \"a dinosaur having a picnic\" and get a printable coloring page.\n>\n> Getting a model to draw a dinosaur took one afternoon. Getting it to draw one a six-year-old can actually color took 【how long it really took】.\n>\n> Image models love shading, soft edges and tiny details. A coloring page needs the opposite: thick lines, closed shapes, lots of white space. For a long time, every \"beautiful\" result was a useless one.\n>\n> What finally worked: 【one sentence about your real fix — for example, a rule in the prompt, a clean-up step after generation, or a check that throws away shaded images】.\n>\n> The lesson I keep relearning: the model is rarely the product. The boring part between the model and the user is.\n>\n> If you've built something with AI, what was your \"boring part\"?\n\n**发之前看三件事**：\n\n- 【】里两处一定要换成真的。编出来的数字被人追问一句就露馅，宁可写得模糊一点（\"a few weeks\"）也别瞎写。\n- 发 Reddit（比如 r/SideProject、r/SaaS）就用上面这版，第一行当标题；发 X 就只留第一行 + \"Getting a model to draw…\" 那两句 + 最后的问题，压到 280 字符以内。\n- 最后那个问题别删。帖子末尾问一句，别人才有理由回你——你要的是有人跟你用英文聊起来，不是点赞。","ready":true,"howto":"**怎么用（上班默读版，20–25 分钟）**：① 读物读一遍只求看懂（5 分钟）；② 再读一遍，**加粗的句子在心里默念出声**，嘴型可以动、不出声（5 分钟）；③ 从「今日表达」里挑 3–5 个抄进总表当天那格，各造一句（5 分钟）；④ 读场景范例，然后闭上眼用英文在心里回答范例后面那个问题，撑 2 分钟（5 分钟）。晚上有条件再对着手机把加粗句读出声，没条件就算完成。\n\n读物是我用自己的话写的当天 AI 新闻，难度控制在 B2（长句少、专业词有表）。不是原文摘抄，事实以来源为准。","sources":"- AI Weekly「AI News Today, September 13」汇总页：Amodei 文章、METR 人事、OpenAI IPO、Positron 融资、Nvidia 澳洲、UMG × ElevenLabs\n- AI Weekly「AI News Today, September 16」汇总页（9/17、9/18 两篇读物的事实来源）\n- Utility Dive「House passes ratepayer protection bill to limit data center cost shifts」（9/16，417-3、100MW 门槛、各州一年/两年时限、Heinrich 的 GRID Savings Act）\n- Crusoe 官方新闻稿 + TechCrunch（9/17，39 亿美元 Series F、309 亿估值、可拖运的模块化 AI factory）\n- AlphaSignal / MindStudio 关于 Edge0-35B-A3B 的报道（9/17，24GB Mac mini 上约 20 tokens/s，最低 3GB 内存，MoE 专家权重从 SSD 流
