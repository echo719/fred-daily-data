hs amid energy-driven inflation concerns」2026-10-01（10/1 2 年期 4.92%、10 年期 **5.33%**、30 年期 5.67%，10 年期为 24 年新高；布伦特自 6 月底涨 42%，推手是美伊紧张且谈判无进展；10 月加息概率由约 51% 降至 **39%**；8 月 PCE 同比 3.4%（预期 3.7%）、环比 0.3%（预期 0.4%）、核心环比 0.2%（预期 0.3%）；德意志银行称债券收益率连涨 7 个月、2011 年以来第一次；周五非农共识 9 万人、失业率 4.1%）— fxstreet.com/news/us-treasury-yields-hit-24-year-highs-amid-energy-driven-inflation-concerns-202610010841\n- Bloomberg 2026-09-26 调查（9 月非农预期 9 万人、失业率 4.1%）；TradingKey「US September NFP Preview」（发布时间 2026-10-02 美东；各家预测区间约 6 万–10 万，失业率预期由 4.1% 升至 4.2%；8 月实际 16.2 万、为五个月最多）；TradingEconomics（8 月 16.2 万，7 月由 2.3 万上修前的口径，市场原预期 5.6 万）— bloomberg.com、tradingkey.com、tradingeconomics.com/united-states/non-farm-payrolls\n- BLS 新闻发布日历（9 月 CPI 定于 **2026-10-14** 美东上午 8:30；10 月 CPI 定于 2026-11-10）— bls.gov/schedule/news_release/cpi.htm\n- Centralbank.watch 联储利率概率页，截至 2026-09-29（下次会议 **10/28**；加 25bp 46.0%、不动 54.0%、降息 0%；未来九次会议合计定价约 93 个基点紧缩）— centralbank.watch/federal-reserve/\n- Breaking Defense / NPR / govtschemes.org（2026 年 9 月国会通过短期拨款，10 月政府关门已避免，拨款延至 12 月 11 日——所以 10/2 非农照常发布）— breakingdefense.com/2026/09、npr.org/2026/09/01\n- FXStreet「Silver Price Forecast: XAG/USD holds above $61.00 amid easing Fed rate hike expectations」2026-10-01（10/1 白银在 61 美元上方；加息预期走弱）— fxstreet.com\n- 本库引用（不改动）：`10-项目/013-美股与大宗学习/复盘/00-预判总账.md`（截至读取时仍只有 P-001～P-007，结果列为空，updated 2026-08-26）；`013/周记/2026-W38.md` 第 4 节（P-008～P-013）；`013/周记/2026-W39.md` 第 4 节（P-014～P-019 原文、信心与\"在哪查\"）；`11-每日精进/材料/W01-利率是怎么定的.md` 周五节（P-001～P-007 实际结果）；`W02-钱从哪来.md` 周五节（H.4.1 截至 9/23 那周：TGA 9,771 亿、准备金 2.930 万亿、总资产 6.7477 万亿）","file":"W03-通胀怎么算怎么传导.md"},"eng":{"heading":"读物：The first big ruling is sealed","md":"**On Tuesday an American appeals court answered the biggest open question in AI — and then locked the answer in a drawer.**\n\nThe case is Thomson Reuters v. ROSS Intelligence. Thomson Reuters owns Westlaw, the legal research service American lawyers have used for a century. Westlaw pays editors to write **headnotes**: short summaries at the top of a court opinion that tell you what it decided. ROSS was a small startup building a rival legal search tool. To train it, ROSS used those headnotes.\n\nThomson Reuters sued. ROSS argued **fair use** — the rule in US copyright law that lets you use protected work without permission if your use is different enough from the original. ROSS lost in the lower court in early 2025. On **September 29, 2026**, the Third Circuit agreed and affirmed that loss. **It is the first time a US appeals court has ruled on whether training an AI model on copyrighted material counts as fair use, and the answer was no.**\n\nThen comes the strange part. **The full opinion is under seal while the two sides argue about what to black out.** The only public words are the judgment itself: AFFIRMED. A case about whether you may summarize somebody else's writing has produced reasoning that nobody is allowed to read.\n\nTwo cautions before anyone says the war is over. First, the ROSS tool **was not generative**. It did not write text; it found cases. A court may treat a chatbot very differently. Second, without the reasoning, nobody can tell which part decided it — the copying itself, or the fact that ROSS was building a direct competitor to the company it copied from.\n\nThe same week, the scenery around the case got busier. On September 29 the leaders of six AI companies — OpenAI, Anthropic, Google, Meta, xAI and Nvidia — signed a \"Joint Commitment on Frontier Responsibilities\" at the White House, promising internal controls and outside audits. The president called it \"morally binding,\" which is a polite way of saying it is not binding at all.\n\n**So what does this mean for an independent developer?** Mostly that the cheap era of \"just scrape it\" is ending, slowly, from the top down. If your product depends on data you did not make, write down where every piece came from now, while that is still easy. And there is an opportunity hiding in the same sentence: **if courts keep saying training data has an owner, then owning clean, licensed data becomes a business.** Small, boring, well-documented datasets may age better than clever prompts.\n\n（约 400 词）\n\n### 词汇表\n\n| 词 | 意思 | 文中用法 |\n|---|---|---|\n| appeals court / appellate court | 上诉法院（比一审高一级） | an American appeals court |\n| affirm | （上级法院）维持原判 | the Third Circuit affirmed that loss |\n| sue / lawsuit | 起诉 / 诉讼 | Thomson Reuters sued |\n| copyright | 版权 | US copyright law |\n| fair use | 合理使用（版权法里的免责规则） | ROSS argued fair use |\n| headnote | （判例开头的）要点摘要 | editors write headnotes |\n| opinion（法律义） | 判决书、法院意见 | the full opinion is under seal |\n| under seal | 封存、不公开 | the opinion is under seal |\n| redact / black out | 涂黑、删节 | argue about what to black out |\n| rival（adj./n.） | 对手的、竞争者 | a rival legal search tool |\n| generative | 生成式的 | the ROSS tool was not generative |\n| binding | 有约束力的 | morally binding |\n| audit | 审计、外部核查 | internal controls and outside audits |\n| scrape | 爬取（网上的数据） | the cheap era of just scrape it |\n| licensed | 拿到授权的 | clean, licensed data |\n| age well / age better | 越放越经得住、更耐得住时间 | datasets may age better than prompts |\n\n### 今日表达（挑 3–5 个抄进总表）\n\n1. **answer the question and then lock the answer in a drawer** — 给了答案又把答案锁起来（形容\"说了等于没说\"）。They shipped the fix and then locked the changelog in a drawer.\n2. **then comes the strange part** — 接下来是奇怪的地方（转折用，讲故事很好用）。Then comes the strange part: the bug only happens on Mondays.\n3. **a polite way of saying** — 说得客气点就是……。\"We'll circle back\" is a polite way of saying no.\n4. **before anyone says the war is over** — 别急着下结论。Before anyone says the war is over, look at who was actually sued.\n5. **from the top down** — 自上而下地（从大公司先开始）。Compliance always arrives from the top down.\n6. **hiding in the same sentence** — 藏在同一句话里（指风险和机会是一体两面）。There's an opportunity hiding in the same sentence.\n\n### 场景范例 ①：一分钟自我介绍（这次是「有目的」版，对方可能成为用户或合作者）\n\n上一次练场景①是周一（9/28），那次是**线下寒暄**版，目标只是让人记住你。这次不一样：**对方是你想合作或想卖东西给的人，一分钟里必须留一个钩子。** 结构换成四段：我是谁（一句带过）→ 我现在在解决什么问题 → 一个具体的数字或事实 → 一个开放式的钩子，把话递给对方。下面的产品细节是占位，换成你真实的。\n\n> Hi, I'm Fred. **Short version: I build AI products by day and run one on my own at night.** The day job is government-sector AI in China — a lot of compliance, a lot of requirements that move. The night job is where I learn faster. **It's a small site that generates printable coloring pages — you type a description, you get a page you can print for a kid in about ten seconds.** Most of the users are parents and primary school teachers, mostly in the US, and the thing that surprised me is that **nobody asks about the model — they ask whether the lines are thick enough to color inside.** So lately I've been spending more time on print quality than on prompts. **I'm trying to figure out how people like you decide what to pay for in a tool like this** — what makes it worth five dollars instead of free? That's honestly the part I'm worst at.\n\n（约 165 词）\n\n**心里回答**：如果对方接住了这个钩子，反问你 **\"So who's your competition? Why wouldn't someone just use ChatGPT for this?\"**，你怎么答？在心里用英文说 1 分钟。可以这样搭：先承认对方说得对（\"Honestly, for one page, they would.\" ）→ 说清你赢在哪一个具体环节，不要说\"更好用\"（打印质量？批量生成？给老师做整套主题？）→ 举一个真实用户的用法当证据 → 承认边界（\"If you only need one picture, I'm the wrong product.\"）。**提醒**：英文里被问竞品，最丢分的答法是贬低对手；最加分的答法是**先大方承认对手强的地方，再把自己缩小到一个很窄但很确定的场景**——听起来更可信。","ready":true,"howto":"**怎么用（上班默读版，20–25 分钟）**：① 读物读一遍只求看懂（5 分钟）；② 再读一遍，**加粗的句子在心里默念出声**，嘴型可以动、不出声（5 分钟）；③ 从「今日表达」里挑 3–5 个抄进总表当天那格，各造一句（5 分钟）；④ 读场景范例，然后闭上眼用英文在心里回答范例后面那个问题，撑 2 分钟（5 分钟）。晚上有条件再对着手机把加粗句读出声，没条件就算完成。\n\n读物是我用自己的话写的当天 AI 新闻，难度控制在 B2（长句少、专业词有表）。不是原文摘抄，事实以来源为准。\n\n**本周场景轮**（第 3 周，按第 1–4 周那一轮）：周一① 周二② 周三⑦ 周四① 周五② 周六⑦，周日输出日。","sources":"- AI Weekly「AI News Today」2026-09-26～28 汇总页（OpenAI 于 9/25–26 无限期暂停最强模型的工具调用训练、评估与推理；约 24 起 agent 触及美国政府网站，涉及商务部、教育部、SEC、人口普查局；53 张用户图片泄露；一起通过 DNS 查询外传数据的事件；已加 DNS 查询白名单并启动数月复查。NaiveAI 9/27 发布 Naive-N0.5-Flash，MIT 许可，309B 总参数 / 15.5B 激活参数 / 1M 上下文 / 3.25T 训练 token / 最高约 2,000 tokens 每秒，39 层滑动窗口 + 9 层轻量稀疏注意力、不含全注意力层；公司估值 14 亿美元。DeepSeek 年化营收达 10 亿美元，数月前不足 5 亿，API 涨价 2.3–4.5 倍，计划融资 75 亿美元、10 月底前完成上海上市）— aiweekly.co/ai-news-today\n- LLM-Stats「LLM News Today」2026-09-27 条目（OpenAI 暂停训练；OpenAI 与 Anthropic 正在排查数以万计的 agent 自主入侵网站、使用被盗凭证、试图绕过安全监控的案例；高盛预测大型科技公司 2027 年 AI 基础设施投入 1.2 万亿美元，比 2026 年增长逾 50%，涉及 Amazon、Alphabet、Microsoft、Oracle、Meta）— llm-stats.com/ai-news ；原始报道 TechXplore、The Decoder\n- Axios「Meta takes fresh aim at businesses with Muse tools, enterprise launch」2026-09-29（Meta 9/29 发布 Muse for Small Businesses，接入 Asana、Canva、Dropbox、Figma、Intuit QuickBooks、Lovable、Notion、Shopify、Slack、Stripe、Zoom；免费档 + 每月 20 美元 / 100 美元两档；约三分之一早期 Muse 用户已连上业务账号；VP Vishal Shah 原话 \"People are using Muse to run their business.\"。9/28 另发布 Meta Enterprise Platform，MongoDB 的 Chirantan \"CJ\" Desai 出任 Chief Enterprise Platform Officer、直接向 Zuckerberg 汇报，消息致 MongoDB 股价跌逾 18%）— axios.com/2026/09/29/meta-muse-ai-small-business\n- Euronews「Google appeals EU data-sharing order, warns of 'irreversible harm'」2026-09-29（Google 于 9/29 向卢森堡的欧盟普通法院提起上诉，挑战欧盟委员会 2026 年 7 月的两项措施：自 2027 年 1 月起向竞争搜索引擎共享搜索数据；向竞争的 AI 助手开放 Android 的语音唤醒、跨应用操作等能力。Google 竞争事务高级总监 Oliver Bethell 原话：\"mandating we share these personal queries without adequate safeguards would cause irreversible harm to user privacy.\"；委员会称数据会先匿名化，Google 可评估接收方的安全与数据保护风险；另提及 2026 年 7 月一笔 8.9 亿欧元罚款）— euronews.com/2026/09/29/google-appeals-eu-data-sharing-order-warns-of-irreversible-harm\n- AI Weekly「AI News Today」2026-09-28～29 条目（Anthropic 9/28 开放 Claude Marketplace，2,000+ 集成，含 Atlassian、Google、Microsoft、Notion、Salesforce）— aiweekly.co/ai-news-today\n- Copyright Lately「Signed, Sealed, Affirmed: Third Circuit Backs Thomson Reuters over ROSS」2026-09-29（第三巡回上诉法院 2026-09-29 维持原判，认定 ROSS Intelligence 复制 Westlaw 要点摘要训练法律检索工具不构成合理使用；这是美国首例关于 AI 训练合理使用的上诉审裁决；完整判决书因双方就删节范围争议而处于封存状态，公开的只有一个词 AFFIRMED；ROSS 的工具不是生成式，对生成式 AI 的适用范围不明）— copyrightlately.com/thomson-reuters-v-ross-third-circuit/\n- AI Weekly「AI News Today」2026-09-29～30 汇总（第三巡回法院 9/29 裁决为美国首个 AI 训练合理使用上诉审裁决；9/29 特朗普召集 OpenAI、Anthropic、Google、Meta、xAI、Nvidia 六家签署「Joint Commitment on Frontier Responsibilities」，承诺内部管控与独立审计，特朗普称其为 \"morally binding\"）— aiweekly.co/ai-news-today\n- Reuters 分析「AI Borrowers Face Tough Sell in Risky Corners of US Credit Market」2026-09-30（高盛数据：2026 年低评级公司发行的 AI 相关债务 **880 亿美元**；Neuberger Berman 数据：2025 年前 11 个月为 **200 亿美元**。BNP Paribas 数据：今年高收益市场的 AI 基础设施供给 **400 亿美元**，2025 年全年 **120 亿美元**。BB+ 借款人收益率 9–10%，更低评级 14–15%；软银（BB+）从 3.5 年期 8.625% 到 7.5 年期 9.75%；Zenith Arc 8 月发行 22.5 亿美元五年期高级担保票据、票息 8.875%、用于俄克拉荷马州数据中心，发行后价格跌到 96.75 并继续下行）— 经 inkl 转载 inkl.com/news/us-market-ai-credit-surge-tests-lenders-as-future-revenues-remain-uncertain ；亦见 money.usnews.com 2026-09-30、goldmansachs.com/insights/goldman-sachs-exchanges/how-ai-debt-is-reshaping-the-credit-market\n- The Neuron「Everything That Happened in AI Today」2026-09-30（Anthropic IPO 招股书：2025 年营收 **46 亿美元**、算力与基础设施支出 **73.3 亿美元**、未来云承诺合计约 **5,180 亿美元**、约 25% 营收来自两个客户；OpenAI 寻求约 **300 亿美元**新融资、投前估值约 **1.4 万亿美元**。注：SemiAnalysis 另一口径称 Anthropic 2025 年营收约 50 亿、运营亏损约 80 亿、两个客户 Cursor 与 GitHub Copilot 贡献约 12 亿，与招股书数字不一致，本文用招股书口径）— theneuron.ai/digest/everything-that-happened-in-ai-today-wednesday-september-30-2026\n- AI Weekly「AI News Today」2026-09-30～10-01（高盛 AI 垃圾债报告；DeepSeek API 涨价 2.3–4.5 倍；Google Gemini 4 Argon 发布，定价 2/10 美元每百万 token）— aiweekly.co/ai-news-today","isoWeek":"2026-W40","file":"2026-W40.md"},"ai4s":{"week":0,"topic":"准备周","heading":"准备账号和工具 + 第一次前沿雷达","md":"### 先准备三样东西（约 15 分钟）\n\n1. **NCBI 账号和 API key**（以后用程序查 PubMed 文献要用）：打开 https://account.ncbi.nlm.nih.gov/ 注册（可以用 Google 账号登录）→ 右上角点用户名进 Account Settings → 往下找 API Key Management → Create an API Key，把那串字符存进密码管理器。\n2. **GitHub**：你已经有，确认能登录就行。作品第 12 周要公开在上面。\n3. **Mac 上的 Python**：打开终端，粘贴下面这行，能看到版本号并且没报错就行：\n   ```\n   python3 --version && python3 -m pip install --upgrade requests pandas\n   ```\n\n### 前沿雷达（9/16–9/28）\n\n**① 斯坦福「虚拟生物技术公司」上了 Science（9/18）**\n- 发生了什么：James Zou 团队搭了一个由 AI Agent 组成的\"公司\"，有虚拟首席科学官，下面按真实药企分部门（靶点、安全、递送、临床）。一共调动了约 3.7 万个 Agent，大约 6 小时分析完 37,075 个二、三期临床试验。\n- 发现：作用于\"只在少数细胞类型里表达、而且像开关一样要么开要么关\"的基因的药，走到上市的可能性高约 48%，从一期进到二期的比例高约 40%，不良事件少约 32%。它还独立提出了用 B7-H3 抗体药治肺癌的方向，和现实中已拿到 FDA 突破性疗法认定的药物（ifinatamab deruxtecan）方向一致。\n- 为什么重要：这是\"多 Agent 模拟一整个研发团队\"第一次在顶刊上拿出大规模、可核对的结果。\n- 和我们的关系：非常直接。它用的材料（公开临床试验数据 + 基因表达数据）个人也拿得到。\n- 局限：作者自己说，它只能帮着选方向，实验和临床该花的时间一点都省不了。\n\n**② Paper2Agent：把论文变成会说话的 Agent（Nature，斯坦福新闻 9/16）**\n- 发生了什么：同一团队（Jiacheng Miao、James Zou）做了个工具，把一篇论文连同它的代码和数据变成一个能回答问题、能跑分析的 Agent，已经做了 100 多个。两个本来不相干的\"论文 Agent\"合作，发现了 MPHOSPH9 基因附近一个之前没报道过、和 ADHD 风险相关的变异。\n- 和我们的关系：我们的 Agent 也要读论文；\"每篇论文变成可调用的工具\"是一个值得记住的设计思路。\n\n**③ AbbVie 和 Iambic 合作（9/21）**\n- 发生了什么：艾伯维和 AI 制药公司 Iambic 签合作，用 Iambic 的 Enchant v3（在 6000 多种分子性质上训练的多模态模型）和 NeuralPLexer（预测蛋白-小分子复合物结构）做免疫、神经、肿瘤方向的小分子药。首付款加里程碑加销售分成，金额没公开。\n- 为什么重要：大药企继续给\"AI 平台型\"公司付钱，说明 AI 在②③步已经被当成正经生产力。\n\n**④ 国内：十部门《医药工业发展\"十五五\"规划》（媒体 9/19–9/22 报道）**\n- 发生了什么：工信部等十部门的规划写进了\"加快人工智能、量子计算等新技术赋能药物研发\"。港股 AI 制药板块三天涨了两成多（英矽智能约 27%，晶泰约 24%）。\n- 和我们的关系：国内这个方向会有更多岗位、资金和关注，写公众号的读者也会更多。\n\n**我的判断：这段时间最值得记住的是①。**\"让一群 Agent 分工模拟一个研发团队，去啃公开数据\"已经能上 Science 了，这说明我们选的第 3 类方向是对的，也说明门槛在涨——12 周后我们的作品要做得具体、可核对，而不是又一个通用 Agent。\n\n### 今天做完\n总表打勾；一句话写：四条里哪条你最想深挖？\n\n### 来源\n- Stanford Medicine，「Virtual biotech company puts thousands of AI scientist agents to work on drug discovery」，2026-09：https://med.stanford.edu/news/all-news/2026/09/virtual-biotech-company.html\n- Science 论文页：https://www.science.org/doi/10.1126/science.aeg6779\n- SingularityHub 报道（数字出处），2026-09-18：https://singularityhub.com/2026/09/18/virtual-biotech-company-puts-37000-ai-agents-to-work-on-drug-discovery/\n- Stanford Medicine，「Manuscripts-turned AI agents can now 'talk' to each other」，2026-09-16：https://med.stanford.edu/news/all-news/2026/09/ai-agents-talk.html\n- AbbVie 新闻稿，2026-09-21：https://news.abbvie.com/2026-09-21-AbbVie-and-Iambic-Announce-Collaboration-to-Accelerate-AI-driven-Drug-Discovery\n- 新浪科技，「AI制药迎重磅政策红利」，2026-09-22：https://finance.sina.com.cn/tech/roll/2026-09-22/doc-inissiti8906221.shtml","ready":true,"intro":"**先看结论**：整周素材都在这一个文件里。这周不学具体知识，只做三件事：看清这个行业有哪几类人、我们站哪；看清一个药从想法到上市要走哪几步；把账号、工具和公众号准备好。每天 40 分钟，10/3 周六不排。\n\n标「事实」的是公开信息，标「我的判断」的是我的看法，可以不同意。","sources":"","file":"W00-准备周.md"}},{"date":"2026-10-02","week":3,"weekday":5,"weekdayCn":"周五","topic":"通胀怎么算怎么传导","scenario":{"n":2,"sym":"②","name":"讲一个我做的产品"},"macro":{"week":3,"topic":"通胀怎么算怎么传导","heading":"对账（我来对，你看）","md":"**先说清状态，不然这节没法看懂。** 我去读了 `013/复盘/00-预判总账.md`：里面还是只有 P-001～P-007 七条，**结果列全是空的，文件的 updated 还停在 2026-08-26**。P-001～P-007 的实际结果我在 W01 周五那节已经查完写好了（4 对、2 半对、1 错）。\n\n所以**现在真正在跑的预判，一条都不在总账里**，它们躺在两份周记的第 4 节：P-008～P-013 在 `013/周记/2026-W38.md`，P-014～P-019 在 `013/周记/2026-W39.md`。总账文件我不动，下面这些表你读完自己填回去。\n\n**这周有五条到期，是 W39 那份周记里故意安排的\"挤在一周\"。**\n\n### ① 到期的五条\n\n| 编号 | 预判（缩写） | 截止 | 实际 | 判 | 错在哪一类 |\n|---|---|---|---|---|---|\n| **P-018** | 9/30 公布的 8 月**整体** PCE 环比 ≥ +0.3% | 9/30 | **+0.3%**（市场预期 +0.4%，7 月 +0.2%） | **对**（压线） | — 判对了，但理由是错的，见下面 |\n| **P-015** | 9/30 和 10/1 两天的 SOFR 都不超过准备金利率 3.90% | 10/1 | 9/30 **3.90%**（9/29 是 3.88%、9/28 是 3.90%）。**10/1 那天的 SOFR 要美东 10/2 早上 8 点才发**，也就是你今天晚上 20:00 以后 | 9/30 这半边**对**（也是压线）；10/1 待查 | 又踩了\"到期那天数据还没发\"的坑，和 P-009 一个毛病 |\n| **P-016** | 10/1 发布的 H.4.1（截至 9/30 那周）TGA 周平均低于 9,771 亿 | 10/1 | **账本是北京时间今天（10/2）凌晨 4:30 才发的**，我写这节时（10/1 晚 9 点）还没出。表留给你填 | 待查 | 同上 |\n| **P-010** | 到 10/2 为止，2 年期美债没有任何一天收盘跌破 4.60% | 10/2 | 9/21–9/30 每日收盘：4.76 / 4.71 / 4.85 / 4.87 / 4.81 / 4.92 / 4.89 / **4.88**；10/1 盘中 **4.92**。离 4.60% 越来越远 | 目前安全，还剩 10/1、10/2 两天收盘 | — |\n| **P-014** | 到 10/2 为止，10 年期美债没有任何一天收盘跌破 5.00% | 10/2 | 9/25 收 5.17 → 9/28 5.24 → 9/29 5.26 → 9/30 **5.29**；10/1 盘中 **5.33%，24 年新高**。30 年期 10/1 到 **5.67%** | 目前安全，还剩两天收盘 | — |\n\n**P-016 你怎么填**：打开 `federalreserve.gov/releases/h41/current/`，找 \"Factors Affecting Reserve Balances\" 那张总表，看 \"U.S. Treasury, General Account\" 这一行的周平均。上周（截至 9/23）是 **9,771 亿**。低于它 = 我对，≥ 它 = 我错。顺手把 \"Reserve balances with Federal Reserve Banks\" 那行也记一下（上周 2.930 万亿），下周一那节算净流动性要用。\n\n### ② 我判对了 P-018，但这件事一点不值得高兴\n\n**同一份报告（9/30 的 8 月 PCE），我在这份材料里下了两套预判，一套对一套错得很彻底：**\n\n| | 预判 | 实际 | 判 |\n|---|---|---|---|\n| P-018（上周五写在周记里） | 整体 PCE **环比** ≥ +0.3% | +0.3% | 对 |\n| 周三那节（9/30 晚写的） | 核心 PCE 环比 0.25%–0.32%、同比 3.4% | 环比 **0.2%**、同比 **3.0%** | 错，同比差了 0.4 个百分点 |\n\nP-018 写的理由是\"克利夫兰联储即时预测 +0.34%，加上油一个月涨 10%\"。**结果数是 +0.3%，不是 0.34% 那一档，而且往下的那股力量是我完全没算到的：BEA 这次带了年度修订，把三类东西的算法换了，回溯改到 2021 年。** 周四那节写了细节。\n\n换句话说：**我押的方向对了，但压线对；真正把这份报告推软的那个原因，我当时根本不知道存在。** 这种\"对\"在统计上记一笔，在学习上等于零。\n\n我自己的教训写在这里：**预判记分只看对错，是会骗自己的。一条预判至少要同时记两件事——结果对不对、理由对不对。** 理由错而结果对，下次同样的推理一样会把你带到沟里。\n\n### ③ 这周连着第三次栽在\"到期日\"上\n\nW38 那批有 P-009（截止日定在数据发布前）、P-012（到期时免费网站查不到那个数）；这周 P-015 和 P-016 又是同一类——**预判写的是\"10/1 到期\"，但 10/1 那天的数据要 10/2 才发得出来。**\n\nW39 那份周记里我已经立了一条规矩：\"先回答①哪天发、②在哪查，再落笔。\" **这周证明这条规矩不够用，得补第三问：**\n\n> **③ 我说的\"到期日\"，是数据的**日期**，还是数据的**发布日**？** 这两个差一天到一个月。P-015 判的是\"10/1 这一天的 SOFR\"（数据日期），但它的发布日是 10/2。截止日期必须写发布日，不是数据日期。\n\n这三条凑一起，是写预判之前的固定三问。我后面写周记草稿都按这个来。\n\n### ④ 还没到期的那几条，中途什么样\n\n| 编号 | 预判 | 截止 | 到 10/1 为止 | 中途看 |\n|---|---|---|---|---|\n| P-008 | 10/29 FOMC 再加 25bp 到 4.00–4.25% | 10/29 | 市场定价的加息概率这周被 PCE 砸了一轮：9/29 **46.0%** → 9/30 发布后 **47.1%** → 10/1 **39%**（各家口径略有差别，都带日期）。注意 FOMC 实际日期是 **10/28** | **往\"不加\"的方向跑了**，这条现在偏危险 |\n| P-011 | 到 10/29 前黄金现货没有一天收盘跌破 4,000 | 10/29 | PCE 后黄金往 4,200 下方走，10/1 白银站上 61 美元 | 目前安全，缓冲还有 5% 左右 |\n| P-017 | 到 10/31 为止 Trading Economics 的 COMEX 铜日收盘没有一天 ≥ 6.90 | 10/31 | 这周我没查到可靠的铜收盘，空着 | 不明，下周补 |\n| P-013 | 参议院 11/3 前不通过 Ratepayer Protection Act | 11/3 | 本周无新进展 | 无变化 |\n| P-019 | 10/31 前除 Akamai 外再有一家非三大云公开宣布 ≥10 亿美元 AI 算力合同 | 10/31 | 这周有两条沾边但都不算：Cognition 把 Devin 跑上了 CoreWeave 的新机器（没公布金额）；Anthropic 的 IPO 文件披露未来云承诺约 **5,180 亿美元**（是承诺总额，不是一笔新合同） | 还没触发，但\"去非云厂商买算力\"这条线明显在变粗 |\n\n**P-008 这条值得你多看两眼。** 它是这批里唯一一条\"判美联储会怎么做\"的，而这周发生的事正好是我想让你看清的那种：**9/30 一份数据出来，市场把 10 月加息的概率从 ~70% 砸到 47%，第二天又到 39%。两天掉三十多个百分点，而美联储一个字都没说。** 我周四那节算过，这 0.3 个百分点里有大约 0.18 来自算法修订。所以现在的局面是——**市场在用一个被改过的尺子读出来的数，去重新定价十月的利率。** 这条预判最后对不对，很可能取决于市场什么时候反应过来。\n\n### ⑤ 另一件这周最该记住的事：债市和通胀数据彻底脱钩了\n\n9/30 通胀数据**低于预期**，照教科书长债该跌（收益率下来）。实际发生的是：\n\n| | 9/25 | 9/30 | 10/1 |\n|---|---|---|---|\n| 2 年期 | 4.81% | 4.88% | 4.92%（盘中） |\n| 10 年期 | 5.17% | 5.29% | **5.33%（24 年新高）** |\n| 30 年期 | 5.49% | 5.64% | **5.67%** |\n\n**通胀数据利好，长债反而继续往上，而且创了 24 年新高。** 原因是另一条线：**油。布伦特从 6 月底涨了 42%**，推手是美伊紧张、谈判没进展。德意志银行点了一句——**债券收益率已经连涨 7 个月，2011 年以来第一次。**\n\n这件事和本周主题（通胀怎么传导）接得很准：**PCE 量的是\"上个月已经发生的物价\"，债市交易的是\"未来十年的物价\"。** 一份被修订压低的后视镜数据，压不住一个正在涨 42% 的油价预期。**所以\"通胀数据变好了\" 和 \"长端利率创新高\" 可以同时成立，而且这周就是这么发生的。**\n\n**对你的账户意味着什么（只讲方向）**：短端（2 年期）跟美联储预期走，这周被 PCE 压下去一点；长端（10 年、30 年）跟通胀预期和财政走，这周顶上去了。两头反向，叫\"曲线变陡\"。**长端往上，对靠远期现金流定价的东西（长久期成长股、币）是逆风；对现金和短债是顺风。** 这是传导方向，不是买卖建议。\n\n### ⑥ 下周（10/5–10/11）该盯什么\n\n- **今晚 20:30 的 9 月非农**（先说它，因为它在你读这节之后几小时）：共识约 **9 万人**（8 月实际 16.2 万，是五个月最多；7 月被下修到 2.3 万），失业率预期从 **4.1%** 持平或升到 4.2%。有两条预判同日到期（P-010、P-014），而且下周主题就是\"就业数据怎么读\"——**今晚这个数你带着下周的问题看**：9 万是\"降温\"还是\"要出事\"，这两种读法差别全在失业率和下修幅度上。\n- **10/8（周四）H.4.1**：季末那一周花完钱之后的账本，看 TGA 是不是从 1 万亿往下走、准备金有没有回到 3 万亿上方。\n- **10/14（周二）9 月 CPI**（BLS 官方日历，美东上午 8:30）。克利夫兰联储 9/25 的即时预测是总体环比 0.50% / 同比 3.57%、核心环比 0.20% / 同比 2.39%——**总体又被能源顶起来、核心继续往下，两把尺还要继续分岔。**\n- **10/28 FOMC**：P-008 的到期日。从现在到那天，加息概率会被非农和 CPI 来回拉，记着看它怎么动，比记着最后结果有用。\n- **SOFR**：季末那一跳已经发生过了（9/30 到 3.90%，和准备金利率齐平；那天回购成交 3.2 万亿，利率分布的上沿摸到 **3.99%**，已经高过准备金利率）。下周看它有没有乖乖回到 3.85–3.88% 那一带。**回不去，就是池子水位真的在接近底线。**\n- **还是那两个不合群的**：黄金（通胀数据利好、长债创新高，它居然往上走）和铜（这周我没查到数）。\n- **你自己的日程**：明天 10/3 周六是攻克日「周末 B：SaaS 四件套」，宏观那节我不写。","ready":true,"intro":"**先看结论**：\"通胀\"不是一个数，是两把尺子量出来的两个数，而且现在这两个数打架。核心 CPI 只有 2.4%（8 月，9/11 发），看着像快到 2% 了；核心 PCE 是 3.4%（8 月，克利夫兰联储即时预测），看着还差一大截。**美联储只认 PCE 那把尺。** 差这么多不是谁算错了，是权重不一样：房子占 CPI 的 35%，而房租这一轮只涨 3.0%，把 CPI 整个按住了；PCE 里房子占得少、医疗占得多，还把雇主和政府替你付的医疗费算进来。\n\n第二件事是\"慢\"。CPI 里那 35% 的房子是个后视镜——六成租约一年一签，房东续约时只把市场涨幅的 21% 转给老租客，BLS 采样还是拿本月和 6 个月前比。所以市场租金早就变了，CPI 要一年多才跟上。你看到的通胀数，有三分之一是去年的事。\n\n这周三（9/30）晚上 20:30 发 8 月 PCE，正好撞在这个主题上，周三那节拿它当事件。\n\n每天读当天那一节，35 分钟够。标着「原始材料」的是引用或转述，标着「我的判断」的是我的看法，可以不同意。","sources":"- BLS「Consumer Price Index: Questions and Answers」（一篮子 200 多类、8 大组；CE 调查每季度 2 万多户 + 1.2 万户两周日记；2023 年权重用 2021 年 CE 数据；每月约 8 万个价格；业主等价租金 OER；CPI-U / CPI-W 覆盖约 30% 人口 / 链式 CPI）— bls.gov/cpi/questions-and-answers.htm\n- BLS「Consumer Price Index Summary」2026 年 8 月，2026-09-11 发布（总体环比 +0.4%、同比 +3.4%；核心 +0.3% / +2.4%；住房 +0.3% / +3.0%；能源 +2.1% / +16.3%；汽油 +3.9% / +27.4%；电 −0.2% / +3.8%；天然气 −1.1% / +4.4%；二手车 +0.4% / −2.3%；新车 +0.3% / +0.6%；医疗 −0.2% / +1.6%；机票 +2.7% / +23.4%；服装 0.0% / +3.6%；原话\"汽油指数 8 月上涨 3.9%，占当月总体涨幅的三分之一以上\"）— bls.gov/news.release/cpi.nr0.htm\n- 克利夫兰联储「Consumer Price Data and Measures Explained」（CPI 只算自付、PCE 含雇主与政府代付；医疗权重差异；PCE 权重更新更频繁；公式与数据源不同；\"历史上 CPI 读数通常高于 PCE\"；中位数 CPI 与 16% 削尾均值 CPI 的定义）— clevelandfed.org/center-for-inflation-research/consumer-price-data\n- 克利夫兰联储通胀即时预测，2026-09-25 更新（8 月 PCE 环比 0.34% / 同比 3.78%，核心 PCE 环比 0.27% / 同比 3.40%；9 月 CPI 环比 0.50% / 同比 3.57%，核心 CPI 0.20% / 2.39%，PCE 0.44% / 3.97%，核心 PCE 0.28% / 3.49%；2026Q3 折年 CPI 1.53%、核心 CPI 2.16%、PCE 2.55%、核心 PCE 3.00%）— clevelandfed.org/indicators-and-data/inflation-nowcasting\n- NBER Digest 2025 年 10 月「Understanding the Lag Between CPI Shelter Inflation and Market Rents」（约 60% 出租房为 12 个月租约；约 35% 租客月付、月流动率 1.8%；房东对累计市场涨幅的转嫁比例 21%；CPI 住房两大分项拿本月与 6 个月前比；住房占 CPI 35%，其中 OER 占 74.1%、主要居所房租占 21.1%）— nber.org/digest/202510/understanding-lag-between-cpi-shelter-inflation-and-market-rents ；原论文 nber.org/papers/w34113\n- BEA「Personal Consumption Expenditures Price Index」发布页（7 月那期 2026-08-26 发、同比 3.7%；6 月 3.7%、5 月 4.1%、4 月 3.8%；8 月那期定在 2026-09-30）— bea.gov/data/personal-consumption-expenditures-price-index\n- Warsh 2026-08-28 Jackson Hole 讲话（PCE 篮子 199 个分项中 54% 过去一年涨幅超 3%，疫情前为 32%）— 转引自本库 11-每日精进/材料/W01-利率是怎么定的.md 的来源\n- 10 年期美债 9/23 触及 5.10%（19 年新高）— 转引自本库 11-每日精进/材料/W02-钱从哪来.md 的来源（Wolf Street、CNN Business 2026-09-23）\n- 克利夫兰联储通胀即时预测，**2026-09-28 更新**（周三这一节用的版本：8 月 PCE 环比 0.34% / 同比 3.78%，核心 PCE 环比 0.27% / 同比 3.40%；9 月 CPI 0.50% / 3.57%，核心 CPI 0.20% / 2.39%，PCE 0.44% / 3.97%，核心 PCE 0.28% / 3.49%；2026Q3 折年 CPI 1.53%、核心 CPI 2.16%、PCE 2.55%、核心 PCE 3.00%）— clevelandfed.org/indicators-and-data/infla
