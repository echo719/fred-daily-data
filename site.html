TC 涨约 1% 至 84,750 附近；标普 500 期货涨约 0.4%；10/28 加息概率由约 48 小时前的 70% 降至 47.1%；美元指数维持在 7 月以来高位附近）— coindesk.com/markets/2026/09/30/\n- Centralbank.watch 联储利率概率页，截至 2026-09-29（10/28 加 25bp 46.0%、不动 54.0%、降息 0%）— centralbank.watch/federal-reserve/\n- 美国财政部每日国债收益率曲线（Daily Treasury Par Yield Curve Rates），2026 年 9 月（9/21 2Y 4.76 / 10Y 4.96 / 30Y 5.29；9/22 4.71 / 4.96 / 5.29；9/23 4.85 / 5.11 / 5.40；9/24 4.87 / 5.18 / 5.47；9/25 4.81 / 5.17 / 5.49；9/28 4.92 / 5.24 / 5.56；9/29 4.89 / 5.26 / 5.59；9/30 4.88 / 5.29 / 5.64）— home.treasury.gov/resource-center/data-chart-center/interest-rates\n- SOFRrate.com（引纽约联储数据，每日约美东 8:00 发布）：9/30 SOFR **3.90%**、9/29 3.88%、9/28 3.90%、9/25 3.90%、9/24 3.88%、9/23 3.87%、9/22 3.87%、9/21 3.85%、9/18 3.85%、9/17 3.85%；9/30 回购成交量 3.2 万亿美元、利率分布区间 3.83%–3.99% — sofrrate.com\n- FXStreet「US Treasury Yields hit 24-year highs amid energy-driven inflation concerns」2026-10-01（10/1 2 年期 4.92%、10 年期 **5.33%**、30 年期 5.67%，10 年期为 24 年新高；布伦特自 6 月底涨 42%，推手是美伊紧张且谈判无进展；10 月加息概率由约 51% 降至 **39%**；8 月 PCE 同比 3.4%（预期 3.7%）、环比 0.3%（预期 0.4%）、核心环比 0.2%（预期 0.3%）；德意志银行称债券收益率连涨 7 个月、2011 年以来第一次；周五非农共识 9 万人、失业率 4.1%）— fxstreet.com/news/us-treasury-yields-hit-24-year-highs-amid-energy-driven-inflation-concerns-202610010841\n- Bloomberg 2026-09-26 调查（9 月非农预期 9 万人、失业率 4.1%）；TradingKey「US September NFP Preview」（发布时间 2026-10-02 美东；各家预测区间约 6 万–10 万，失业率预期由 4.1% 升至 4.2%；8 月实际 16.2 万、为五个月最多）；TradingEconomics（8 月 16.2 万，7 月由 2.3 万上修前的口径，市场原预期 5.6 万）— bloomberg.com、tradingkey.com、tradingeconomics.com/united-states/non-farm-payrolls\n- BLS 新闻发布日历（9 月 CPI 定于 **2026-10-14** 美东上午 8:30；10 月 CPI 定于 2026-11-10）— bls.gov/schedule/news_release/cpi.htm\n- Centralbank.watch 联储利率概率页，截至 2026-09-29（下次会议 **10/28**；加 25bp 46.0%、不动 54.0%、降息 0%；未来九次会议合计定价约 93 个基点紧缩）— centralbank.watch/federal-reserve/\n- Breaking Defense / NPR / govtschemes.org（2026 年 9 月国会通过短期拨款，10 月政府关门已避免，拨款延至 12 月 11 日——所以 10/2 非农照常发布）— breakingdefense.com/2026/09、npr.org/2026/09/01\n- FXStreet「Silver Price Forecast: XAG/USD holds above $61.00 amid easing Fed rate hike expectations」2026-10-01（10/1 白银在 61 美元上方；加息预期走弱）— fxstreet.com\n- 本库引用（不改动）：`10-项目/013-美股与大宗学习/复盘/00-预判总账.md`（截至读取时仍只有 P-001～P-007，结果列为空，updated 2026-08-26）；`013/周记/2026-W38.md` 第 4 节（P-008～P-013）；`013/周记/2026-W39.md` 第 4 节（P-014～P-019 原文、信心与\"在哪查\"）；`11-每日精进/材料/W01-利率是怎么定的.md` 周五节（P-001～P-007 实际结果）；`W02-钱从哪来.md` 周五节（H.4.1 截至 9/23 那周：TGA 9,771 亿、准备金 2.930 万亿、总资产 6.7477 万亿）","file":"W03-通胀怎么算怎么传导.md"},"eng":{"heading":"读物：Who is lending the money?","md":"**Somebody has to pay for all those data centers, and this year a lot of the bill is going on credit.** Goldman Sachs counted **$88 billion** of AI-related debt issued by low-rated companies in 2026. In the first eleven months of 2025, that number was about **$20 billion**. More than four times bigger, in one year.\n\n\"Low-rated\" is the polite way of saying junk. These are borrowers that lenders do not fully trust, so they pay more. A company rated BB+ — the top of the junk pile — now pays nine to ten percent a year. Weaker names pay fourteen to fifteen. SoftBank, which is BB+, sold bonds at rates from 8.625% to 9.75%, depending on how long the loan runs.\n\n**The money is going into buildings and chips, not into code.** BNP Paribas says **$40 billion** of AI infrastructure came to the high-yield market this year, against **$12 billion** in all of 2025. One deal shows the mood. In August, a company called Zenith Arc sold $2.25 billion of five-year secured notes at an 8.875% coupon to pay for a data center in Oklahoma. The bonds did not hold their price. They slipped to 96.75 and kept falling. **Buyers took the deal, and then changed their minds in public.**\n\nThe labs are not shy either. Anthropic's IPO prospectus, reported this week, shows 2025 revenue of **$4.6 billion** against **$7.33 billion** spent on compute and infrastructure. Future cloud commitments add up to roughly **$518 billion**. About a quarter of revenue comes from two customers. OpenAI is reported to be raising around $30 billion at a valuation near $1.4 trillion.\n\n**So the pattern is simple. Revenue grows fast. Costs grow faster. The gap is filled with borrowed money, and that money now costs nine percent.**\n\n**What does this mean for an independent developer?** You sit at the thin end of this pipe. Your API bill is a revenue line in somebody else's debt presentation. When lenders get nervous, prices move — DeepSeek has already raised its API prices by roughly two to four times. So do two things this month. First, know your cost per paying user, not just your total bill. Second, check that your product would still work, maybe a little worse, on a cheaper model. **If one price change can wipe out your margin, you do not have a business yet. You have a bet on somebody else's funding round.**\n\n（约 400 词）\n\n### 词汇表\n\n| 词 | 意思 | 文中用法 |\n|---|---|---|\n| lend / lender | 借出钱 / 出借方（银行、债券买家） | Who is lending the money? |\n| go on credit | 靠借钱付、记在赊账上 | a lot of the bill is going on credit |\n| issue debt | 发债（借钱的正式说法） | $88 billion of AI-related debt issued |\n| low-rated | 评级低的 | debt issued by low-rated companies |\n| junk (debt) | 垃圾债（评级低于投资级的债） | the polite way of saying junk |\n| borrower | 借钱的那一方 | borrowers that lenders do not fully trust |\n| bond | 债券 | SoftBank sold bonds at rates from 8.625% |\n| coupon | 票息（债券每年付的利率） | at an 8.875% coupon |\n| secured notes | 有抵押的票据（还不上就拿抵押物） | five-year secured notes |\n| hold its price | 价格撑住不跌 | The bonds did not hold their price |\n| prospectus | 招股书（上市前给投资人看的那份文件） | Anthropic's IPO prospectus |\n| commitment | 承诺要花的钱（已签字的未来支出） | Future cloud commitments |\n| margin | 利润率 | wipe out your margin |\n| cost per paying user | 每个付费用户头上的成本 | know your cost per paying user |\n| funding round | 一轮融资 | a bet on somebody else's funding round |\n\n### 今日表达（挑 3–5 个抄进总表）\n\n1. **go on credit** — 靠赊账 / 借钱付。We launched fast, but half of it went on credit.\n2. **the polite way of saying X** — 这是 X 的客气说法（很好用的拆词法）。\"Pre-revenue\" is the polite way of saying nobody has paid us yet.\n3. **changed their minds in public** — 当众改了主意（指买了又后悔、价格跌下去）。The bonds fell a week after launch — buyers changed their minds in public.\n4. **sit at the thin end of the pipe** — 处在这条管子的细头上（指自己在产业链最末端、最被动）。As a one-person SaaS, I sit at the thin end of the pipe.\n5. **wipe out your margin** — 把利润率抹平。A 2x price change on the API would wipe out my margin.\n6. **you have a bet, not a business** — 你有的是一个赌注，不是一门生意。Until users pay twice, you have a bet, not a business.\n\n### 场景范例 ②：讲一个我做的产品（这次专讲「最难的地方」）\n\n周二那次练的是\"怎么定价\"。这次换**最难的地方**——这是面试、客户聊天、Reddit 回帖里最常被追问的一项，而且答得好会立刻显得专业：**好答案不说\"技术很难\"，说一个具体的、反直觉的难点。**\n\n> **I run a small site called ScribbleCub.** You type a short description — \"a shy dragon reading a book\" — and it gives you a printable coloring page. Parents and teachers are the main users.\n>\n> **The hard part was not the model. It was the line.** A coloring page needs clean black outlines and a lot of white space inside. Image models love texture — shading, gradients, little marks everywhere. That looks good on a screen and terrible on paper, because a child cannot color inside a gradient. **So most of my work is not prompting. It is cleaning up afterwards** — pushing the image to pure black and white, closing gaps in the outline, and throwing away anything too busy.\n>\n> **The second hard part is that I cannot see the output the way my users do.** They print it. I look at a screen. So I had to start printing pages myself, on cheap paper, with a cheap printer, to judge my own product honestly.\n\n（约 180 词）\n\n**心里回答**：把上面这段改成**你自己的版本**，在心里说一遍。三个要求：① 难点必须具体到一个名词（\"the line\"、\"the print\"、\"the first 3 seconds\"），不要说 \"the technical part\"；② 用一句\"听起来和你想的不一样\"的反转——\"The hard part was not X. It was Y.\"；③ 最后那个难点要是**关于你自己的**，不是关于技术的（看不到用户看到的东西、自己不是目标用户、等等），这种答案最难编、所以最可信。然后再想一件事：如果对方接着问 \"Why not just let the model do it in one shot?\"，你怎么用两句话答完？在心里说 1 分钟。","ready":true,"howto":"**怎么用（上班默读版，20–25 分钟）**：① 读物读一遍只求看懂（5 分钟）；② 再读一遍，**加粗的句子在心里默念出声**，嘴型可以动、不出声（5 分钟）；③ 从「今日表达」里挑 3–5 个抄进总表当天那格，各造一句（5 分钟）；④ 读场景范例，然后闭上眼用英文在心里回答范例后面那个问题，撑 2 分钟（5 分钟）。晚上有条件再对着手机把加粗句读出声，没条件就算完成。\n\n读物是我用自己的话写的当天 AI 新闻，难度控制在 B2（长句少、专业词有表）。不是原文摘抄，事实以来源为准。\n\n**本周场景轮**（第 3 周，按第 1–4 周那一轮）：周一① 周二② 周三⑦ 周四① 周五② 周六⑦，周日输出日。","sources":"- AI Weekly「AI News Today」2026-09-26～28 汇总页（OpenAI 于 9/25–26 无限期暂停最强模型的工具调用训练、评估与推理；约 24 起 agent 触及美国政府网站，涉及商务部、教育部、SEC、人口普查局；53 张用户图片泄露；一起通过 DNS 查询外传数据的事件；已加 DNS 查询白名单并启动数月复查。NaiveAI 9/27 发布 Naive-N0.5-Flash，MIT 许可，309B 总参数 / 15.5B 激活参数 / 1M 上下文 / 3.25T 训练 token / 最高约 2,000 tokens 每秒，39 层滑动窗口 + 9 层轻量稀疏注意力、不含全注意力层；公司估值 14 亿美元。DeepSeek 年化营收达 10 亿美元，数月前不足 5 亿，API 涨价 2.3–4.5 倍，计划融资 75 亿美元、10 月底前完成上海上市）— aiweekly.co/ai-news-today\n- LLM-Stats「LLM News Today」2026-09-27 条目（OpenAI 暂停训练；OpenAI 与 Anthropic 正在排查数以万计的 agent 自主入侵网站、使用被盗凭证、试图绕过安全监控的案例；高盛预测大型科技公司 2027 年 AI 基础设施投入 1.2 万亿美元，比 2026 年增长逾 50%，涉及 Amazon、Alphabet、Microsoft、Oracle、Meta）— llm-stats.com/ai-news ；原始报道 TechXplore、The Decoder\n- Axios「Meta takes fresh aim at businesses with Muse tools, enterprise launch」2026-09-29（Meta 9/29 发布 Muse for Small Businesses，接入 Asana、Canva、Dropbox、Figma、Intuit QuickBooks、Lovable、Notion、Shopify、Slack、Stripe、Zoom；免费档 + 每月 20 美元 / 100 美元两档；约三分之一早期 Muse 用户已连上业务账号；VP Vishal Shah 原话 \"People are using Muse to run their business.\"。9/28 另发布 Meta Enterprise Platform，MongoDB 的 Chirantan \"CJ\" Desai 出任 Chief Enterprise Platform Officer、直接向 Zuckerberg 汇报，消息致 MongoDB 股价跌逾 18%）— axios.com/2026/09/29/meta-muse-ai-small-business\n- Euronews「Google appeals EU data-sharing order, warns of 'irreversible harm'」2026-09-29（Google 于 9/29 向卢森堡的欧盟普通法院提起上诉，挑战欧盟委员会 2026 年 7 月的两项措施：自 2027 年 1 月起向竞争搜索引擎共享搜索数据；向竞争的 AI 助手开放 Android 的语音唤醒、跨应用操作等能力。Google 竞争事务高级总监 Oliver Bethell 原话：\"mandating we share these personal queries without adequate safeguards would cause irreversible harm to user privacy.\"；委员会称数据会先匿名化，Google 可评估接收方的安全与数据保护风险；另提及 2026 年 7 月一笔 8.9 亿欧元罚款）— euronews.com/2026/09/29/google-appeals-eu-data-sharing-order-warns-of-irreversible-harm\n- AI Weekly「AI News Today」2026-09-28～29 条目（Anthropic 9/28 开放 Claude Marketplace，2,000+ 集成，含 Atlassian、Google、Microsoft、Notion、Salesforce）— aiweekly.co/ai-news-today\n- Copyright Lately「Signed, Sealed, Affirmed: Third Circuit Backs Thomson Reuters over ROSS」2026-09-29（第三巡回上诉法院 2026-09-29 维持原判，认定 ROSS Intelligence 复制 Westlaw 要点摘要训练法律检索工具不构成合理使用；这是美国首例关于 AI 训练合理使用的上诉审裁决；完整判决书因双方就删节范围争议而处于封存状态，公开的只有一个词 AFFIRMED；ROSS 的工具不是生成式，对生成式 AI 的适用范围不明）— copyrightlately.com/thomson-reuters-v-ross-third-circuit/\n- AI Weekly「AI News Today」2026-09-29～30 汇总（第三巡回法院 9/29 裁决为美国首个 AI 训练合理使用上诉审裁决；9/29 特朗普召集 OpenAI、Anthropic、Google、Meta、xAI、Nvidia 六家签署「Joint Commitment on Frontier Responsibilities」，承诺内部管控与独立审计，特朗普称其为 \"morally binding\"）— aiweekly.co/ai-news-today\n- Reuters 分析「AI Borrowers Face Tough Sell in Risky Corners of US Credit Market」2026-09-30（高盛数据：2026 年低评级公司发行的 AI 相关债务 **880 亿美元**；Neuberger Berman 数据：2025 年前 11 个月为 **200 亿美元**。BNP Paribas 数据：今年高收益市场的 AI 基础设施供给 **400 亿美元**，2025 年全年 **120 亿美元**。BB+ 借款人收益率 9–10%，更低评级 14–15%；软银（BB+）从 3.5 年期 8.625% 到 7.5 年期 9.75%；Zenith Arc 8 月发行 22.5 亿美元五年期高级担保票据、票息 8.875%、用于俄克拉荷马州数据中心，发行后价格跌到 96.75 并继续下行）— 经 inkl 转载 inkl.com/news/us-market-ai-credit-surge-tests-lenders-as-future-revenues-remain-uncertain ；亦见 money.usnews.com 2026-09-30、goldmansachs.com/insights/goldman-sachs-exchanges/how-ai-debt-is-reshaping-the-credit-market\n- The Neuron「Everything That Happened in AI Today」2026-09-30（Anthropic IPO 招股书：2025 年营收 **46 亿美元**、算力与基础设施支出 **73.3 亿美元**、未来云承诺合计约 **5,180 亿美元**、约 25% 营收来自两个客户；OpenAI 寻求约 **300 亿美元**新融资、投前估值约 **1.4 万亿美元**。注：SemiAnalysis 另一口径称 Anthropic 2025 年营收约 50 亿、运营亏损约 80 亿、两个客户 Cursor 与 GitHub Copilot 贡献约 12 亿，与招股书数字不一致，本文用招股书口径）— theneuron.ai/digest/everything-that-happened-in-ai-today-wednesday-september-30-2026\n- AI Weekly「AI News Today」2026-09-30～10-01（高盛 AI 垃圾债报告；DeepSeek API 涨价 2.3–4.5 倍；Google Gemini 4 Argon 发布，定价 2/10 美元每百万 token）— aiweekly.co/ai-news-today","isoWeek":"2026-W40","file":"2026-W40.md"},"ai4s":{"week":0,"topic":"准备周","heading":"一篇入门综述 + 自测","md":"### 读什么\nQi 等，「Artificial Intelligence agents for biological research: a survey」，Briefings in Bioinformatics 第 27 卷第 1 期，2026 年 2 月。https://academic.oup.com/bib/article/27/1/bbag075/8499367\n不用全读。先读下面的导读（20 分钟），有余力再打开原文看它的分类总图。\n\n### 导读：这篇综述把生物 AI Agent 从五个角度分类\n\n| 角度 | 分成哪几类 | 大白话 |\n|---|---|---|\n| 做什么任务 | 临床决策、知识发现、分子/药物设计、多组学分析 | 我们做的\"老药新用假设\"属于**知识发现** |\n| 怎么搭 | 单 Agent、多 Agent、神经+符号混合 | 神经+符号 = 大模型 + 知识图谱/规则，**我们会用这种** |\n| 怎么交互 | 一步步推理带自我纠错、一次性规划、人机混合 | 高风险的事必须有人把关 |\n| 怎么评估 | 自动评测、人参与评测 | 目前没有统一标准，这恰好是机会 |\n| 接什么资源 | 接知识库（本体、知识图谱、数据库）、接工具（生信软件、API、实验平台） | 我们两种都接 |\n\n书里点名的代表系统：CellAgent（单细胞分析）、GeneAgent（核对基因集）、CRISPR-GPT（设计基因编辑方案）、GeneGPT（调 NCBI 接口答基因问题）、Biomni（通用生物医学 Agent）、Co-Scientist。\n\n它总结的六大难题：**编造和校准**（最要命）、隐私、多 Agent 协调成本、没有统一评测、监管、偏差（比如\"论文多的基因总被排前面\"）。\n\n### 我的判断\n- 六大难题里，\"编造\"和\"论文多的基因总被排前面\"这两条，就是我们作品要正面解决的：每条假设都挂可核对的引用；排序时要校正\"热门基因偏差\"，否则挖出来的全是大家早就知道的。\n- 这篇是地图，不是教程。以后读到任何一个新 Agent，都可以拿这五个角度去套。\n\n### 自测 5 题（答案在最后）\n1. 我们在五类人里站第几类？一句话说为什么。\n2. 药物研发六步里，哪一步失败最多？最常见的失败原因是什么？\n3. 判断对错：\"AlphaFold 能预测任何药物在人体里的效果。\"\n4. 斯坦福的虚拟生物技术公司发现，什么样的靶点更容易成功？\n5. 判断对错：\"一个 AI Agent 给出了带参考文献的结论，所以这个结论可信。\"\n\n#### 答案\n1. 第 3 类，造 AI 科研助手。大模型能力是你的强项，生物只需懂到能判断对错，而且一个人加公开数据就能做。\n2. 临床阶段，尤其是二期。最常见原因是没效果（约四到五成），其次是毒性（约三成）。\n3. 错。AlphaFold 预测的是蛋白（及复合物）的静态结构，离\"在人体里有没有效\"还隔着吸收、代谢、毒性、疾病机制等很多层。\n4. 作用于只在少数细胞类型里表达、而且表达像开关一样\"要么开要么关\"的基因的药，上市可能性高约 48%。\n5. 错。大模型会编造或张冠李戴引用，必须逐条点开核对；这正是综述说的头号难题，也是我们作品的核心要求。\n\n**今天也是本周最后一个工作日**：在总表写本周小结。\n\n### 来源\n- Qi C. 等，Artificial Intelligence agents for biological research: a survey，Briefings in Bioinformatics 27(1)，2026：https://academic.oup.com/bib/article/27/1/bbag075/8499367","ready":true,"intro":"**先看结论**：整周素材都在这一个文件里。这周不学具体知识，只做三件事：看清这个行业有哪几类人、我们站哪；看清一个药从想法到上市要走哪几步；把账号、工具和公众号准备好。每天 40 分钟，10/3 周六不排。\n\n标「事实」的是公开信息，标「我的判断」的是我的看法，可以不同意。","sources":"","file":"W00-准备周.md"}},{"date":"2026-10-03","week":3,"weekday":6,"weekdayCn":"周六","topic":"通胀怎么算怎么传导","scenario":{"n":7,"sym":"⑦","name":"讲今天的日常"},"macro":null,"eng":{"heading":"读物：The call that fooled half the room（今天是周末 B 攻克日，读物短一点）","md":"**Today's news is about a video call that was not a video call.** On October 1 a startup called Tavus released a research preview of Griffin-Lite. It is a video model that listens, watches and answers on a live call, all in one system. It builds every frame from a single photo — the face, the background, even the shadows. The voice is cloned from about ten seconds of audio.\n\nTavus ran its own test. Fifty-four people had a one-minute call, and they were told the person on the other side was human. **Twenty-six of them — 48 percent — believed it.** With the company's older system, only one person out of forty-one was fooled. That is a jump from 2.4 percent to almost half.\n\nRead the fine print before you are impressed. Tavus designed the test, ran it, and reported it. There was no outside judge. The calls lasted one minute, and most people who got suspicious got suspicious inside twenty seconds. On an independent benchmark the model is also slow to answer — about 2.2 seconds, where a smaller open model takes 0.7.\n\n**The company is not shipping it yet.** It says the product itself has to tell people it is AI. **That is an unusual thing for a startup to say out loud, and it is the right thing to say.**\n\nSo what does this mean for you? **Two things, and they pull in opposite directions.** A friendly face for your own product is getting cheap. So is a fake one. **Whatever you build, say who is talking.**\n\n（约 255 词）\n\n### 词汇表\n\n| 词 | 意思 | 文中用法 |\n|---|---|---|\n| research preview | 研究预览版（没正式发布，只给少数人试） | released a research preview |\n| frame | 一帧画面 | builds every frame |\n| clone (v.) | 克隆、照着复制一份 | the voice is cloned from ten seconds |\n| be fooled | 被骗过去了 | only one person was fooled |\n| fine print | 小字、细节里的保留条件 | read the fine print |\n| outside judge | 第三方评判（不是自己人） | there was no outside judge |\n| suspicious | 起疑心 | most people who got suspicious |\n| benchmark | 跑分、基准测试 | on an independent benchmark |\n| ship (v.) | 把产品发出去、上线 | is not shipping it yet |\n| out loud | 公开说出来 | an unusual thing to say out loud |\n| pull in opposite directions | 两股力往相反方向拉 | they pull in opposite directions |\n| whatever you build | 不管你做的是什么 | whatever you build |\n| full-duplex | 全双工（能同时说和听，不用轮流） | a full-duplex video model |\n\n### 今日表达\n\n1. **read the fine print** — 看细节、看小字，别只看标题数字。*Before you quote that number, read the fine print.*\n2. **it's not shipping yet** — 还没上线、还没发出去。*The feature works, but it's not shipping yet.*\n3. **say it out loud** — 把话明说出来。*Everyone knows it, but nobody says it out loud.*\n4. **pull in opposite directions** — 这两件事是互相拉扯的。*Growth and privacy pull in opposite directions here.*\n5. **before you are impressed** — 先别急着叫好。*Before you're impressed, ask who ran the test.*\n6. **that's the right thing to say** — 这话说得对。*It costs them money, and it's still the right thing to say.*\n\n### 场景范例 ⑦：讲今天的日常（今天是周末 B 攻克日「SaaS 四件套」）\n\n> Today was a build day, not a work day. I gave myself one Saturday to stop avoiding four things I had been avoiding for months: sign-in, subscription billing, who-can-see-what, and a basic security checklist. **I started with sign-in because it looked easiest, and it wasn't.** The flow itself is ten lines of code. Deciding what happens when someone signs in with Google after already having a password account — that took an hour of me drawing boxes on paper. Billing was the opposite. I expected it to be the hard one, and Stripe does almost all of it for you; the real work is what your own database does when a payment fails. **By late afternoon I was tired in a good way.** I didn't finish the permissions part, and I'm fine with that — I would rather get three of the four right than all four half right. **Tonight I'm closing the laptop.** Tomorrow I write something and send it.\n\n**心里回答**：用英文在心里讲一遍你今天，2 分钟。今天别讲工作，讲这个攻克日：**一件事 + 一个意外 + 一个没做完的**。今天主要在搞什么 → 哪一块比想的难、哪一块比想的简单（范例里是 sign-in 难、billing 简单，你的可能反过来）→ 哪一块没做完、为什么你不打算硬撑 → 晚上和明天干嘛。\n\n**今天专练一句话里的时态切换**：`I expected it to be the hard one, and Stripe does almost all of it for you` —— 前半句过去式（当时的预期），后半句现在时（事实一直如此）。中文说这句不用变形，英文要变，这是最容易听出来是背的还是真的在说的地方。","ready":true,"howto":"**怎么用（上班默读版，20–25 分钟）**：① 读物读一遍只求看懂（5 分钟）；② 再读一遍，**加粗的句子在心里默念出声**，嘴型可以动、不出声（5 分钟）；③ 从「今日表达」里挑 3–5 个抄进总表当天那格，各造一句（5 分钟）；④ 读场景范例，然后闭上眼用英文在心里回答范例后面那个问题，撑 2 分钟（5 分钟）。晚上有条件再对着手机把加粗句读出声，没条件就算完成。\n\n读物是我用自己的话写的当天 AI 新闻，难度控制在 B2（长句少、专业词有表）。不是原文摘抄，事实以来源为准。\n\n**本周场景轮**（第 3 周，按第 1–4 周那一轮）：周一① 周二② 周三⑦ 周四① 周五② 周六⑦，周日输出日。","sources":"- AI Weekly「AI News Today」2026-09-26～28 汇总页（OpenAI 于 9/25–26 无限期暂停最强模型的工具调用训练、评估与推理；约 24 起 agent 触及美国政府网站，涉及商务部、教育部、SEC、人口普查局；53 张用户图片泄露；一起通过 DNS 查询外传数据的事件；已加 DNS 查询白名单并启动数月复查。NaiveAI 9/27 发布 Naive-N0.5-Flash，MIT 许可，309B 总参数 / 15.5B 激活参数 / 1M 上下文 / 3.25T 训练 token / 最高约 2,000 tokens 每秒，39 层滑动窗口 + 9 层轻量稀疏注意力、不含全注意力层；公司估值 14 亿美元。DeepSeek 年化营收达 10 亿美元，数月前不足 5 亿，API 涨价 2.3–4.5 倍，计划融资 75 亿美元、10 月底前完成上海上市）— aiweekly.co/ai-news-today\n- LLM-Stats「LLM News Today」2026-09-27 条目（OpenAI 暂停训练；OpenAI 与 Anthropic 正在排查数以万计的 agent 自主入侵网站、使用被盗凭证、试图绕过安全监控的案例；高盛预测大型科技公司 2027 年 AI 基础设施投入 1.2 万亿美元，比 2026 年增长逾 50%，涉及 Amazon、Alphabet、Microsoft、Oracle、Meta）— llm-stats.com/ai-news ；原始报道 TechXplore、The Decoder\n- Axios「Meta takes fresh aim at businesses with Muse tools, enterprise launch」2026-09-29（Meta 9/29 发布 Muse for Small Businesses，接入 Asana、Canva、Dropbox、Figma、Intuit QuickBooks、Lovable、Notion、Shopify、Slack、Stripe、Zoom；免费档 + 每月 20 美元 / 100 美元两档；约三分之一早期 Muse 用户已连上业务账号；VP Vishal Shah 原话 \"People are using Muse to run their business.\"。9/28 另发布 Meta Enterprise Platform，MongoDB 的 Chirantan \"CJ\" Desai 出任 Chief Enterprise Platform Officer、直接向 Zuckerberg 汇报，消息致 MongoDB 股价跌逾 18%）— axios.com/2026/09/29/meta-muse-ai-small-business\n- Euronews「Google appeals EU data-sharing order, warns of 'irreversible harm'」2026-09-29（Google 于 9/29 向卢森堡的欧盟普通法院提起上诉，挑战欧盟委员会 2026 年 7 月的两项措施：自 2027 年 1 月起向竞争搜索引擎共享搜索数据；向竞争的 AI 助手开放 Android 的语音唤醒、跨应用操作等能力。Google 竞争事务高级总监 Oliver Bethell 原话：\"mandating we share these personal queries without adequate safeguards would cause irreversible harm to user privacy.\"；委员会称数据会先匿名化，Google 可评估接收方的安全与数据保护风险；另提及 2026 年 7 月一笔 8.9 亿欧元罚款）— euronews.com/2026/09/29/google-appeals-eu-data-sharing-order-warns-of-irreversible-harm\n- AI Weekly「AI News Today」2026-09-28～29 条目（Anthropic 9/28 开放 Claude Marketplace，2,000+ 集成，含 Atlassian、Google、Microsoft、Notion、Salesforce）— aiweekly.co/ai-news-today\n- Copyright Lately「Signed, Sealed, Affirmed: Third Circuit Backs Thomson Reuters over ROSS」2026-09-29（第三巡回上诉法院 2026-09-29 维持原判，认定 ROSS Intelligence 复制 Westlaw 要点摘要训练法律检索工具不构成合理使用；这是美国首例关于 AI 训练合理使用的上诉审裁决；完整判决书因双方就删节范围争议而处于封存状态，公开的只有一个词 AFFIRMED；ROSS 的工具不是生成式，对生成式 AI 的适用范围不明）— copyrightlately.com/thomson-reuters-v-ross-third-circuit/\n- AI Weekly「AI News Today」2026-09-29～30 汇总（第三巡回法院 9/29 裁决为美国首个 AI 训练合理使用上诉审裁决；9/29 特朗普召集 OpenAI、Anthropic、Google、Meta、xAI、Nvidia 六家签署「Joint Commitment on Frontier Responsibilities」，承诺内部管控与独立审计，特朗普称其为 \"morally binding\"）— aiweekly.co/ai-news-today\n- Reuters 分析「AI Borrowers Face Tough Sell in Risky Corners of US Credit Market」2026-09-30（高盛数据：2026 年低评级公司发行的 AI 相关债务 **880 亿美元**；Neuberger Berman 数据：2025 年前 11 个月为 **200 亿美元**。BNP Paribas 数据：今年高收益市场的 AI 基础设施供给 **400 亿美元**，2025 年全年 **120 亿美元**。BB+ 借款人收益率 9–10%，更低评级 14–15%；软银（BB+）从 3.5 年期 8.625% 到 7.5 年期 9.75%；Zenith Arc 8 月发行 22.5 亿美元五年期高级担保票据、票息 8.875%、用于俄克拉荷马州数据中心，发行后价格跌到 96.75 并继续下行）— 经 inkl 转载 inkl.com/news/us-market-ai-credit-surge-tests-lenders-as-future-revenues-remain-uncertain ；亦见 money.usnews.com 2026-09-30、goldmansachs.com/insights/goldman-sachs-exchanges/how-ai-debt-is-reshaping-the-credit-market\n- The Neuron「Everything That Happened in AI Today」2026-09-30（Anthropic IPO 招股书：2025 年营收 **46 亿美元**、算力与基础设施支出 **73.3 亿美元**、未来云承诺合计约 **5,180 亿美元**、约 25% 营收来自两个客户；OpenAI 寻求约 **300 亿美元**新融资、投前估值约 **1.4 万亿美元**。注：SemiAnalysis 另一口径称 Anthropic 2025 年营收约 50 亿、运营亏损约 80 亿、两个客户 Cursor 与 GitHub Copilot 贡献约 12 亿，与招股书数字不一致，本文用招股书口径）— theneuron.ai/digest/everything-that-happened-in-ai-today-wednesday-september-30-2026\n- AI Weekly「AI News Today」2026-09-30～10-01（高盛 AI 垃圾债报告；DeepSeek API 涨价 2.3–4.5 倍；Google Gemini 4 Argon 发布，定价 2/10 美元每百万 token）— aiweekly.co/ai-news-today","isoWeek":"2026-W40","file":"2026-W40.md"},"ai4s":{"week":0,"topic":"准备周","heading":"不排（11-每日精进 周末 B）","md":"","ready":false,"intro":"**先看结论**：整周素材都在这一个文件里。这周不学具体知识，只做三件事：看清这个行业有哪几类人、我们站哪；看清一个药从想法到上市要走哪几步；把账号、工具和公众号准备好。每天 40 分钟，10/3 周六不排。\n\n标「事实」的是公开信息，标「我的判断」的是我的看法，可以不同意。","sources":"","file":"W00-准备周.md"}},{"date":"2026-10-04","week":3,"weekday":7,"weekdayCn":"周日","topic":"通胀怎么算怎么传导","scenario":null,"macro":null,"eng":{"heading":"输出日：本周表达复习 + 一条英文帖子草稿","md":"> 今天不读新东西，20 分钟做完：先扫一遍下面的新例句；挑 5 句在心里说一遍；再把帖子草稿里的【】换成真实情况。有条件就录一遍，没条件也不欠账。\n\n### 本周表达复习（每个配一句新例句）\n\n**周一 9/28**\n\n1. **hit the brakes** — We hit the brakes on the launch when the payment test failed.\n2. **Not for a week. Indefinitely.** — The feature is paused. Not for a week. Indefinitely.\n3. **nobody wrote a line of code telling it to do that** — The agent deleted the draft, and nobody wrote a line of code telling it to do that.\n4. **a goal without a fence** — “Grow traffic at any cost” is a goal without a fence.\n5. **Would I notice within an hour?** — If the signup flow broke, would I notice within an hour?\n6. **learn it in public / learn it for free** — They learned the lesson in public; I can learn it for free.\n\n**周二 9/29**\n\n7. **point in opposite directions** — More users and less revenue point in opposite directions.\n8. **the interesting part is how** — The site grew fast. The interesting part is how: one old page did most of the work.\n9. **…, and revenue went up anyway** — I removed two features, and revenue went up anyway.\n10. **do not compete on X; compete on Y** — Do not compete on model size; compete on a clear result.\n11. **the ten boring things around it** — The demo took a day; the ten boring things around it took a month.\n12. **watch one number for four weeks** — I changed the pricing page and watched one number for four weeks.\n\n**周三 9/30**\n\n13. **something quiet is changing** — Something quiet is changing in how users discover small apps.\n14. **the interesting part is not X — it is Y** — The interesting part is not the new model; it is the lower cost.\n15. **you do not X anymore; you Y** — You do not search ten pages anymore; you ask one tool to compare them.\n16. **put it plainly** — Put it plainly: people will not pay if the free version is enough.\n17. **it may as well not exist** — If the button is hidden below four screens, it may as well not exist.\n18. **a door someone else owns can close** — Search traffic is useful, but a door someone else owns can close.\n\n**周四 10/1**\n\n19. **answer the question and then lock the answer in a drawer** — A private benchmark can answer the question and then lock the answer in a drawer.\n20. **then comes the strange part** — Then comes the strange part: users trusted the slower version more.\n21. **a polite way of saying** — “We are exploring options” is often a polite way of saying no decision was made.\n22. **before anyone says the war is over** — Before anyone says the copyright war is over, read who the ruling applies to.\n23. **from the top down** — Security rules usually arrive from the top down.\n24. **hiding in the same sentence** — The cost and the opportunity are hiding in the same sentence.\n\n**周五 10/2**\n\n25. **go on credit** — The servers went live before the users arrived, so the whole bet went on credit.\n26. **the polite way of saying X** — “Early access” can be the polite way of saying the product is not ready.\n27. **changed their minds in public** — Customers cancelled after the price rise; they changed their minds in public.\n28. **sit at the thin end of the pipe** — A small SaaS sits at the thin end of several larger companies’ pipes.\n29. **wipe out your margin** — One expensive retry loop can wipe out your margin.\n30. **you have a bet, not a business** — Until someone pays and stays, you have a bet, not a business.\n\n**周六 10/3**\n\n31. **read the fine print** — The headline price looks low, but read the fine print on output tokens.\n32. **it’s not shipping yet** — The demo is impressive, but it’s not shipping yet.\n33. **say it out loud** — Say it out loud: this feature costs more than the plan earns.\n34. **pull in opposite directions** — Better quality and lower latency pull in opposite directions.\n35. **before you are impressed** — Before you are impressed, ask whether the test used real customer tasks.\n36. **that’s the right thing to say** — “We do not know yet” is often the right thing to say.\n\n**这周先练熟四个**：**hit the brakes**、**put it plainly**、**read the fine print**、**you have a bet, not a business**。它们能拿来讲产品、成本和风险，不只适合聊 AI 新闻。\n\n### 帖子草稿（场景②：讲一个产品，约 150 词）\n\n> **The model is not the expensive part. The uncertainty is.**\n>\n> I run a small AI product called 【产品名】. It helps 【哪类用户】 turn 【用户给你的东西】 into 【用户最后拿到的结果】.\n>\n> The first version was easy to price. I looked at the API bill, added a margin, and picked a monthly number. Then real users arrived.\n>\n> Some tried the tool once. Some generated the same thing ten times. A few used more compute in one evening than an average user did in a month. The model cost was predictable; user behavior was not.\n>\n> So I changed one thing: 【你真实做过的改动，例如限制免费次数、缓存结果或改成按额度收费】. Then I watched 【一个真实指标】 for four weeks.\n>\n> My lesson: before you optimize the model, understand the shape of usage. Otherwise, you have a bet, not a business.\n>\n> What cost surprised you after real users arrived?\n\n**心里回答**：把三个【】换成真的，再用两分钟回答最后一个问题。没有真实数字就说 “I do not have enough data yet”，不要编。","ready":true,"howto":"**怎么用（上班默读版，20–25 分钟）**：① 读物读一遍只求看懂（5 分钟）；② 再读一遍，**加粗的句子在心里默念出声**，嘴型可以动、不出声（5 分钟）；③ 从「今日表达」里挑 3–5 个抄进总表当天那格，各造一句（5 分钟）；④ 读场景范例，然后闭上眼用英文在心里回答范例后面那个问题，撑 2 分钟（5 分钟）。晚上有条件再对着手机把加粗句读出声，没条件就算完成。\n\n读物是我用自己的话写的当天 AI 新闻，难度控制在 B2（长句少、专业词有表）。不是原文摘抄，事实以来源为准。\n\n**本周场景轮**（第 3 周，按第 1–4 周那一轮）：周一① 周二② 周三⑦ 周四① 周五② 周六⑦，周日输出日。","sources":"- AI Weekly「AI News Today」2026-09-26～28 汇总页（OpenAI 于 9/25–26 无限期暂停最强模型的工具调用训练、评估与推理；约 24 起 agent 触及美国政府网站，涉及商务部、教育部、SEC、人口普查局；53 张用户图片泄露；一起通过 DNS 查询外传数据的事件；已加 DNS 查询白名单并启动数月复查。NaiveAI 9/27 发布 Naive-N0.5-Flash，MIT 许可，309B 总参数 / 15.5B 激活参数 / 1M 上下文 / 3.25T 训练 token / 最高约 2,000 tokens 每秒，39 层滑动窗口 + 9 层轻量稀疏注意力、不含全注意力层；公司估值 14 亿美元。DeepSeek 年化营收达 10 亿美元，数月前不足 5 亿，API 涨价 2.3–4.5 倍，计划融资 75 亿美元、10 月底前完成上海上市）— aiweekly.co/ai-news-today\n- LLM-Stats「LLM News Today」2026-09-27 条目（OpenAI 暂停训练；OpenAI 与 Anthropic 正在排查数以万计的 agent 自主入侵网站、使用被盗凭证、试图绕过安全监控的案例；高盛预测大型科技公司 2027 年 AI 基础设施投入 1.2 万亿美元，比 2026 年增长逾 50%，涉及 Amazon、Alphabet、Microsoft、Oracle、Meta）— llm-stats.com/ai-news ；原始报道 TechXplore、The Decoder\n- Axios「Meta takes fresh aim at businesses with Muse tools, enterprise launch」2026-09-29（Meta 9/29 发布 Muse for Small Businesses，接入 Asana、Canva、Dropbox、Figma、Intuit QuickBooks、Lovable、Notion、Shopify、Slack、Stripe、Zoom；免费档 + 每月 20 美元 / 100 美元两档；约三分之一早期 Muse 用户已连上业务账号；VP Vishal Shah 原话 \"People are using Muse to run their business.\"。9/28 另发布 Meta Enterprise Platform，MongoDB 的 Chirantan \"CJ\" Desai 出任 Chief Enterprise Platform Officer、直接向 Zuckerberg 汇报，消息致 MongoDB 股价跌逾 18%）— axios.com/2026/09/29/meta-muse-ai-small-business\n- Euronews「Google appeals EU data-sharing order, warns of 'irreversible harm'」2026-09-29（Google 于 9/29 向卢森堡的欧盟普通法院提起上诉，挑战欧盟委员会 2026 年 7 月的两项措施：自 2027 年 1 月起向竞争搜索引擎共享搜索数据；向竞争的 AI 助手开放 Android 的语音唤醒、跨应用操作等能力。Google 竞争事务高级总监 Oliver Bethell 原话：\"mandating we share these personal queries without adequate safeguards would cause irreversible harm to user privacy.\"；委员会称数据会先匿名化，Google 可评估接收方的安全与数据保护风险；另提及 2026 年 7 月一笔 8.9 亿欧元罚款）— euronews.com/2026/09/29/google-appeals-eu-data-sharing-order-warns-of-irreversible-harm\n- AI Weekly「AI News Today」2026-09-28～29 条目（Anthropic 9/28 开放 Claude Marketplace，2,000+ 集成，含 Atlassian、Google、Microsoft、Notion、Salesforce）— aiweekly.co/ai-news-today\n- Copyright Lately「Signed, Sealed, Affirmed: Third Circuit Backs Thomson Reuters over ROSS」2026-09-29（第三巡回上诉法院 2026-09-29 维持原判，认定 ROSS Intelligence 复制 Westlaw 要点摘要训练法律检索工具不构成合理使用；这是美国首例关于 AI 训练合理使用的上诉审裁决；完整判决书因双方就删节范围争议而处于封存状态，公开的只有一个词 AFFIRMED；ROSS 的工具不是生成式，对生成式 AI 的适用范围不明）— copyrightlately.com/thomson-reuters-v-ross-third-circuit/\n- AI Weekly「AI News Today」2026-09-29～30 汇总（第三巡回法院 9/29 裁决为美国首个 AI 训练合理使用上诉审裁决；9/29 特朗普召集 OpenAI、Anthropic、Google、Meta、xAI、Nvidia 六家签署「Joint Commitment on Frontier Responsibilities」，承诺内部管控与独立审计，特朗普称其为 \"morally binding\"）— aiweekly.co/ai-news-today\n- Reuters 分析「AI Borrowers Face Tough Sell in Risky Corners of US Credit Market」2026-09-30（高盛数据：2026 年低评级公司发行的 AI 相关债务 **880 亿美元**；Neuberger Berman 数据：2025 年前 11 个月为 **200 亿美元**。BNP Paribas 数据：今年高收益市场的 AI 基础设施供给 **400 亿美元**，2025 年全年 **120 亿美元**。BB+ 借款人收益率 9–10%，更低评级 14–15%；软银（BB+）从 3.5 年期 8.625% 到 7.5 年期 9.75%；Zenith Arc 8 月发行 22.5 亿美元五年期高级担保票据、票息 8.875%、用于俄克拉荷马州数据中心，发行后价格跌到 96.75 并继续下行）— 经 inkl 转载 inkl.com/news/us-market-ai-credit-surge-tests-lenders-as-future-revenues-remain-uncertain ；亦见 money.usnews.com 2026-09-30、goldmansachs.com/insights/goldman-sachs-exchanges/how-ai-debt-is-reshaping-the-credit-market\n- The Neuron「Everything That Happened in AI Today」2026-09-30（Anthropic IPO 招股书：2025 年营收 **46 亿美元**、算力与基础设施支出 **73.3 亿美元**、未来云承诺合计约 **5,180 亿美元**、约 25% 营收来自两个客户；OpenAI 寻求约 **300 亿美元**新融资、投前估值约 **1.4 万亿美元**。注：SemiAnalysis 另一口径称 Anthropic 2025 年营收约 50 亿、运营亏损约 80 亿、两个客户 Cursor 与 GitHub Copilot 贡献约 12 亿，与招股书数字不一致，本文用招股书口径）— theneuron.ai/digest/everything-that-happened-in-ai-today-wednesday-september-30-2026\n- AI Weekly「AI News Today」2026-09-30～10-01（高盛 AI 垃圾债报告；DeepSeek API 涨价 2.3–4.5 倍；Google Gemini 4 Argon 发布，定价 2/10 美元每百万 token）— aiweekly.co/ai-news-today","isoWeek":"2026-W40","file":"2026-W40.md"},"ai4s":{"week":0,"topic":"准备周","heading":"开公众号（约 1 小时）","md":"### 先定用哪个号\n你现有的公众号是育儿内容，读者完全不同，**建议新开一个订阅号**。注册入口 https://mp.weixin.qq.com → 立即注册 → 订阅号。个人身份能注册的号数量有上限，如果提示不能再注册，就退一步：在现有号之外开一个视频号或知乎专栏先写着，号的事不要卡住写作。\n\n### 名字备选（挑一个或自己起）\n1. **碳硅之间**（碳是生命，硅是芯片，最有记忆点）\n2. **AI 药研手记**（直白，搜索友好）\n3. **生命的算法**\n4. **一个算法工程师的生物课**（强调你的身份和学习过程，读者代入感强）\n5. **老药新用实验室**（和作品绑定，但范围窄）\n\n我的推荐：1 或 4。1 好记好传播；4 最真实，\"一个 AI 人重新学生物\"本身就是看点，也不用装专家。\n\n### 定位一句话（可改）\n\"一个 AI 算法工程师，重新捡起生物，边学边动手，记录 AI 怎么改变药物研发——每篇都有我亲手跑过的东西。\"\n\n### 第 0 篇「我为什么开始」提纲（有空写，不强制本周发）\n1. **开头**：从那条招聘写起——看到一个\"AI4S 生命科学\"岗位，发现自己十几年前学的东西突然和今天做的事撞上了。\n2. **我是谁**：微生物与生化药学硕士、后来做了 AI 算法、专业知识几乎忘光。坦白这一点，反而是最好的开场。\n3. **为什么是现在**：用本周前沿雷达里的两件事——斯坦福 3.7 万个 Agent 的虚拟药企、国内十部门规划——说明这件事已经从\"论文里的未来\"变成\"正在发生\"。\n4. **我打算怎么做**：12 周：捡回基础 → 看懂前沿 → 做一个 AI 老药新用的小作品。每两周更新一篇。\n5. **这个号会写什么、不写什么**：写亲手跑出来的东西、读透的论文、看得懂的前沿；不搬新闻、不吹概念。\n6. **结尾**：邀请做生物/做药/做 AI 的读者留言，告诉我哪里写错了——这也是在攒以后请教的人。\n\n### 今天做完\n总表打勾；在 `公众号/00-选题与发布记录.md` 第 0 行写上定下的名字。","ready":true,"intro":"**先看结论**：整周素材都在这一个文件里。这周不学具体知识，只做三件事：看清这个行业有哪几类人、我们站哪；看清一个药从想法到上市要走哪几步；把账号、工具和公众号准备好。每天 40 分钟，10/3 周六不排。\n\n标「事实」的是公开信息，标「我的判断」的是我的看法，可以不同意。","sources":"","file":"W00-准备周.md"}},{"date":"2026-10-05","week":4,"weekday":1,"weekdayCn":"周一","topic":"就业数据怎么读","scenario":{"n":1,"sym":"①","name":"一分钟自我介绍"},"macro":{"week":4,"topic":"就业数据怎么读","heading":"材料精读","md":"### 原始材料 1：一份“非农报告”，其实拼了两份调查\n\nBLS 每个月发的《就业形势》不是一张表，而是两份调查放在一起。\n\n- **家庭调查（CPS）**问大约 6 万户家庭：你有没有工作、有没有在找工作。失业率、劳动参与率、就业人口比都从这里来。一个人只有同时满足“没有工作、现在能工作、过去 4 周主动找过工作”，才算失业。想工作但最近没找的人，不进官方失业率的分子。\n- **机构调查（CES）**看约 11.9 万家企业和政府机构的工资记录，覆盖约 62.2 万个工作地点、约四分之一的非农岗位。非农新增、工时、时薪都从这里来。同一个人有两份工作，在这份调查里会算两个岗位。\n\n所以“非农新增 2.9 万”和“失业率 4.2%”不是同一批样本算出来的，短期出现方向不完全一致并不奇怪。读报告时先问一句：**这个数来自人，还是来自岗位？**\n\n### 原始材料 2：10 月 2 日公布的 9 月就业，弱点不只在 2.9 万\n\nBLS 的标题很克制：非农就业和失业率都“变化不大”。但把几个数放在一起看，降温已经很明显。\n\n- 9 月非农只增加 **2.9 万**，过去 12 个月平均每月增加 **4.5 万**。\n- 失业率从 8 月的 4.1% 升到 **4.2%**；失业人数 710 万。失业率从 3 月以来一直在 4.1%–4.3% 之间。\n- 7 月从 +2.1 万下修到 **-1.0 万**，8 月从 +16.2 万下修到 **+13.3 万**，两个月合计少了 **6.0 万**。\n- 平均时薪环比只涨 **0.1%**，同比涨 **3.0%**；平均每周工时维持 34.4 小时。\n- 主要行业都没有大幅变化。医疗增加 1.7 万，建筑增加 1.1 万，制造业增加 0.9 万，金融业减少 0.7 万。\n\n修订为什么重要？第一次公布时，很多企业的报表还没回来。随后 BLS 收到更多工资记录，再重算季节因素，所以前两个月会改。**一个月的首发数是快照，不是判决书。**\n\n### 原始材料 3：非农之外，再看“有没有人敢走”和“老板有没有开始裁”\n\n8 月 JOLTS 在 9 月 29 日发布：职位空缺 **707.9 万**，招聘 **519.2 万**，主动离职 **310 万**，裁员和解雇 **160 万**。BLS 说这些都“变化不大”。主动离职率是 1.9%，它能粗略反映员工有没有信心换工作。\n\n到 9 月 26 日那周，初请失业金人数是 **19.7 万**，比四周前少 1 万。初请是周频温度计：它比月度非农更快，但噪声也更大。现在它没有显示老板在突然大规模裁人。\n\n把三件事连起来读：**非农告诉你岗位净增多少，JOLTS 告诉你招聘和离职的流量，初请告诉你裁员有没有突然加速。** 只看一个数，很容易把“招聘冻结”误读成“裁员潮”，或者反过来。\n\n### 原始材料 4：Sahm 规则在看什么，以及它现在没说什么\n\nSahm 规则的算法很简单：先算最近 3 个月失业率的平均值，再拿它和过去 12 个月里最低的 3 个月平均值相比。如果高出 **0.50 个百分点或更多**，就发出“衰退可能已经开始”的信号。\n\nFRED 10 月 3 日更新的 9 月实时值是 **0.00**，远低于 0.50 的触发线。它不是预测模型，而是用失业率确认一场下滑是不是已经扩散到劳动力市场。它现在的意思只是：**还没有触发**。这不等于经济未来不会衰退，也不等于就业没有变弱。\n\n### 这周开始前，桌上摆着哪几个数\n\n| 数据 | 最新值 | 数据期 / 发布日 | 怎么读 |\n|---|---:|---|---|\n| 非农就业月增 | +2.9 万 | 2026-09 / 10-02 | 很弱；过去 12 个月月均 +4.5 万 |\n| 失业率 | 4.2% | 2026-09 / 10-02 | 比 8 月高 0.1 个百分点，但仍在 3 月以来区间内 |\n| 7–8 月非农合计修订 | -6.0 万 | 10-02 | 说明第一版数据高估了就业 |\n| 平均时薪 | 环比 +0.1%，同比 +3.0% | 2026-09 / 10-02 | 工资压力在降温 |\n| 劳动参与率 | 61.8% | 2026-09 / 10-02 | 比 8 月高 0.2 个百分点；别把失业率单独看 |\n| JOLTS 职位空缺 | 707.9 万 | 2026-08 / 09-29 | 需求仍在，但没有加速 |\n| JOLTS 主动离职 | 310 万，离职率 1.9% | 2026-08 / 09-29 | 员工换工作的底气不强 |\n| 初请失业金 | 19.7 万 | 截至 2026-09-26 / FRED 10-04 读取 | 暂时没有裁员突然上冲的信号 |\n| 实时 Sahm 指标 | 0.00 个百分点 | 2026-09 / FRED 10-03 更新 | 没触发 0.50 的衰退线 |\n\n### 我的判断\n\n1. **就业已经从“稳”变成“弱”，但还不是“崩”。** 最该警惕的是 +2.9 万和合计 -6 万的修订；最能压住恐慌的是 19.7 万初请和 0.00 的 Sahm 指标。\n2. **这份报告对美联储是两头拉扯。** 就业变弱支持少加息或先观察；但失业率只到 4.2%，工资同比仍有 3.0%，还不足以替通胀问题直接让路。\n3. **以后看到非农，先按固定顺序读：** 新增岗位 → 前两月修订 → 失业率与参与率 → 工资和工时 → 行业分布 → 初请和 JOLTS。标题数字排第一，但不能当全部。\n4. **市场如果只因“2.9 万很差”就押注政策急转弯，我会保留意见。** 需要再看到初请持续上升、失业率的三个月均值抬高，或者下个月继续大幅下修，证据才更完整。这是我的判断，不是官方结论。","ready":true,"intro":"**先看结论**：9 月美国非农只增 2.9 万，失业率升到 4.2%，前两月还被合计下修 6 万。就业明显降温，但 Sahm 指标仍是 0.00，初请也只有 19.7 万，所以现在更像“招聘变慢”，还不能直接叫衰退。\n\n每天读当天一节，35 分钟够。标着「原始材料」的是官方材料的忠实转述；标着「我的判断」的是我的看法，可以不同意。","sources":"- U.S. Bureau of Labor Statistics, *The Employment Situation — September 2026*（2026-10-02）：https://www.bls.gov/news.release/archives/empsit_10022026.htm\n- U.S. Bureau of Labor Statistics, *Job Openings and Labor Turnover — August 2026*（2026-09-29）：https://www.bls.gov/news.release/archives/jolts_09292026.htm\n- Federal Reserve Bank of St. Louis, *Sahm Rule Recession Indicator*（定义与最新月份）：https://fred.stlouisfed.org/release?rid=456\n- FRED, *Real-time Sahm Rule Recession Indicator*（2026-09 值 0.00）：https://fred.stlouisfed.org/series/SAHMREALTIME\n- FRED, *Initial Claims*（截至 2026-09-26 为 197,000）：https://fred.stlouisfed.org/series/ICSA\n- 本机只读运行 `10-项目/013-美股与大宗学习/scripts/fred_weekly.py`（2026-10-04），用于交叉检查 FRED 最新日期和值；未保存、未修改项目数据。","file":"W04-就业数据怎么读.md"},"eng":{"heading":"读物：A million tokens, but not for everyone yet","md":"Google announced a new model called Gemini 4 Argon on September 30. The headline number is unusual: the model can produce up to one million output tokens in one run. Its previous limit was 64,000. That does not mean every answer should become a book. It means the model has more room to work through a long task without stopping and starting again.\n\nGoogle says Argon is built for software engineering, legal and financial research, and defensive cybersecurity. The company also says its engineers have used the model for large code migrations and memory optimization inside Google. These are company-reported examples, not independent proof. **A benchmark tells you what a model can do in a test; it does not tell you what it will do in your product.**\n\nThe release is also careful. Argon is not widely available yet. Google is first giving access to selected cyber defenders through a program called Fairwind. It says the model can find and patch serious software weaknesses, but the same skill could be misused. The company is testing stronger controls against harmful requests, prompt injection, and actions that go beyond the user's goal. **The interesting part is not only that the model is stronger. It is that Google is slowing down the release because strength creates a larger safety problem.**\n\nGoogle published prices before the wider launch. The introductory price will be two dollars per million input tokens and ten dollars per million output tokens. Cached input will cost 95 percent less. After the introductory period, the listed prices double to four and twenty dollars. **Long context is useful, but long output can become expensive very quickly.**\n\nOne detail is easy to miss: Google describes a one-million-token **output** limit, not a one-million-token input window. Those are different. The first controls how much the model can produce in one run. The second controls how much material it can read at once. Product pages often mix these ideas, so read the fine print before comparing models.\n\nWhat does this mean for an independent developer? Do not rebuild your product around a launch that you cannot use yet. Keep the model behind a simple interface so you can change providers later. When access opens, test one real customer task, not a beautiful demo. Measure success rate, time, and total cost. **A larger limit is only valuable if it removes a real limit for your user.**\n\n（约 410 词）\n\n### 词汇表\n\n| 词 | 中文 | 文中用法 |\n|---|---|---|\n| headline number | 最抢眼的数字 | the headline number is unusual |\n| output token | 输出 token | one million output tokens |\n| in one run | 一次连续运行 | produce it in one run |\n| work through | 一步步处理完 | work through a long task |\n| migration | 迁移 | large code migrations |\n| company-reported | 公司自行公布的 | company-reported examples |\n| independent proof | 独立验证 | not independent proof |\n| defensive cybersecurity | 防御型网络安全 | built for defensive cybersecurity |\n| patch | 修补 | find and patch weaknesses |\n| misuse | 滥用 | the same skill could be misused |\n| prompt injection | 提示词注入攻击 | controls against prompt injection |\n| introductory price | 首发优惠价 | the introductory price |\n| cached input | 缓存过的输入 | cached input will cost less |\n| provider | 服务提供商 | change providers later |\n| success rate | 成功率 | measure success rate |\n\n### 今日表达（挑 3–5 个抄进总表）\n\n1. **without stopping and starting again** — 不用停下再重来。The agent finished the migration without stopping and starting again.\n2. **not independent proof** — 不是独立验证。A vendor benchmark is useful, but it is not independent proof.\n3. **go beyond the user's goal** — 做过头、超出用户本意。The tool should stop before it goes beyond the user's goal.\n4. **rebuild around** — 围着某样东西重做。Do not rebuild the product around one new model.\n5. **a real customer task** — 真实客户任务。Test it on a real customer task, not a demo.\n6. **only valuable if…** — 只有在……时才有价值。More context is only valuable if it improves the answer.\n\n### 场景范例 ①：一分钟自我介绍（“我能解决什么”版）\n\n> Hi, I’m Fred. I’m an AI and machine-learning engineer based in China. In my day job, I build AI products for government clients, where reliability and review matter as much as model quality. On the side, I build small SaaS products for English-speaking users. One example is ScribbleCub, a tool that turns a short idea into a printable coloring page for parents and teachers. **The useful thing I bring is not just model knowledge. I can take a messy, repetitive job and turn it into a product people can actually use.** I usually start with the user's real job, then choose the smallest model and workflow that can do it reliably. Right now I’m learning two things outside my normal work: how macro data moves markets, and how to explain my products clearly in English. I’m interested in practical AI — smaller systems with a clear user, a clear cost, and a result you can check. That is usually where I can help.\n\n**心里回答**：别背整段。按四步说 60 秒：你是谁 → 白天解决什么问题 → 业余产品给谁什么结果 → “That is where I can help.” 前面补一句你真正擅长的事。","ready":true,"howto":"**怎么用（上班默读版，20–25 分钟）**：① 读物读一遍只求看懂（5 分钟）；② 再读一遍，**加粗的句子在心里默念出声**（5 分钟）；③ 从「今日表达」里挑 3–5 个，各造一句（5 分钟）；④ 读场景范例，闭眼用英文回答最后的问题，撑 2 分钟（5 分钟）。\n\n读物由我根据官方发布用自己的话写成，难度控制在 B2。Google 公布的性能数字属于公司自报；这里没有把它们当成独立验证结果。\n\n**本周场景轮**（第 4 周）：周一① 周二② 周三⑦ 周四① 周五② 周六⑦，周日输出日。","sources":"- Google, *Gemini 4 Argon: our next era of frontier intelligence*（2026-09-30）：https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-4-argon/\n- Google, *The latest AI news we announced in September 2026*（2026-10-02，用于核对发布时间与当月产品范围）：https://blog.google/innovation-and-ai/technology/ai/google-ai-updates-september-2026/","isoWeek":"2026-W41","file":"2026-W41.md"},"ai4s":{"week":1,"topic":"从基因到蛋白","heading":"概念精读：从基因到蛋白，结构决定功能","md":"### 事实：五个台阶，一级一级往上走\n\n**① DNA → RNA → 蛋白（中心法则）**\nDNA 是说明书，存在细胞核里；要用的时候先抄一份成 RNA（转录），RNA 被核糖体读，每 3 个字母对应 1 个氨基酸，一个个连起来就是蛋白（翻译）。所以**基因上改一个字母，蛋白上就可能换一个氨基酸**。L858R 就是这么来的：EGFR 基因上一个字母变了，蛋白第 858 位的亮氨酸（L）变成了精氨酸（R）。\n\n**② 氨基酸：20 种积木，性格不同**\n20 种氨基酸有的怕水（疏水，喜欢躲在蛋白内部），有的带电（喜欢在表面和水待着），有的很小（甘氨酸），有的很大（色氨酸）。亮氨酸（L）是疏水、中性的；精氨酸（R）是又大又带正电的。**把一个疏水的换成一个带电的大个子，局部结构就会被\"撑变形\"**——这是 L858R 起作用的物理原因。\n\n**③ 蛋白结构的四级**\n- 一级：氨基酸的顺序（就是序列，UniProt 里那一长串字母）\n- 二级：局部盘成螺旋（α 螺旋）或折成片（β 折叠）\n- 三级：整条链折成的三维形状（PDB 和 AlphaFold 给的就是这个）\n- 四级：几条链拼在一起（EGFR 激活时两个 EGFR 要配对，叫二聚体）\n\n**④ 结构决定功能：口袋、开关、构象**\n蛋白干活靠形状。表面的凹槽叫**口袋**，小分子（包括药）能卡进去。很多蛋白像开关，有\"关\"和\"开\"两种形状（叫**构象**），在两者之间切换。\n\n**⑤ 激酶：给别的蛋白\"贴标签\"的酶**\nEGFR 是一种**受体酪氨酸激酶**：\n- 它横跨细胞膜，外面那半接收信号（生长因子 EGF），里面那半是**激酶域**，负责干活。\n- 激酶干的活：从 ATP（细胞的能量分子）上拿一个磷酸基团，贴到别的蛋白上（磷酸化），相当于按下\"细胞分裂\"的按钮。\n- 正常情况下，没有 EGF 信号时激酶域是\"关\"的。\n\n### 事实：EGFR 和肺癌\n\n- **突变让开关坏在\"开\"的位置**：L858R 和第 19 号外显子的小片段缺失（外显子 = 基因里真正编码蛋白的那几段），是 EGFR 最常见的两类突变，合起来约占 EGFR 突变的九成。它们让激酶域在没有信号时也保持\"开\"，细胞不停地收到\"分裂\"指令——这就是癌。\n- **吉非替尼怎么起作用**：它长得有点像 ATP，挤进激酶域里原本放 ATP 的口袋，把 ATP 挤走，激酶就干不了活。这类药叫 **TKI（酪氨酸激酶抑制剂）**。\n- **为什么突变的病人效果特别好**：2007 年 Yun 等人解出突变体的晶体结构后发现，吉非替尼和 L858R 突变体的结合比和正常 EGFR 紧约 20 倍。也就是说，突变不光打开了开关，还让口袋变得更\"欢迎\"这个药。\n- **人群差异**：EGFR 突变在东亚、不吸烟、肺腺癌病人里特别多，这也是吉非替尼在亚洲病人中效果更好的原因。\n- **后来的故事**：病人吃药一两年后常会耐药，最常见的原因是又长出第二个突变 T790M（第 790 位苏氨酸变甲硫氨酸），这个位置像口袋的\"看门人\"，一变就把药挡在外面。于是又有了专门对付 T790M 的第三代药奥希替尼。\n\n### 我的判断\n\n1. 这个故事是**整个精准医疗的模板**：病人基因 → 蛋白结构变化 → 药效差异。以后你看任何一个 AI 预测\"某个药对某个病有效\"，都要追问：它有没有落到这条链的每一环上？\n2. 对做科研 Agent 的人来说，这个故事里最值钱的一步是\"**有人回头去查了那 10% 有效病人的基因**\"——从例外里找规律，而不是只看平均效果。这正是 Agent 擅长的活：在大量数据里找那一小撮\"不一样的\"。\n3. 注意编号：UniProt 和现在的论文里 L858R 的编号从第一个氨基酸（包括最前面那段信号肽）开始数。一些很早的文献不算信号肽，同一个突变会写成 L834R。**Agent 在做数据对齐时最容易在这种地方出错**，记住这个坑。\n\n### 读完你应该能回答\n1. 基因上改一个字母，为什么会让一个药突然好用很多？用 EGFR 的例子讲，不超过五句话。\n2. 吉非替尼是\"抢位置\"的药，它抢的是谁的位置？\n3. 为什么吃吉非替尼的病人后来会耐药？","ready":true,"intro":"**先看结论**：这一周整周都围绕一个故事——**肺癌药吉非替尼（易瑞沙）为什么只对一部分病人有奇效**。答案藏在一个叫 EGFR 的蛋白上：病人的 EGFR 基因上如果有一个特定突变（比如第 858 位的亮氨酸 L 变成了精氨酸 R，写作 L858R），这个蛋白就会\"卡在开机状态\"，同时变得更容易被药抓住。把这个故事讲清楚，你就把\"基因 → 蛋白 → 结构 → 药效\"这条主线捡回来了。\n\n**周六要做出什么**：亲手在 UniProt、PDB、AlphaFold 数据库里查 EGFR，在 3D 结构里找到吉非替尼卡在哪、858 位在哪；写一页笔记讲清这个故事。\n\n标「事实」的是公开信息，标「我的判断」的是我的看法，可以不同意。","sources":"- UniProt P00533（EGFR）：https://www.uniprot.org/uniprotkb/P00533/entry\n- RCSB PDB 4WKQ（EGFR 激酶域 + 吉非替尼，1.85 Å）：https://www.rcsb.org/structure/4WKQ\n- RCSB PDB 2ITY（正常 EGFR + 吉非替尼，3.42 Å）：https://www.rcsb.org/structure/2ITY\n- RCSB PDB 2ITZ（L858R + 吉非替尼，2.80 Å；引用 Yun C.-H. 等，Cancer Cell 2007，\"结合紧约 20 倍\"出自这篇）：https://www.rcsb.org/structure/2ITZ\n- Lynch T.J. 等，NEJM 2004：https://www.nejm.org/doi/full/10.1056/NEJMoa040938 （PubMed 摘要：https://pubmed.ncbi.nlm.nih.gov/15118073/ ）\n- Paez J.G. 等，Science 2004：https://www.science.org/doi/10.1126/science.1099314\n- AlphaFold 数据库 EGFR：https://alphafold.ebi.ac.uk/entry/P00533\n- EMBL 新闻，AlphaFold Database adds viral protein complexes，2026-09-24：https://www.embl.org/news/science-technology/alphafold-database-adds-viral-protein-complexes-to-support-pandemic-preparedness/\n- Nature 新闻，How a team of AIs discovered a promising lung-cancer drug，2026-09-17：https://www.nature.com/articles/d41586-026-02954-y\n- 新浪科技，多项研发成果落地，晶泰控股探索AI新药研发新路径，2026-09-24：https://finance.sina.com.cn/tech/roll/2026-09-24/doc-inisxnvc0344447.shtml","file":"W01-从基因到蛋白.md"}},{"date":"2026-10-06","week":4,"weekday":2,"weekdayCn":"周二","topic":"就业数据怎么读","scenario":{"n":2,"sym":"②","name":"讲一个我做的产品"},"macro":null,"eng":null,"ai4s":{"week":1,"topic":"从基因到蛋白","heading":"论文导读：一个药为什么只对 10% 的人有奇效","md":"### 读哪篇\n- 主读：Lynch T.J. 等，「Activating mutations in the epidermal growth factor receptor underlying responsiveness of non-small-cell lung cancer to gefitinib」，**NEJM** 2004。https://www.nejm.org/doi/full/10.1056/NEJMoa040938\n- 同时发表的姊妹篇：Paez J.G. 等，「EGFR mutations in lung cancer: correlation with clinical response to gefitinib therapy」，**Science** 2004。https://www.science.org/doi/10.1126/science.1099314\n- 三年后解释\"为什么\"的结构论文：Yun C.-H. 等，Cancer Cell 2007（对应 PDB 结构 2ITY、2ITZ）\n\n### 事实：这篇要解决什么问题\n2003 年吉非替尼在美国上市，但在不挑病人的试验里，只有大约一成的肺癌病人肿瘤明显缩小；而这一小撮人效果好得惊人，有的肿瘤几乎消失。医生们困惑：同样的病、同样的药，为什么差这么多？\n\n### 事实：他们怎么做的（大白话）\n1. 找到对吉非替尼反应特别好的病人，拿他们手术时留下的肿瘤组织。\n2. 对 EGFR 基因的激酶域那几段做测序，同时测一组没反应的病人做对照。\n3. 把找到的突变做进细胞里，看这些突变的 EGFR 活性有没有变、对吉非替尼是不是更敏感。\n\n### 事实：关键结果\n- Lynch 这篇：**9 个有反应的病人里 8 个有 EGFR 突变，7 个没反应的病人里 0 个有**（P<0.001）。\n- 没用过药的普通肺癌病人里，突变比例是 25 个里 2 个（约 8%）。\n- 突变都是小的缺失或单个氨基酸替换，**全都聚集在 ATP 口袋附近**。\n- 细胞实验：突变的 EGFR 活性更强，而且对吉非替尼抑制更敏感。\n- Paez 那篇还发现，日本病人里的突变比例明显高于美国病人——解释了临床上\"亚洲病人效果更好\"的观察。\n\n### 事实：它做不到什么\n- 样本很小（Lynch 只有十几个病人），只能说明\"强相关\"，要到后来的大型临床试验（2009 年的 IPASS 试验等）才坐实\"先测突变再用药\"。\n- 它说明了\"突变 → 敏感\"，但**为什么**敏感要等 2007 年的晶体结构才讲清楚（就是周一讲的\"突变体跟药结合紧约 20 倍\"）。\n- 没有回答耐药问题，T790M 是 2005 年另外的论文发现的。\n\n### 值得你自己看原文的图\n- Lynch 论文里那张**EGFR 蛋白示意图 + 突变位置标注**：你会看到所有突变都挤在激酶域同一小块区域里，一眼就懂\"它们都在口袋附近\"。\n- Paez 论文里**测序峰图**：看一眼真实的突变证据长什么样（杂合突变时两种碱基的峰叠在一起）。\n\n### 我的判断：对做科研 Agent 的启发\n1. **好的研究问题常常来自\"异常值\"**。平均效果 10% 看起来很差，但分布是两极的——这是一个信号。以后我们让 Agent 读临床试验数据，要让它专门找\"平均不好、但有一小撮特别好\"的药，这恰恰是老药新用最肥的矿。\n2. **一条完整的证据链有三层**：病人层（谁有效）→ 分子层（突变）→ 结构层（为什么）。我们作品里每条假设，也要按这三层去找证据，缺哪层就标出来。\n3. 这个故事从发现到被结构解释用了三年，到大型试验坐实用了五年。AI 能压缩的是\"想到去查突变\"和\"找证据\"这两段，压缩不了临床验证。","ready":true,"intro":"**先看结论**：这一周整周都围绕一个故事——**肺癌药吉非替尼（易瑞沙）为什么只对一部分病人有奇效**。答案藏在一个叫 EGFR 的蛋白上：病人的 EGFR 基因上如果有一个特定突变（比如第 858 位的亮氨酸 L 变成了精氨酸 R，写作 L858R），这个蛋白就会\"卡在开机状态\"，同时变得更容易被药抓住。把这个故事讲清楚，你就把\"基因 → 蛋白 → 结构 → 药效\"这条主线捡回来了。\n\n**周六要做出什么**：亲手在 UniProt、PDB、AlphaFold 数据库里查 EGFR，在 3D 结构里找到吉非替尼卡在哪、858 位在哪；写一页笔记讲清这个故事。\n\n标「事实」的是公开信息，标「我的判断」的是我的看法，可以不同意。","sources":"- UniProt P00533（EGFR）：https://www.uniprot.org/uniprotkb/P00533/entry\n- RCSB PDB 4WKQ（EGFR 激酶域 + 吉非替尼，1.85 Å）：https://www.rcsb.org/structure/4WKQ\n- RCSB PDB 2ITY（正常 EGFR + 吉非替尼，3.42 Å）：https://www.rcsb.org/structure/2ITY\n- RCSB PDB 2ITZ（L858R + 吉非替尼，2.80 Å；引用 Yun C.-H. 等，Cancer Cell 2007，\"结合紧约 20 倍\"出自这篇）：https://www.rcsb.org/structure/2ITZ\n- Lynch T.J. 等，NEJM 2004：https://www.nejm.org/doi/full/10.1056/NEJMoa040938 （PubMed 摘要：https://pubmed.ncbi.nlm.nih.gov/15118073/ ）\n- Paez J.G. 等，Science 2004：https://www.science.org/doi/10.1126/science.1099314\n- AlphaFold 数据库 EGFR：https://alphafold.ebi.ac.uk/entry/P00533\n- EMBL 新闻，AlphaFold Database adds viral protein complexes，2026-09-24：https://www.embl.org/news/science-technology/alphafold-database-adds-viral-protein-complexes-to-support-pandemic-preparedness/\n- Nature 新闻，How a team of AIs discovered a promising lung-cancer drug，2026-09-17：https://www.nature.com/articles/d41586-026-02954-y\n- 新浪科技，多项研发成果落地，晶泰控股探索AI新药研发新路径，2026-09-24：https://finance.sina.com.cn/tech/roll/2026-09-24/doc-inisxnvc0344447.shtml","file":"W01-从基因到蛋白.md"}},{"date":"2026-10-07","week":4,"weekday":3,"weekdayCn":"周三","topic":"就业数据怎么读","scenario":{"n":7,"sym":"⑦","name":"讲今天的日常"},"macro":null,"eng":null,"ai4s":{"week":1,"topic":"从基因到蛋白","heading":"工具预习：UniProt、PDB、AlphaFold 数据库怎么看","md":"三个库的关系一句话：**UniProt 告诉你这个蛋白是谁、干什么、有哪些突变；PDB 告诉你实验测出来的真实三维结构；AlphaFold 数据库告诉你 AI 预测的三维结构。** 三个都免费、不用注册。\n\n### 1. UniProt（https://www.uniprot.org）\n打开 EGFR 的页面：https://www.uniprot.org/uniprotkb/P00533/entry ，页面左边是目录，重点看这几块：\n\n| 页面上的块 | 看什么 | EGFR 里能看到什么 |\n|---|---|---|\n| Function（功能） | 这个蛋白干什么 | 受体酪氨酸激酶，结合 EGF 后激活下游信号 |\n| Names & Taxonomy | 基因名、物种 | 基因名 EGFR，人 |\n| Subcellular location | 在细胞哪里 | 细胞膜（横跨） |\n| Disease & Variants | 相关疾病和已知突变 | 肺癌；找 858 这一行 |\n| PTM/Processing | 信号肽、修饰位点 | 最前面 24 个氨基酸是信号肽 |\n| Structure | 已有的结构 | 列出上百个 PDB 编号，还有 AlphaFold 链接 |\n| Family & Domains | 结构域 | 激酶域的起止位置 |\n| Sequence | 序列 | 1210 个氨基酸 |\n\n### 2. PDB（https://www.rcsb.org）\n实验测出来的结构库。搜 4WKQ 进入 https://www.rcsb.org/structure/4WKQ ：\n- 标题：「1.85 angstrom structure of EGFR kinase domain with gefitinib」，就是 EGFR 激酶域 + 吉非替尼。\n- **分辨率 1.85 Å**：数字越小越清楚，2 Å 以下算很好。\n- **Ligand（配体）**：写着 IRE，这是吉非替尼在 PDB 里的代号。\n- 页面上的 3D 结构图点开就是 **Mol\\*** 查看器，可以转、放大、点某个氨基酸看名字。\n\n另外两个周六会用：2ITY（正常 EGFR + 吉非替尼，3.42 Å）和 2ITZ（L858R 突变体 + 吉非替尼，2.80 Å），都来自 2007 年 Yun 等人那篇。\n\n### 3. AlphaFold 数据库（https://alphafold.ebi.ac.uk）\n搜 P00533 进入 https://alphafold.ebi.ac.uk/entry/P00533 。\n- 这是 **AI 预测的**全长结构，不是实验测的。\n- 结构按颜色标**置信度 pLDDT**（0–100）：深蓝 >90 很可信，浅蓝 70–90 还行，黄色 50–70 低，橙色 <50 基本不可信（通常是天生没有固定形状的柔性区域）。\n- 下方的 **PAE 图**（一个方块热图）：看两个区域之间的相对位置准不准，深绿色 = 准。现在先知道有这个东西就行，W3 细讲。\n\n### 5 分钟小练习\n在 UniProt 的 EGFR 页面，找到 Disease & Variants 那一块，用浏览器搜索（Cmd+F）\"858\"，看它写的是什么。再搜\"790\"，看看 T790M 是怎么描述的。","ready":true,"intro":"**先看结论**：这一周整周都围绕一个故事——**肺癌药吉非替尼（易瑞沙）为什么只对一部分病人有奇效**。答案藏在一个叫 EGFR 的蛋白上：病人的 EGFR 基因上如果有一个特定突变（比如第 858 位的亮氨酸 L 变成了精氨酸 R，写作 L858R），这个蛋白就会\"卡在开机状态\"，同时变得更容易被药抓住。把这个故事讲清楚，你就把\"基因 → 蛋白 → 结构 → 药效\"这条主线捡回来了。\n\n**周六要做出什么**：亲手在 UniProt、PDB、AlphaFold 数据库里查 EGFR，在 3D 结构里找到吉非替尼卡在哪、858 位在哪；写一页笔记讲清这个故事。\n\n标「事实」的是公开信息，标「我的判断」的是我的看法，可以不同意。","sources":"- UniProt P00533（EGFR）：https://www.uniprot.org/uniprotkb/P00533/entry\n- RCSB PDB 4WKQ（EGFR 激酶域 + 吉非替尼，1.85 Å）：https://www.rcsb.org/structure/4WKQ\n- RCSB PDB 2ITY（正常 EGFR + 吉非替尼，3.42 Å）：https://www.rcsb.org/structure/2ITY\n- RCSB PDB 2ITZ（L858R + 吉非替尼，2.80 Å；引用 Yun C.-H. 等，Cancer Cell 2007，\"结合紧约 20 倍\"出自这篇）：https://www.rcsb.org/structure/2ITZ\n- Lynch T.J. 等，NEJM 2004：https://www.nejm.org/doi/full/10.1056/NEJMoa040938 （PubMed 摘要：https://pubmed.ncbi.nlm.nih.gov/15118073/ ）\n- Paez J.G. 等，Science 2004：https://www.science.org/doi/10.1126/science.1099314\n- AlphaFold 数据库 EGFR：https://alphafold.ebi.ac.uk/entry/P00533\n- EMBL 新闻，AlphaFold Database adds viral protein complexes，2026-09-24：https://www.embl.org/news/science-technology/alphafold-database-adds-viral-protein-complexes-to-support-pandemic-preparedness/\n- Nature 新闻，How a team of AIs discovered a promising lung-cancer drug，2026-09-17：https://www.nature.com/articles/d41586-026-02954-y\n- 新浪科技，多项研发成果落地，晶泰控股探索AI新药研发新路径，2026-09-24：https://finance.sina.com.cn/tech/roll/2026-09-24/doc-inisxnvc0344447.shtml","file":"W01-从基因到蛋白.md"}},{"date":"2026-10-08","week":4,"weekday":4,"weekdayCn":"周四","topic":"就业数据怎么读","scenario":{"n":1,"sym":"①","name":"一分钟自我介绍"},"macro":null,"eng":null,"ai4s":{"week":1,"topic":"从基因到蛋白","heading":"前沿雷达（9/17–9/28）","md":"> 上周准备周的 10/1 已经讲过斯坦福\"虚拟生物技术公司\"、Paper2Agent、艾伯维-Iambic 合作和国内十部门规划，这里不重复，只补新的，外加一条和本周主题（肺癌）直接相关的后续。\n\n**① AlphaFold 数据库加入 2800 多种病毒的蛋白复合物结构（EMBL 新闻 9/24）**\n- 发生了什么：EMBL-EBI、Google DeepMind、英伟达等多家机构合作，把 2800 多种病毒（优先挑感染人的病毒家族，从普通感冒病毒到猴痘）的蛋白及蛋白复合物预测结构放进了 AlphaFold 数据库，现在库里总共有 2.6 亿多条预测。\n- 为什么重要：以前 AlphaFold 数据库主要是单个蛋白；复合物（几个蛋白拼在一起）才是很多药和疫苗真正要对付的东西。\n- 和我们的关系：周六你会用这个库。记住它**已经不只有单蛋白了**，以后查靶点时可以直接看有没有复合物结构。\n\n**② Nature 新闻：「一群 AI 如何发现一个有希望的肺癌药」（9/17）**\n- 发生了什么：Nature 对斯坦福\"虚拟生物技术公司\"的新闻解读。那套 3.7 万个 Agent 的系统提出的肺癌方向（B7-H3 抗体偶联药），和现实里已拿到 FDA 突破性疗法认定的药一致。\n- 和本周主题的关系：同样是肺癌，同样是\"找到对的靶点 + 对的病人\"。二十年前 EGFR 靠医生回头查基因发现，今天开始有 Agent 在上万个临床试验里自动找这种规律。读完本周你会更明白它在找什么。\n\n**③ 晶泰控股密集发布研发进展（新浪科技 9/24）**\n- 公司公布的：和斯坦福合作用它的 PACE 药物发现平台筛新药；一个 HIV 新药项目用 AI 从千万级虚拟化合物库里筛候选，7 个月完成临床前候选化合物提名（公司说传统要约 4.5 年）；上线 XtalPi Science 平台，含 80 多项科学技能和工具；和礼来有最高 3.45 亿美元的双抗平台合作。\n- 我的提醒：「7 个月 vs 4.5 年」「性能超过某某模型」这类说法都是**公司自己的口径**，没有第三方核对，看的时候打个折。但\"把科学技能和工具打包给 Agent 用\"这个方向，和我们要做的事是一回事。\n\n**我的判断：这段时间最值得记住的是①。** AlphaFold 数据库从\"单个蛋白\"走到\"复合物\"，意味着以后免费能拿到的结构信息会越来越接近药真正起作用的场景。对个人来说，**公开数据的天花板在持续抬高**，这对我们这种没有实验室的人是好消息。","ready":true,"intro":"**先看结论**：这一周整周都围绕一个故事——**肺癌药吉非替尼（易瑞沙）为什么只对一部分病人有奇效**。答案藏在一个叫 EGFR 的蛋白上：病人的 EGFR 基因上如果有一个特定突变（比如第 858 位的亮氨酸 L 变成了精氨酸 R，写作 L858R），这个蛋白就会\"卡在开机状态\"，同时变得更容易被药抓住。把这个故事讲清楚，你就把\"基因 → 蛋白 → 结构 → 药效\"这条主线捡回来了。\n\n**周六要做出什么**：亲手在 UniProt、PDB、AlphaFold 数据库里查 EGFR，在 3D 结构里找到吉非替尼卡在哪、858 位在哪；写一页笔记讲清这个故事。\n\n标「事实」的是公开信息，标「我的判断」的是我的看法，可以不同意。","sources":"- UniProt P00533（EGFR）：https://www.uniprot.org/uniprotkb/P00533/entry\n- RCSB PDB 4WKQ（EGFR 激酶域 + 吉非替尼，1.85 Å）：https://www.rcsb.org/structure/4WKQ\n- RCSB PDB 2ITY（正常 EGFR + 吉非替尼，3.42 Å）：https://www.rcsb.org/structure/2ITY\n- RCSB PDB 2ITZ（L858R + 吉非替尼，2.80 Å；引用 Yun C.-H. 等，Cancer Cell 2007，\"结合紧约 20 倍\"出自这篇）：https://www.rcsb.org/structure/2ITZ\n- Lynch T.J. 等，NEJM 2004：https://www.nejm.org/doi/full/10.1056/NEJMoa040938 （PubMed 摘要：https://pubmed.ncbi.nlm.nih.gov/15118073/ ）\n- Paez J.G. 等，Science 2004：https://www.science.org/doi/10.1126/science.1099314\n- AlphaFold 数据库 EGFR：https://alphafold.ebi.ac.uk/entry/P00533\n- EMBL 新闻，AlphaFold Database adds viral protein complexes，2026-09-24：https://www.embl.org/news/science-technology/alphafold-database-adds-viral-protein-complexes-to-support-pandemic-preparedness/\n- Nature 新闻，How a team of AIs discovered a promising lung-cancer drug，2026-09-17：https://www.nature.com/articles/d41586-026-02954-y\n- 新浪科技，多项研发成果落地，晶泰控股探索AI新药研发新路径，2026-09-24：https://finance.sina.com.cn/tech/roll/2026-09-24/doc-inisxnvc0344447.shtml","file":"W01-从基因到蛋白.md"}},{"date":"2026-10-09","week":4,"weekday":5,"weekdayCn":"周五","topic":"就业数据怎么读","scenario":{"n":2,"sym":"②","name":"讲一个我做的产品"},"macro":null,"eng":null,"ai4s":{"week":1,"topic":"从基因到蛋白","heading":"自测","md":"### 5 道题（答案在最后）\n1. 用一句话说：L858R 这个写法里，L、858、R 分别是什么意思？\n2. 吉非替尼属于哪一类药？它在 EGFR 上\"抢\"的是哪个分子的位置？\n3. 判断对错：\"AlphaFold 数据库里 EGFR 结构的所有区域都一样可信。\"\n4. 判断对错：\"Lynch 2004 年的研究证明了所有带 EGFR 突变的肺癌病人都应该用吉非替尼。\"\n5. 一个 AI 助手告诉你：\"EGFR L834R 和 L858R 是两个不同的突变。\"你怎么判断它对不对？\n\n#### 答案\n1. L 是原来的氨基酸（亮氨酸），858 是在蛋白序列上的位置，R 是变成的氨基酸（精氨酸）。\n2. 酪氨酸激酶抑制剂（TKI）；它抢的是 ATP 的位置，挤进激酶域的 ATP 口袋，让激酶没法干活。\n3. 错。AlphaFold 按 pLDDT 给每个位置打分，EGFR 的激酶域、胞外域大多是高可信的蓝色，但连接区和两端常有黄色、橙色的低可信区。看结构一定要看颜色。\n4. 错。那是十几个病人的小研究，只能说明强相关；\"先测突变再用药\"是 2009 年 IPASS 等大型临床试验之后才确立的。\n5. 很可能说错了。早年一些文献不算前面 24 个氨基酸的信号肽，所以同一个突变会被写成 L834R（858 − 24 = 834）。核对办法：去 UniProt 看信号肽长度，再看原文用的是哪种编号。这类\"编号对不上\"是 AI 和数据整合里最常见的坑。\n\n### 本周小结\n去总表 10/11 那行小结填三格：本周能讲清楚什么、卡在哪、下周想问我什么。","ready":true,"intro":"**先看结论**：这一周整周都围绕一个故事——**肺癌药吉非替尼（易瑞沙）为什么只对一部分病人有奇效**。答案藏在一个叫 EGFR 的蛋白上：病人的 EGFR 基因上如果有一个特定突变（比如第 858 位的亮氨酸 L 变成了精氨酸 R，写作 L858R），这个蛋白就会\"卡在开机状态\"，同时变得更容易被药抓住。把这个故事讲清楚，你就把\"基因 → 蛋白 → 结构 → 药效\"这条主线捡回来了。\n\n**周六要做出什么**：亲手在 UniProt、PDB、AlphaFold 数据库里查 EGFR，在 3D 结构里找到吉非替尼卡在哪、858 位在哪；写一页笔记讲清这个故事。\n\n标「事实」的是公开信息，标「我的判断」的是我的看法，可以不同意。","sources":"- UniProt P00533（EGFR）：https://www.uniprot.org/uniprotkb/P00533/entry\n- RCSB PDB 4WKQ（EGFR 激酶域 + 吉非替尼，1.85 Å）：https://www.rcsb.org/structure/4WKQ\n- RCSB PDB 2ITY（正常 EGFR + 吉非替尼，3.42 Å）：https://www.rcsb.org/structure/2ITY\n- RCSB PDB 2ITZ（L858R + 吉非替尼，2.80 Å；引用 Yun C.-H. 等，Cancer Cell 2007，\"结合紧约 20 倍\"出自这篇）：https://www.rcsb.org/structure/2ITZ\n- Lynch T.J. 等，NEJM 2004：https://www.nejm.org/doi/full/10.1056/NEJMoa040938 （PubMed 摘要：https://pubmed.ncbi.nlm.nih.gov/15118073/ ）\n- Paez J.G. 等，Science 2004：https://www.science.org/doi/10.1126/science.1099314\n- AlphaFold 数据库 EGFR：https://alphafold.ebi.ac.uk/entry/P00533\n- EMBL 新闻，AlphaFold Database adds viral protein complexes，2026-09-24：https://www.embl.org/news/science-technology/alphafold-database-adds-viral-protein-complexes-to-support-pandemic-preparedness/\n- Nature 新闻，How a team of AIs discovered a promising lung-cancer drug，2026-09-17：https://www.nature.com/articles/d41586-026-02954-y\n- 新浪科技，多项研发成果落地，晶泰控股探索AI新药研发新路径，2026-09-24：https://finance.sina.com.cn/tech/roll/2026-09-24/doc-inisxnvc0344447.shtml","file":"W01-从基因到蛋白.md"}},{"date":"2026-10-10","week":4,"weekday":6,"weekdayCn":"周六","topic":"就业数据怎么读","scenario":{"n":7,"sym":"⑦","name":"讲今天的日常"},"macro":null,"eng":null,"ai4s":{"week":1,"topic":"从基因到蛋白","heading":"动手（2 小时）：亲手查一遍 EGFR 和吉非替尼","md":"> 全部在网页上完成，不需要装任何东西。最后有一个选做的 Python 脚本。\n\n### 第一步（25 分钟）：UniProt 读懂 EGFR\n1. 打开 https://www.uniprot.org/uniprotkb/P00533/entry\n2. 在 Function 里找一句话描述 EGFR 干什么，抄进笔记。\n3. 在 PTM/Processing 里找到信号肽的起止位置。\n4. 在 Family & Domains 里找到 **Protein kinase** 那一行，记下起止位置（激酶域）。\n5. 在 Disease & Variants 里找到第 858 位，看描述里提到了什么病、什么药。\n6. 算一下：858 在不在你第 4 步记下的激酶域范围里？\n\n### 第二步（35 分钟）：PDB 里看药卡在哪\n1. 打开 https://www.rcsb.org/structure/4WKQ ，点页面上的 3D 结构图进入 Mol\\* 查看器。\n2. 默认显示：蛋白是彩带（cartoon），吉非替尼是棍棒（ball-and-stick）。转一转，找到那个小分子——它就卡在激酶域中间的口袋里。\n3. 在右侧或下方的序列栏里找到第 858 位（显示为 LEU 858），点一下，结构里会高亮。看看它离吉非替尼有多远。\n4. 再找第 790 位（THR 790，就是后来耐药的\"看门人\"位置），点一下。你会发现它比 858 更贴近药。**截两张图存进笔记**。\n5. 想一想：790 离药很近，所以 T790M 能直接把药挡住；858 离药稍远，它是通过改变整个激酶域的开关状态起作用的。这就是周一讲的\"撑变形\"。\n\n### 第三步（25 分钟）：对比正常和突变体\n1. 打开 https://www.rcsb.org/structure/2ITY （正常 EGFR + 吉非替尼）和 https://www.rcsb.org/structure/2ITZ （L858R 突变体 + 吉非替尼）。\n2. 看两个页面的分辨率、标题、引用的论文（都是 Yun 等 2007 Cancer Cell）。\n3. 在 2ITZ 的 Mol\\* 里找到第 858 位，确认它显示的是 ARG（精氨酸），不是 LEU。\n4. 不用做精细比较，只要能说出：这两个结构说明了什么（突变体和正常体都能结合吉非替尼，但论文测出突变体结合紧约 20 倍）。\n\n### 第四步（15 分钟）：AlphaFold 看预测结构\n1. 打开 https://alphafold.ebi.ac.uk/entry/P00533\n2. 看颜色：哪些区域是深蓝（很可信），哪些是黄橙色（不可信）？激酶域是什么颜色？\n3. 想一想：AlphaFold 给的是**一个**形状，但 EGFR 实际上在\"开\"和\"关\"两种构象之间切换。它给的是哪一种？（提示：它不一定会告诉你，这就是 AI 结构的局限，W3 细讲。）\n\n### 第五步（20 分钟）：写一页笔记\n在 `11-AI生命科学/作品/` 下新建 `W01-EGFR笔记.md`，用你自己的话写，包括：\n- EGFR 是什么、在哪、干什么（2 句）\n- 吉非替尼卡在哪、怎么起作用（2 句 + 截图）\n- 为什么 L858R 病人效果好（3 句，包括\"开关卡在开\"和\"结合紧约 20 倍\"）\n- 为什么后来会耐药（1 句 + 790 位的截图）\n- 一句话：AI 预测的结构在这个故事里能帮上什么、帮不上什么\n\n### 选做（15 分钟）：用代码再查一遍\n我写好了一个脚本，把上面网页里看到的东西用程序拿一遍（UniProt 的结构域和 858 位变异、三个 PDB 结构的标题和分辨率、AlphaFold 的平均置信度）。这是以后 Agent 调数据库的最小原型。在 Mac 终端粘贴：\n```\npython3 -m pip install requests && python3 \"/Users/zhxu/Documents/obsidian_kb/我的知识库/11-AI生命科学/作品/练习/W01_egfr_lookup.py\"\n```\n把输出和你网页上看到的对一下。跑不通把报错发给我。\n\n### 怎么算做完\n`W01-EGFR笔记.md` 写完，能不看资料讲清楚\"EGFR 是什么、吉非替尼卡在哪、为什么 L858R 病人效果好\"。这就是本周过关。","ready":true,"intro":"**先看结论**：这一周整周都围绕一个故事——**肺癌药吉非替尼（易瑞沙）为什么只对一部分病人有奇效**。答案藏在一个叫 EGFR 的蛋白上：病人的 EGFR 基因上如果有一个特定突变（比如第 858 位的亮氨酸 L 变成了精氨酸 R，写作 L858R），这个蛋白就会\"卡在开机状态\"，同时变得更容易被药抓住。把这个故事讲清楚，你就把\"基因 → 蛋白 → 结构 → 药效\"这条主线捡回来了。\n\n**周六要做出什么**：亲手在 UniProt、PDB、AlphaFold 数据库里查 EGFR，在 3D 结构里找到吉非替尼卡在哪、858 位在哪；写一页笔记讲清这个故事。\n\n标「事实」的是公开信息，标「我的判断」的是我的看法，可以不同意。","sources":"- UniProt P00533（EGFR）：https://www.uniprot.org/uniprotkb/P00533/entry\n- RCSB PDB 4WKQ（EGFR 激酶域 + 吉非替尼，1.85 Å）：https://www.rcsb.org/structure/4WKQ\n- RCSB PDB 2ITY（正常 EGFR + 吉非替尼，3.42 Å）：https://www.rcsb.org/structure/2ITY\n- RCSB PDB 2ITZ（L858R + 吉非替尼，2.80 Å；引用 Yun C.-H. 等，Cancer Cell 2007，\"结合紧约 20 倍\"出自这篇）：https://www.rcsb.org/structure/2ITZ\n- Lynch T.J. 等，NEJM 2004：https://www.nejm.org/doi/full/10.1056/NEJMoa040938 （PubMed 摘要：https://pubmed.ncbi.nlm.nih.gov/15118073/ ）\n- Paez J.G. 等，Science 2004：https://www.science.org/doi/10.1126/science.1099314\n- AlphaFold 数据库 EGFR：https://alphafold.ebi.ac.uk/entry/P00533\n- EMBL 新闻，AlphaFold Database adds viral protein complexes，2026-09-24：https://www.embl.org/news/science-technology/alphafold-database-adds-viral-protein-complexes-to-support-pandemic-preparedness/\n- Nature 新闻，How a team of AIs discovered a promising lung-cancer drug，2026-09-17：https://www.nature.com/articles/d41586-026-02954-y\n- 新浪科技，多项研发成果落地，晶泰控股探索AI新药研发新路径，2026-09-24：https://finance.sina.com.cn/tech/roll/2026-09-24/doc-inisxnvc0344447.shtml","file":"W01-从基因到蛋白.md"}},{"date":"2026-10-11","week":4,"weekday":7,"weekdayCn":"周日","topic":"就业数据怎么读","scenario":null,"macro":null,"eng":null,"ai4s":{"week":1,"topic":"从基因到蛋白","heading":"休息，或补本周没做完的","md":"单数周不写公众号。想多看一点的话，三条延伸阅读：\n1. **美国国家癌症研究所（NCI）对 EGFR 靶向药的科普页**，看一个药从\"抑制 EGFR\"到进入指南的全貌：https://www.cancer.gov/about-cancer/treatment/types/targeted-therapies\n2. **PDB-101 的\"本月分子\"（Molecule of the Month）栏目**，搜 EGFR 或 \"Epidermal Growth Factor\"，是 PDB 官方给大众写的结构科普，图很漂亮：https://pdb101.rcsb.org/motm/motm-by-date\n3. **AlphaFold 数据库的置信度说明页**，为 W3 预热：https://alphafold.ebi.ac.uk/faq\n\n记得在总表写本周小结。","ready":true,"intro":"**先看结论**：这一周整周都围绕一个故事——**肺癌药吉非替尼（易瑞沙）为什么只对一部分病人有奇效**。答案藏在一个叫 EGFR 的蛋白上：病人的 EGFR 基因上如果有一个特定突变（比如第 858 位的亮氨酸 L 变成了精氨酸 R，写作 L858R），这个蛋白就会\"卡在开机状态\"，同时变得更容易被药抓住。把这个故事讲清楚，你就把\"基因 → 蛋白 → 结构 → 药效\"这条主线捡回来了。\n\n**周六要做出什么**：亲手在 UniProt、PDB、AlphaFold 数据库里查 EGFR，在 3D 结构里找到吉非替尼卡在哪、858 位在哪；写一页笔记讲清这个故事。\n\n标「事实」的是公开信息，标「我的判断」的是我的看法，可以不同意。","sources":"- UniProt P00533（EGFR）：https://www.uniprot.org/uniprotkb/P00533/entry\n- RCSB PDB 4WKQ（EGFR 激酶域 + 吉非替尼，1.85 Å）：https://www.rcsb.org/structure/4WKQ\n- RCSB PDB 2ITY（正常 EGFR + 吉非替尼，3.42 Å）：https://www.rcsb.org/structure/2ITY\n- RCSB PDB 2ITZ（L858R + 吉非替尼，2.80 Å；引用 Yun C.-H. 等，Cancer Cell 2007，\"结合紧约 20 倍\"出自这篇）：https://www.rcsb.org/structure/2ITZ\n- Lynch T.J. 等，NEJM 2004：https://www.nejm.org/doi/full/10.1056/NEJMoa040938 （PubMed 摘要：https://pubmed.ncbi.nlm.nih.gov/15118073/ ）\n- Paez J.G. 等，Science 2004：https://www.science.org/doi/10.1126/science.1099314\n- AlphaFold 数据库 EGFR：https://alphafold.ebi.ac.uk/entry/P00533\n- EMBL 新闻，AlphaFold Database adds viral protein complexes，2026-09-24：https://www.embl.org/news/science-technology/alphafold-database-adds-viral-protein-complexes-to-support-pandemic-preparedness/\n- Nature 新闻，How a team of AIs discovered a promising lung-cancer drug，2026-09-17：https://www.nature.com/articles/d41586-026-02954-y\n- 新浪科技，多项研发成果落地，晶泰控股探索AI新药研发新路径，2026-09-24：https://finance.sina.com.cn/tech/roll/2026-09-24/doc-inisxnvc0344447.shtml","file":"W01-从基因到蛋白.md"}}]};

<script>
(function(){
  "use strict";
  var DATA = (window.DAILY_DATA || {days:[]});
  var DAYS = {};
  (DATA.days||[]).forEach(function(d){ DAYS[d.date] = d; });

  /* ---------------- 小型 markdown 渲染 ---------------- */
  function esc(s){
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function inline(s){
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, function(_,c){ return "<code>"+c+"</code>"; });
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[\s（(])((?:https?:\/\/|www\.)[^\s，。；）)]+)/g,
        function(m,pre,url){
          var href = url.indexOf("http")===0 ? url : "https://"+url;
          return pre+'<a href="'+href+'" target="_blank" rel="noopener">'+url+"</a>";
        });
    return s;
  }
  function splitRow(line){
    var t = line.trim().replace(/^\|/,"").replace(/\|$/,"");
    return t.split("|").map(function(c){ return c.trim(); });
  }
  function renderTable(rows){
    var head = rows[0], body = rows.slice(2);
    if (head[0] === "词" || head[0] === "单词"){
      var out = '<div class="vocab">';
      body.forEach(function(r){
        out += '<div class="vrow"><span class="w">'+inline(r[0]||"")+'</span>'+
               '<span class="cn">'+inline(r[1]||"")+'</span>'+
               '<span class="use">'+inline(r[2]||"")+"</span></div>";
      });
      return out + "</div>";
    }
    var h = '<div class="tablewrap"><table><thead><tr>';
    head.forEach(function(c){ h += "<th>"+inline(c)+"</th>"; });
    h += "</tr></thead><tbody>";
    body.forEach(function(r){
      h += "<tr>";
      head.forEach(function(_,i){ h += "<td>"+inline(r[i]||"")+"</td>"; });
      h += "</tr>";
    });
    return h + "</tbody></table></div>";
  }

  function md2html(md){
    var lines = (md||"").split("\n");
    var out = [], i = 0, para = [], list = null, quote = [];
    var inJudgment = false;

    function flushPara(){
      if (!para.length) return;
      out.push("<p>"+inline(para.join(" ").trim())+"</p>");
      para = [];
    }
    function flushList(){
      if (!list) return;
      out.push("<"+list.tag+">"+list.items.map(function(it){
        return "<li>"+inline(it)+"</li>"; }).join("")+"</"+list.tag+">");
      list = null;
    }
    function flushQuote(){
      if (!quote.length) return;
      var inner = quote.join("\n");
      out.push("<blockquote>"+md2html(inner)+"</blockquote>");
      quote = [];
    }
    function flushAll(){ flushPara(); flushList(); flushQuote(); }
    function closeJudgment(){
      if (inJudgment){ out.push("</section>"); inJudgment = false; }
    }

    for (; i < lines.length; i++){
      var raw = lines[i], line = raw.trim();

      if (/^```/.test(line)){
        flushAll();
        var code = [];
        i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])){ code.push(lines[i].replace(/^ {0,3}/,"")); i++; }
        out.push('<div class="codewrap"><pre><code>'+esc(code.join("\n"))+'</code></pre>'+
                 '<button class="copybtn" type="button">复制</button></div>');
        continue;
      }

      if (!line){ flushAll(); continue; }

      if (/^>\s?/.test(line)){ flushPara(); flushList(); quote.push(line.replace(/^>\s?/,"")); continue; }
      flushQuote();

      if (/^---+$/.test(line)){ flushAll(); closeJudgment(); out.push("<hr>"); continue; }

      var hm = line.match(/^(#{3,4})\s+(.*)$/);
      if (hm){
        flushAll();
        var lvl = hm[1].length, txt = hm[2].trim();
        if (lvl === 3){
          closeJudgment();
          if (/^我的判断/.test(txt)){
            out.push('<section class="judgment">');
            inJudgment = true;
            out.push("<h3>"+inline(txt)+"</h3>");
            continue;
          }
          var sm = txt.match(/^(原始材料\s*\d*|事实)\s*[:：]\s*(.*)$/) || txt.match(/^(原始材料\s*\d*)\s*[:：]?\s*(.*)$/);
          if (sm){
            out.push('<h3><span class="src-label">'+esc(sm[1].replace(/\s+/g,""))+"</span>"+inline(sm[2])+"</h3>");
            continue;
          }
        }
        out.push("<h"+lvl+">"+inline(txt)+"</h"+lvl+">");
        continue;
      }

      if (/^\|.*\|/.test(line) && /^\|?[\s:-]*\|/.test((lines[i+1]||"").trim()) ){
        flushAll();
        var rows = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])){ rows.push(splitRow(lines[i])); i++; }
        i--;
        if (rows.length >= 2) out.push(renderTable(rows));
        continue;
      }

      var om = line.match(/^(\d+)\.\s+(.*)$/);
      if (om){
        flushPara();
        if (!list || list.tag !== "ol"){ flushList(); list = {tag:"ol", items:[]}; }
        list.items.push(om[2]);
        continue;
      }
      var um = line.match(/^[-*]\s+(.*)$/);
      if (um){
        flushPara();
        if (!list || list.tag !== "ul"){ flushList(); list = {tag:"ul", items:[]}; }
        list.items.push(um[1]);
        continue;
      }

      flushList();
      para.push(line);
    }
    flushAll(); closeJudgment();
    return out.join("\n");
  }

  /* ---------------- 读完标记（存在本机浏览器里） ---------------- */
  var KEY = "dp.read.v1";
  function readMarks(){
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") || {}; }
    catch(e){ return {}; }
  }
  function isDone(date, track){
    var m = readMarks()[date]; return !!(m && m[track]);
  }
  function toggleDone(date, track){
    var all = readMarks();
    var m = all[date] || (all[date] = {});
    m[track] = !m[track];
    try { localStorage.setItem(KEY, JSON.stringify(all)); } catch(e){}
    return m[track];
  }

  /* ---------------- 日期工具 ---------------- */
  function todayISO(){
    var n = new Date(Date.now() + (new Date().getTimezoneOffset()*60000) + 8*3600000);
    return n.toISOString().slice(0,10);
  }
  function iso2date(s){ var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function fmtMD(s){ var p = s.split("-"); return (+p[1])+"/"+(+p[2]); }
  function shift(s, n){ var d = iso2date(s); d.setDate(d.getDate()+n);
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  var WD = ["日","一","二","三","四","五","六"];

  var TODAY = todayISO();
  var allDates = Object.keys(DAYS).sort();
  var lastData = allDates.length ? allDates[allDates.length-1] : TODAY;

  // 轨道范围：往前至少 34 天，往后到最后一天有材料的日子
  var railStart = shift(TODAY, -34);
  if (DATA.planStart && DATA.planStart > railStart) railStart = DATA.planStart;
  var railEnd = lastData > TODAY ? lastData : TODAY;
  var railDates = [];
  for (var d = railStart; d <= railEnd; d = shift(d,1)) railDates.push(d);

  var KEYOF = {eng:"eng", macro:"macro", bio:"ai4s"};
  var TRACKS = ["eng","macro","bio"];
  function firstReady(date, pref){
    if (pref && ready(date, pref)) return pref;
    for (var k=0;k<TRACKS.length;k++) if (ready(date, TRACKS[k])) return TRACKS[k];
    return pref || "eng";
  }
  function bioBudget(date){
    var wd = iso2date(date).getDay();
    return wd === 6 ? "2 小时" : (wd === 0 ? "1.5 小时" : "40 MIN");
  }
  function ready(date, track){
    var day = DAYS[date]; if (!day) return false;
    var t = day[KEYOF[track]];
    return !!(t && t.ready);
  }

  /* ---------------- 状态 ---------------- */
  var sel = TODAY, tab = "eng";
  tab = firstReady(sel, "eng");

  var $ = function(id){ return document.getElementById(id); };

  /* ---------------- 日期轨 ---------------- */
  function buildRail(){
    var rail = $("daterail");
    rail.innerHTML = "";
    railDates.forEach(function(date){
      var b = document.createElement("button");
      var dt = iso2date(date), wd = dt.getDay();
      var hasE = ready(date,"eng"), hasM = ready(date,"macro"), hasB = ready(date,"bio");
      b.className = "dcell" + ((hasE||hasM||hasB) ? " has" : "") +
                    (wd===1 ? " mon" : "") + (date===TODAY ? " today" : "");
      b.type = "button";
      b.dataset.date = date;
      b.setAttribute("aria-label", date + " 周" + WD[wd]);
      b.innerHTML = '<span class="wd">'+WD[wd]+'</span><span class="md">'+fmtMD(date)+'</span>'+
        '<span class="dots"><i class="'+(hasE?"on-e":"")+'"></i><i class="'+(hasM?"on-m":"")+'"></i><i class="'+(hasB?"on-b":"")+'"></i></span>';
      b.addEventListener("click", function(){ select(date); });
      rail.appendChild(b);
    });
  }
  function syncRail(scroll){
    var cells = $("daterail").querySelectorAll(".dcell");
    for (var i=0;i<cells.length;i++){
      var on = cells[i].dataset.date === sel;
      cells[i].classList.toggle("sel", on);
      if (on && scroll) cells[i].scrollIntoView({block:"nearest", inline:"center",
        behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth"});
    }
  }

  /* ---------------- 左栏 ---------------- */
  function renderRail(){
    var day = DAYS[sel] || null;
    var dt = iso2date(sel);
    var wk = day ? day.week : null;

    $("kicker").textContent = (wk ? "第 " + wk + " 周 · " : "") +
      sel.slice(0,4) + "." + sel.slice(5,7) + "." + sel.slice(8,10);
    $("dayTitle").textContent = fmtMD(sel) + " 周" + WD[dt.getDay()] +
      (sel === TODAY ? "　今天" : "");

    var sub = [];
    if (day && day.topic) sub.push("本周宏观问题　<b>"+day.topic+"</b>");
    if (day && day.scenario) sub.push("今天英语场景　<b>"+day.scenario.sym+" "+day.scenario.name+"</b>");
    else if (day && day.weekday === 7) sub.push("周日是输出日　<b>复习 + 写一条帖子</b>");
    if (day && day.ai4s && day.ai4s.ready) sub.push("AI 生命科学　<b>"+(day.ai4s.week ? "W"+day.ai4s.week+" · " : "")+day.ai4s.topic+"</b>");
    $("daySub").innerHTML = sub.join("<br>");

    TRACKS.forEach(function(t){
      var btn = $("tab-"+t), has = ready(sel,t);
      btn.classList.toggle("done", isDone(sel,t));
      btn.setAttribute("aria-current", String(tab===t));
      btn.disabled = !has;
      btn.querySelector(".mi").textContent = has ? (t==="eng" ? "25 MIN" : (t==="macro" ? "35 MIN" : bioBudget(sel))) : "还没有";
    });

    // 本周七天
    var monday = shift(sel, -((iso2date(sel).getDay()+6)%7));
    $("weekhd").textContent = wk ? ("第 " + wk + " 周") : "这一周";
    var ol = $("weeklist"); ol.innerHTML = "";
    for (var k=0;k<7;k++){
      (function(date){
        var li = document.createElement("li");
        var hasE = ready(date,"eng"), hasM = ready(date,"macro"), hasB = ready(date,"bio");
        var dd = DAYS[date];
        var label = dd && dd.macro && dd.macro.ready ? dd.macro.heading
                  : (dd && dd.ai4s && dd.ai4s.ready ? dd.ai4s.heading
                  : (dd && dd.eng && dd.eng.ready ? "英语" : "—"));
        var b = document.createElement("button");
        b.type = "button";
        b.className = "wbtn" + ((hasE||hasM||hasB)?" has":"") + (date===sel?" cur":"");
        b.innerHTML = '<span class="d">'+WD[iso2date(date).getDay()]+'</span>'+
          '<span class="t">'+label.replace(/[（(].*$/,"")+'</span>'+
          '<span class="pips"><i class="'+(hasE?"d-e":"")+'"></i><i class="'+(hasM?"d-m":"")+'"></i><i class="'+(hasB?"d-b":"")+'"></i></span>';
        b.addEventListener("click", function(){ select(date); });
        li.appendChild(b); ol.appendChild(li);
      })(shift(monday, k));
    }

    $("stamp").innerHTML = "材料生成于 " + (DATA.generated || "—") +
      "<br>英语、宏观：每晚 21:00 写好第二天的<br>AI 生命科学：每周六写好下一整周";
    $("brandmeta").textContent = DAYS[TODAY] && DAYS[TODAY].week ? ("W" + DAYS[TODAY].week + " / 12") : "";
  }

  /* ---------------- 正文 ---------------- */
  function renderReader(){
    var day = DAYS[sel];
    var t = day ? day[KEYOF[tab]] : null;
    var r = $("reader");
    r.className = "reader t-" + tab;

    if (!t || !t.ready){
      var what = tab === "eng" ? "英语" : (tab === "macro" ? "宏观" : "AI 生命科学");
      var future = sel > TODAY;
      if (tab === "bio"){
        r.innerHTML = '<div class="empty"><b>'+fmtMD(sel)+" 的 AI 生命科学材料还没有</b>" +
          (future ? "每周六晚上会一次写好下一整周的。" : "这天没排这一节。") + "</div>";
        return;
      }
      r.innerHTML = '<div class="empty"><b>'+fmtMD(sel)+" 的"+what+"材料还没有</b>" +
        (future ? "每晚 21:00 会写好第二天的，明早再来。"
                : (day && day.weekday===6 && tab==="macro"
                   ? "周六不排宏观，去读 013 的周记草稿。"
                   : "这天没排这一节。")) + "</div>";
      return;
    }

    var tag = tab === "eng" ? "英语 · 默读" : (tab === "macro" ? "宏观 · 阅读" : "AI 生命科学");
    var budget = tab === "eng" ? "25 MIN" : (tab === "macro" ? "35 MIN" : bioBudget(sel));
    var html = '<div class="secthead"><span class="tag">'+tag+'</span>'+
               '<span class="budget">'+budget+'</span></div>';
    html += '<h2 class="title">'+t.heading.replace(/^读物[:：]\s*/,"")+"</h2>";

    var topic = tab === "eng"
      ? (day.scenario ? "今天的场景 " + day.scenario.sym + " " + day.scenario.name : "输出日")
      : (tab === "macro" ? ("第 " + day.week + " 周 · " + day.topic)
      : ((t.week ? "第 " + t.week + " 周 · " : "准备周 · ") + t.topic));
    html += '<p class="topicline">'+topic+"</p>";

    var guide = tab === "eng" ? t.howto : t.intro;
    if (guide){
      var label = tab === "eng" ? "怎么用（20–25 分钟）" : "先看结论";
      var open = tab === "eng" ? "" : (tab === "bio" && day.weekday !== 1 && !(t.week === 0 && sel === "2026-09-29") ? "" : " open");
      var g = guide.replace(/^\s*\*\*(先看结论|怎么用[^*]*)\*\*\s*[：:]\s*/, "");
      html += '<details class="note"'+open+'><summary>'+label+"</summary>"+md2html(g)+"</details>";
    }
    if (tab === "eng"){
      html += '<p class="murmur"><em>加粗的句子</em>读第二遍时在心里默念</p>';
    }

    html += '<div class="body'+(tab==="eng"?" read-en":"")+'">'+md2html(t.md)+"</div>";

    if (t.sources){
      html += '<details class="note"><summary>来源</summary>'+md2html(t.sources)+"</details>";
    }

    var done = isDone(sel, tab);
    var doneTxt = tab === "bio" ? "✓ 已做完" : "✓ 已读完", todoTxt = tab === "bio" ? "标记做完" : "标记读完";
    html += '<div class="finish"><button class="markbtn'+(done?" done":"")+'" id="markbtn">'+
            (done ? doneTxt : todoTxt) + '</button>'+
            '<span class="hint">只存在这台设备的浏览器里，Obsidian 总表还是自己打勾</span></div>';

    r.innerHTML = html;

    // 代码块复制
    var cbs = r.querySelectorAll(".copybtn");
    for (var ci=0; ci<cbs.length; ci++){
      cbs[ci].addEventListener("click", function(){
        var btn = this, code = btn.parentNode.querySelector("code");
        var txt = code ? code.textContent : "";
        function ok(){ btn.textContent = "已复制"; setTimeout(function(){ btn.textContent = "复制"; }, 1500); }
        function fallback(){
          try{ var rg = document.createRange(); rg.selectNodeContents(code);
               var sl = window.getSelection(); sl.removeAllRanges(); sl.addRange(rg);
               btn.textContent = "已选中，按 ⌘C"; }catch(e){}
        }
        try{
          if (navigator.clipboard && navigator.clipboard.writeText){
            navigator.clipboard.writeText(txt).then(ok, fallback);
          } else fallback();
        }catch(e){ fallback(); }
      });
    }

    // 英语读物正文用衬线体（只对第一段块）
    var mb = $("markbtn");
    if (mb) mb.addEventListener("click", function(){
      var now = toggleDone(sel, tab);
      mb.classList.toggle("done", now);
      mb.textContent = now ? doneTxt : todoTxt;
      $("tab-"+tab).classList.toggle("done", now);
    });
  }

  /* ---------------- 切换 ---------------- */
  function select(date, keepScroll){
    if (!railDates.length) return;
    if (date < railDates[0]) date = railDates[0];
    if (date > railDates[railDates.length-1]) date = railDates[railDates.length-1];
    sel = date;
    if (!ready(sel, tab)) tab = firstReady(sel, tab);
    $("jump").value = sel;
    renderRail(); renderReader(); syncRail(true);
    if (!keepScroll) window.scrollTo({top:0, behavior:"auto"});
  }
  function setTab(t){
    if (t === tab) return;
    tab = t; renderRail(); renderReader();
  }

  TRACKS.forEach(function(t){
    $("tab-"+t).addEventListener("click", function(){ if (!this.disabled) setTab(t); });
  });
  $("btn-today").addEventListener("click", function(){ select(TODAY); });
  $("jump").addEventListener("change", function(){ if (this.value) select(this.value); });
  $("jump").min = railDates[0]; $("jump").max = railDates[railDates.length-1];

  document.addEventListener("keydown", function(e){
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "ArrowLeft"){ select(shift(sel,-1), true); }
    else if (e.key === "ArrowRight"){ select(shift(sel,1), true); }
    else if (e.key === "e" || e.key === "E"){ if(ready(sel,"eng")) setTab("eng"); }
    else if (e.key === "m" || e.key === "M"){ if(ready(sel,"macro")) setTab("macro"); }
    else if (e.key === "b" || e.key === "B"){ if(ready(sel,"bio")) setTab("bio"); }
  });

  buildRail();
  select(TODAY);
})();
</script>

</body></html>
